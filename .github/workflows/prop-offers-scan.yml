name: Prop offers scan
# Opens every prop firm's own website + YouTube feed each morning and saves the promo text
# to prop-firms/scan/latest.json. The 06:30 London offers check reads it.
on:
  schedule:
    - cron: "40 5 * * *"   # 05:40 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prop-offers-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Scan firm sites
        run: python tools/prop-scan/scan.py .
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prop-firms/scan/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Prop scan $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
