<script type="text/babel">
const { useState, useEffect } = React;

const Icon = ({ name, className }) => {
  const ref = React.useRef(null);
  useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = '';
      const svg = lucide.createElement(lucide[name]);
      ref.current.appendChild(svg);
    }
  }, [name]);
  return <span ref={ref} className={className}></span>;
};

const fmt = (n) => {
  if (n === null || n === undefined || isNaN(n)) return '$0.00';
  const sign = n < 0 ? '-' : '';
  return `${sign}$${Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
};

// ---------------------------------------------------------------------
// WIN-RATE TIERED SURVIVABILITY TABLE
// Challenge: aggressive-but-controlled, clear the target fast.
// Funded & Live: BOTH protect real capital (funded payout eligibility /
// live personal money), so they share the same conservative divisor per
// tier — never derived by doubling the challenge number.
// ---------------------------------------------------------------------
const DIVISOR_TABLE = {
  scalper:  { label: '70%+ win rate (high-accuracy scalper)', range: '70%+',      challenge: 12, funded: 25, live: 25 },
  reliable: { label: '55–69% win rate (reliable day trader)', range: '55–69%',    challenge: 18, funded: 35, live: 35 },
  average:  { label: '45–54% win rate (average — default)',   range: '45–54%',    challenge: 25, funded: 50, live: 50 },
  trend:    { label: 'Under 45% win rate (trend follower)',   range: '<45%',      challenge: 45, funded: 90, live: 90 },
};

const MIN_SAMPLE_SIZE = 30;

const determineTier = (winRate, sampleSize) => {
  const wr = parseFloat(winRate);
  const ss = parseInt(sampleSize);
  if (!wr || !ss || ss < MIN_SAMPLE_SIZE) return 'average';
  if (wr >= 70) return 'scalper';
  if (wr >= 55) return 'reliable';
  if (wr >= 45) return 'average';
  return 'trend';
};

const getDivisor = (account) => {
  const tier = DIVISOR_TABLE[account.winRateTier] ? account.winRateTier : 'average';
  return DIVISOR_TABLE[tier][account.accountType] || DIVISOR_TABLE[tier].average;
};

const computeStatus = (account, buffer, totalPnl) => {
  const target = parseFloat(account.profitTarget) || 0;
  if (buffer <= 0) return 'breached';
  if (target > 0 && totalPnl >= target) {
    return account.accountType === 'challenge' ? 'passed' : 'target-hit';
  }
  return 'active';
};

const STATUS_STYLES = {
  active:     { label: 'Active',        cls: 'bg-blue-500/15 text-blue-300 border-blue-500/30' },
  passed:     { label: 'Passed ✓',       cls: 'bg-green-500/15 text-green-300 border-green-500/30' },
  'target-hit':{ label: 'Target Hit ✓',  cls: 'bg-green-500/15 text-green-300 border-green-500/30' },
  breached:   { label: 'Breached',      cls: 'bg-red-500/15 text-red-300 border-red-500/30' },
};

const ACCOUNT_TYPES = [

  { key: 'funded',    label: 'Funded',    activeCls: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' },
  { key: 'live',      label: 'Live',      activeCls: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40' },
];

const ACCOUNT_BADGE_CLS = {

};

const BIAS_OPTIONS = [

// ---------------- AUTH SCREEN ----------------
function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [displayName, setDisplayName] = useState('');

  const handleSubmit = async () => {

    setLoading(true);
    try {

        const cred = await auth.createUserWithEmailAndPassword(email, password);

        <input value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" type="password"

// ---------------- RISK OF RUIN PROJECTION ----------------
// remaining = referenceBuffer * (1 - 1/divisor) ^ n
// recoveryPct = % gain needed on the REMAINING amount to climb back to referenceBuffer
function RiskOfRuinCard({ currentBuffer, divisor, accountType }) {
  const checkpoints = [5, 10, 15, 20, 25, 30, 40, 50].filter(n => n <= divisor * 2.5);
  const rows = checkpoints.map(n => {
    const remaining = currentBuffer * Math.pow(1 - 1 / divisor, n);
    const pctRemaining = currentBuffer > 0 ? (remaining / currentBuffer) * 100 : 0;
    const recoveryPct = remaining > 0 ? ((currentBuffer - remaining) / remaining) * 100 : null;
    return { n, remaining, pctRemaining, recoveryPct };
  });

  return (
    <div className="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6">
      <div className="flex items-center gap-2 mb-1">
        <Icon name="TrendingDown" className="h-5 w-5 text-red-400" />
        <h2 className="text-lg font-semibold text-white">Risk of Ruin — Consecutive Loss Projection</h2>
      </div>
      <p className="text-xs text-gray-500 mb-4">
        Hypothetical: if every trade lost at the current max risk (buffer ÷ {divisor}). "Gain needed to recover" is the
        % return required on what's left just to climb back to today's buffer — not the amount lost.
      </p>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-gray-500 text-xs uppercase tracking-wide border-b border-gray-800">
              <th className="pb-2 pr-4">Consecutive Losses</th>
              <th className="pb-2 pr-4">Buffer Remaining</th>
              <th className="pb-2 pr-4">% of Buffer Left</th>
              <th className="pb-2">Gain Needed to Recover</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.n} className="border-b border-gray-800/50 last:border-0">
                <td className="py-2 pr-4 text-white font-medium">{r.n} losses</td>
                <td className={`py-2 pr-4 font-semibold ${r.pctRemaining <= 20 ? 'text-red-400' : r.pctRemaining <= 50 ? 'text-yellow-400' : 'text-green-400'}`}>
                  {fmt(r.remaining)}
                </td>
                <td className="py-2 pr-4">
                  <div className="flex items-center gap-2">
                    <div className="w-20 bg-gray-800 rounded-full h-1.5 overflow-hidden">
                      <div className={`h-full rounded-full ${r.pctRemaining <= 20 ? 'bg-red-400' : r.pctRemaining <= 50 ? 'bg-yellow-400' : 'bg-green-400'}`}
                        style={{ width: `${Math.max(r.pctRemaining, 2)}%` }}></div>
                    </div>
                    <span className={`text-xs ${r.pctRemaining <= 20 ? 'text-red-400' : r.pctRemaining <= 50 ? 'text-yellow-400' : 'text-green-400'}`}>
                      {r.pctRemaining.toFixed(1)}%
                    </span>
                  </div>
                </td>
                <td className="py-2">
                  {r.recoveryPct === null ? (
                    <span className="text-red-500 font-semibold">Account wiped</span>
                  ) : (
                    <span className={`font-semibold ${r.recoveryPct >= 100 ? 'text-red-400' : r.recoveryPct >= 40 ? 'text-yellow-400' : 'text-gray-300'}`}>
                      +{r.recoveryPct.toFixed(1)}% needed
                    </span>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-gray-600 mt-3">
        {accountType === 'challenge'
          ? 'Challenge accounts use a tighter divisor to clear the target faster — the trade-off is a losing streak erodes the buffer, and recovery gets steep, quicker.'
          : 'Funded and Live accounts use a wider divisor on purpose — the buffer erodes slower and the recovery math stays gentler under a bad streak, protecting real capital.'}
      </p>
    </div>
  );
}

// ---------------- STRATEGY RULES DISPLAY ----------------

  const shortRules = (account.shortRules || []).filter(r => r && r.trim());

  return (
    <div className="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6">

      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div className="bg-black/40 border border-green-800/40 rounded-xl p-4">
          <p className="text-xs uppercase tracking-wide text-green-400 font-semibold mb-2 flex items-center gap-1">
            <Icon name="TrendingUp" className="h-3.5 w-3.5" /> Long Setup Rules
          </p>
          {longRules.length === 0 ? <p className="text-xs text-gray-600">No rules defined.</p> : (
            <ul className="space-y-1.5">
              {longRules.map((r, i) => (
                <li key={i} className="text-sm text-gray-300 flex items-start gap-2">
                  <span className="text-green-400 mt-0.5">•</span>{r}
                </li>
              ))}
            </ul>
          )}
        </div>
        <div className="bg-black/40 border border-red-800/40 rounded-xl p-4">
          <p className="text-xs uppercase tracking-wide text-red-400 font-semibold mb-2 flex items-center gap-1">
            <Icon name="TrendingDown" className="h-3.5 w-3.5" /> Short Setup Rules
          </p>
          {shortRules.length === 0 ? <p className="text-xs text-gray-600">No rules defined.</p> : (
            <ul className="space-y-1.5">
              {shortRules.map((r, i) => (
                <li key={i} className="text-sm text-gray-300 flex items-start gap-2">
                  <span className="text-red-400 mt-0.5">•</span>{r}
                </li>

// ---------------- MAIN JOURNAL ----------------
function MMMJournal({ user }) {
  const [accounts, setAccounts] = useState([]);
  const [entries, setEntries] = useState([]);
  const [activeAccountId, setActiveAccountId] = useState(null);
  const [showAddAccount, setShowAddAccount] = useState(false);
  const [showAddEntry, setShowAddEntry] = useState(false);
  const [expandedEntry, setExpandedEntry] = useState(null);
  const [newAccount, setNewAccount] = useState(emptyAccountForm);
  const [newEntry, setNewEntry] = useState(emptyEntryForm());

  const accountsRef = db.collection('users').doc(user.uid).collection('accounts');
  const entriesRef = db.collection('users').doc(user.uid).collection('entries');

  useEffect(() => {
    const unsub = accountsRef.orderBy('createdAt', 'asc').onSnapshot(snap => {
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setAccounts(list);
      if (list.length && !activeAccountId) setActiveAccountId(list[0].id);
    });
    return unsub;
  }, [user.uid]);

  useEffect(() => {
    const unsub = entriesRef.orderBy('date', 'desc').onSnapshot(snap => {
      setEntries(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, [user.uid]);

  const activeAccount = accounts.find(a => a.id === activeAccountId);
  const accountEntries = entries.filter(e => e.accountId === activeAccountId);
  const divisor = activeAccount ? getDivisor(activeAccount) : DIVISOR_TABLE.average.challenge;

  const calcBufferHistory = (account, accEntries) => {
    if (!account) return [];
    const d = getDivisor(account);
    const chronological = [...accEntries].sort((a, b) => new Date(a.date) - new Date(b.date));
    let buffer = parseFloat(account.maxDrawdown) || 0;
    const history = [];
    chronological.forEach(entry => {
      const signedPnl = entry.trades.reduce((s, t) => {
        const val = Math.abs(parseFloat(t.pnl) || 0);
        return s + (t.result === 'win' ? val : -val);
      }, 0);
      buffer = buffer + signedPnl;
      history.push({ date: entry.date, buffer, pnl: signedPnl, riskPerTrade: Math.max(buffer, 0) / d });
    });
    return history;
  };

  const bufferHistory = activeAccount ? calcBufferHistory(activeAccount, accountEntries) : [];
  const currentBuffer = bufferHistory.length > 0 ? bufferHistory[bufferHistory.length - 1].buffer : (activeAccount ? parseFloat(activeAccount.maxDrawdown) || 0 : 0);
  const riskPerTrade = Math.max(currentBuffer, 0) / divisor;
  const microsUnlocked = Math.max(1, Math.floor(Math.max(currentBuffer, 0) / 1000));
  const nextTierAt = (microsUnlocked + 1) * 1000;
  const distToNextTier = nextTierAt - currentBuffer;

  const totalPnl = accountEntries.reduce((sum, e) => sum + e.trades.reduce((s, t) => {
    const val = Math.abs(parseFloat(t.pnl) || 0);
    return s + (t.result === 'win' ? val : -val);
  }, 0), 0);

  const winTrades = accountEntries.flatMap(e => e.trades).filter(t => t.result === 'win').length;
  const lossTrades = accountEntries.flatMap(e => e.trades).filter(t => t.result === 'loss').length;
  const totalTrades = winTrades + lossTrades;
  const winRate = totalTrades > 0 ? (winTrades / totalTrades) * 100 : 0;
  const activeStatus = activeAccount ? computeStatus(activeAccount, currentBuffer, totalPnl) : 'active';

  const getAccountStatus = (acc) => {
    const accE = entries.filter(e => e.accountId === acc.id);
    const hist = calcBufferHistory(acc, accE);
    const buf = hist.length > 0 ? hist[hist.length - 1].buffer : (parseFloat(acc.maxDrawdown) || 0);
    const pnl = accE.reduce((sum, e) => sum + e.trades.reduce((s, t) => {
      const val = Math.abs(parseFloat(t.pnl) || 0);
      return s + (t.result === 'win' ? val : -val);
    }, 0), 0);
    return computeStatus(acc, buf, pnl);
  };

  // --- Account rule lists / lookups for the checklist ---
  const rulesForDirection = (direction) => {
    if (!activeAccount) return [];
    const list = direction === 'long' ? activeAccount.longRules : activeAccount.shortRules;
    return (list || []).filter(r => r && r.trim());
  };

  const biasAligns = (bias, direction) => {
    if (bias === 'neutral') return null;
    if (bias === 'bullish') return direction === 'long';
    if (bias === 'bearish') return direction === 'short';
    return null;
  };

  const handleAddAccount = async () => {
    if (!newAccount.name || !newAccount.startingBalance || !newAccount.maxDrawdown) return;
    const tier = determineTier(newAccount.backtestWinRate, newAccount.backtestSampleSize);
    const doc = await accountsRef.add({
      name: newAccount.name,
      startingBalance: parseFloat(newAccount.startingBalance),
      maxDrawdown: parseFloat(newAccount.maxDrawdown),
      profitTarget: parseFloat(newAccount.profitTarget) || 0,
      accountType: newAccount.accountType,
      copiedAccountNumber: newAccount.copiedAccountNumber || '',
      linkedFromId: newAccount.linkedFromId || null,
      backtestWinRate: newAccount.backtestWinRate ? parseFloat(newAccount.backtestWinRate) : null,
      backtestSampleSize: newAccount.backtestSampleSize ? parseInt(newAccount.backtestSampleSize) : null,
      winRateTier: tier,
      strategyName: newAccount.strategyName || '',
      longRules: newAccount.longRules.filter(r => r && r.trim()),
      shortRules: newAccount.shortRules.filter(r => r && r.trim()),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    setActiveAccountId(doc.id);
    setNewAccount(emptyAccountForm);
    setShowAddAccount(false);
  };

  const handleStartFundedFromChallenge = (challengeAcc) => {
    setNewAccount({
      ...emptyAccountForm,
      accountType: 'funded',
      name: challengeAcc.name.replace(/challenge/i, '').trim() + ' - Funded',
      startingBalance: challengeAcc.startingBalance,
      backtestWinRate: challengeAcc.backtestWinRate || '',
      backtestSampleSize: challengeAcc.backtestSampleSize || '',
      winRateTier: challengeAcc.winRateTier || 'average',
      strategyName: challengeAcc.strategyName || '',
      longRules: challengeAcc.longRules && challengeAcc.longRules.length ? challengeAcc.longRules : [''],
      shortRules: challengeAcc.shortRules && challengeAcc.shortRules.length ? challengeAcc.shortRules : [''],
      linkedFromId: challengeAcc.id,
    });
    setShowAddAccount(true);
  };

  const handleDeleteAccount = async (id) => {
    if (!confirm('Delete this account and all its journal entries?')) return;
    const batchEntries = await entriesRef.where('accountId', '==', id).get();
    const batch = db.batch();
    batchEntries.forEach(d => batch.delete(d.ref));
    batch.delete(accountsRef.doc(id));
    await batch.commit();
    if (activeAccountId === id) setActiveAccountId(null);
  };

  // --- newAccount rule list helpers ---
  const addRuleRow = (field) => setNewAccount({ ...newAccount, [field]: [...newAccount[field], ''] });
  const updateRuleRow = (field, idx, value) => {
    const list = [...newAccount[field]];
    list[idx] = value;
    setNewAccount({ ...newAccount, [field]: list });
  };
  const removeRuleRow = (field, idx) => setNewAccount({ ...newAccount, [field]: newAccount[field].filter((_, i) => i !== idx) });

  // --- newEntry trade helpers ---
  const addTradeRow = () => setNewEntry({ ...newEntry, trades: [...newEntry.trades, { result: 'win', pnl: '', direction: 'long', rulesChecked: [] }] });
  const removeTradeRow = (idx) => setNewEntry({ ...newEntry, trades: newEntry.trades.filter((_, i) => i !== idx) });
  const updateTradeRow = (idx, field, value) => {
    const trades = [...newEntry.trades];
    trades[idx] = { ...trades[idx], [field]: value };
    if (field === 'direction') trades[idx].rulesChecked = []; // reset checklist when direction changes
    setNewEntry({ ...newEntry, trades });
  };
  const toggleRuleChecked = (tradeIdx, ruleText) => {
    const trades = [...newEntry.trades];
    const current = trades[tradeIdx].rulesChecked || [];
    trades[tradeIdx].rulesChecked = current.includes(ruleText)
      ? current.filter(r => r !== ruleText)
      : [...current, ruleText];
    setNewEntry({ ...newEntry, trades });
  };

  const handleSaveEntry = async () => {
    const validTrades = newEntry.trades.filter(t => t.pnl !== '');
    if (validTrades.length === 0 || !activeAccountId) return;
    await entriesRef.add({
      accountId: activeAccountId,
      date: newEntry.date,
      dailyBias: newEntry.dailyBias,
      trades: validTrades,
      notes: newEntry.notes
    });
    setNewEntry(emptyEntryForm());
    setShowAddEntry(false);
  };

  const handleDeleteEntry = async (id) => { await entriesRef.doc(id).delete(); };

  const previewTier = determineTier(newAccount.backtestWinRate, newAccount.backtestSampleSize);
  const previewDivisor = DIVISOR_TABLE[previewTier][newAccount.accountType] || DIVISOR_TABLE[previewTier].average;
  const sampleTooSmall = newAccount.backtestSampleSize && parseInt(newAccount.backtestSampleSize) < MIN_SAMPLE_SIZE;

  return (
    <div className="min-h-screen bg-black text-white p-4 md:p-8">
      <div className="max-w-5xl mx-auto space-y-6">

        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>

                      </button>
                      <button onClick={() => updateTradeRow(idx, 'direction', 'short')}
                        className={`px-2.5 py-1.5 rounded-lg text-xs font-medium transition ${trade.direction === 'short' ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-gray-800 text-gray-500 border border-gray-700'}`}>
                        Short
                      </button>
                      {aligned !== null && (
                        <span className={`text-[10px] px-2 py-1 rounded flex items-center gap-1 ${aligned ? 'bg-green-500/15 text-green-400' : 'bg-orange-500/15 text-orange-400'}`}>
                          <Icon name={aligned ? "CheckCircle" : "AlertTriangle"} className="h-2.5 w-2.5" />
                          {aligned ? 'With trend' : 'Against bias'}
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => updateTradeRow(idx, 'result', 'win')}
                        className={`px-3 py-2 rounded-lg text-sm font-medium transition ${trade.result === 'win' ? 'bg-green-500/20 text-green-400 border border-green-500/40' : 'bg-gray-800 text-gray-500 border border-gray-700'}`}>Win</button>
                      <button onClick={() => updateTradeRow(idx, 'result', 'loss')}
                        className={`px-3 py-2 rounded-lg text-sm font-medium transition ${trade.result === 'loss' ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-gray-800 text-gray-500 border border-gray-700'}`}>Loss</button>
                      <input type="number" placeholder="P&L amount" value={trade.pnl} onChange={e => updateTradeRow(idx, 'pnl', e.target.value)}
                        className="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 focus:border-yellow-400/50 outline-none" />
                      {newEntry.trades.length > 1 && (
                        <button onClick={() => removeTradeRow(idx)} className="text-gray-500 hover:text-red-400"><Icon name="X" className="h-4 w-4" /></button>
                      )}
                    </div>
                    {applicableRules.length > 0 && (
                      <div className="bg-black/30 rounded-lg p-2.5 space-y-1.5">
                        <p className="text-[11px] text-gray-500 uppercase tracking-wide">Did you follow your {trade.direction} rules?</p>
                        {applicableRules.map((rule, ri) => {
                          const checked = (trade.rulesChecked || []).includes(rule);
                          return (
                            <button key={ri} onClick={() => toggleRuleChecked(idx, rule)}
                              className="w-full flex items-center gap-2 text-left text-xs text-gray-300 hover:text-white">
                              <Icon name={checked ? "CheckSquare" : "Square"} className={`h-4 w-4 flex-shrink-0 ${checked ? 'text-green-400' : 'text-gray-600'}`} />
                              {rule}
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
              <button onClick={addTradeRow} className="text-sm text-yellow-400 hover:text-yellow-300 flex items-center gap-1 mt-1">
                <Icon name="Plus" className="h-3 w-3" /> Add another trade
              </button>
            </div>

            <Field label="Notes (optional)">
              <textarea value={newEntry.notes} onChange={e => setNewEntry({ ...newEntry, notes: e.target.value })} placeholder="What went well? What to fix tomorrow?"
                className="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 h-20 focus:border-yellow-400/50 outline-none resize-none"></textarea>
            </Field>
            <button onClick={handleSaveEntry} disabled={newEntry.trades.every(t => t.pnl === '')}
              className="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-black py-2.5 rounded-lg font-semibold disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
              <Icon name="Save" className="h-4 w-4" /> Save Entry
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function StatCard({ label, value, icon, color, sub }) {
  return (
    <div className="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-xl p-4">
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs text-gray-500 uppercase tracking-wide">{label}</span>
        <Icon name={icon} className={`h-4 w-4 ${color}`} />
      </div>
      <div className={`text-xl font-bold ${color}`}>{value}</div>
      {sub && <div className="text-xs text-gray-600 mt-0.5">{sub}</div>}
    </div>
  );
}

function Modal({ onClose, title, children, size = 'md' }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="fixed inset-0 bg-black bg-opacity-80" onClick={onClose}></div>
      <div className={`relative bg-black border border-yellow-500/20 rounded-2xl p-6 w-full ${size === 'lg' ? 'max-w-lg' : 'max-w-md'} max-h-[90vh] overflow-y-auto shadow-2xl`}>
        <div className="flex items-center justify-between mb-5">
          <h3 className="text-lg font-bold text-white">{title}</h3>
          <button onClick={onClose} className="text-gray-500 hover:text-white"><Icon name="X" className="h-5 w-5" /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (<div><label className="block text-sm text-gray-400 mb-1">{label}</label>{children}</div>);
}

// ---------------- ROOT ----------------
function App() {
  const [user, setUser] = useState(undefined);
  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setUser(u));
    return unsub;
  }, []);

  if (user === undefined) {
    return <div className="min-h-screen bg-black flex items-center justify-center text-yellow-400">Loading...</div>;
  }
  return user ? <MMMJournal user={user} /> : <AuthScreen />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
