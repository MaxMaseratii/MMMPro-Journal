<script type="text/babel">
const { useState, useEffect } = React;

// ---------------------------------------------------------------------
// ICON — SVG always fills its container exactly, so it never overflows
// and throws off alignment next to text.
// ---------------------------------------------------------------------
const Icon = ({ name, className }) => {
  const ref = React.useRef(null);
  useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = '';
      const iconFn = lucide[name] || lucide['HelpCircle'];
      const svg = lucide.createElement(iconFn);
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
      svg.style.display = 'block';
      ref.current.appendChild(svg);
    }
  }, [name]);
  return <span ref={ref} className={`inline-flex items-center justify-center flex-shrink-0 ${className || ''}`}></span>;
};

const fmt = (n) => {
  if (n === null || n === undefined || isNaN(n)) return '$0.00';
  const sign = n < 0 ? '-' : '';
  return `${sign}$${Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
};

// ---------------------------------------------------------------------
// RTUC (Risk Tolerance Unit Capacity) TABLE — set by backtested win rate.
// Challenge stays aggressive to clear the target fast. Funded & Live both
// use the same conservative RTUC per tier — protecting real capital
// either way, never derived by doubling the Challenge number.
// ---------------------------------------------------------------------
const DIVISOR_TABLE = {
  scalper:  { label: '70%+ win rate (high-accuracy scalper)', range: '70%+',      challenge: 12, funded: 25, live: 25 },
  reliable: { label: '55-69% win rate (reliable day trader)', range: '55-69%',    challenge: 18, funded: 35, live: 35 },
  average:  { label: '45-54% win rate (average - default)',   range: '45-54%',    challenge: 25, funded: 50, live: 50 },
  trend:    { label: 'Under 45% win rate (trend follower)',   range: '<45%',      challenge: 45, funded: 90, live: 90 },
};

const MIN_SAMPLE_SIZE = 30;

const determineTier = (winRate, sampleSize) => {
  const wr = parseFloat(winRate);
  const ss = parseInt(sampleSize);
  if (!wr || !ss || ss < MIN_SAMPLE_SIZE) return 'average';
  if (wr >= 70) return 'scalper';
  if (wr >= 55) return 'reliable';
  if (wr >= 45) return 'average';
  return 'trend';
};

const getRTUC = (account) => {
  const tier = DIVISOR_TABLE[account.winRateTier] ? account.winRateTier : 'average';
  return DIVISOR_TABLE[tier][account.accountType] || DIVISOR_TABLE[tier].average;
};

const computeStatus = (account, buffer, totalPnl) => {
  const target = parseFloat(account.profitTarget) || 0;
  if (buffer <= 0) return 'breached';
  if (target > 0 && totalPnl >= target) {
    return account.accountType === 'challenge' ? 'passed' : 'target-hit';
  }
  return 'active';
};

const STATUS_STYLES = {
  active:      { label: 'Active',       cls: 'bg-blue-500/15 text-blue-300 border-blue-500/30' },
  passed:      { label: 'Passed', cls: 'bg-green-500/15 text-green-300 border-green-500/30' },
  'target-hit':{ label: 'Target Hit', cls: 'bg-green-500/15 text-green-300 border-green-500/30' },
  breached:    { label: 'Breached',     cls: 'bg-red-500/15 text-red-300 border-red-500/30' },
};

const ACCOUNT_TYPES = [
  { key: 'challenge', label: 'Challenge', activeCls: 'bg-purple-500/20 text-purple-400 border-purple-500/40' },
  { key: 'funded',    label: 'Funded',    activeCls: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' },
  { key: 'live',      label: 'Live',      activeCls: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40' },
];

const ACCOUNT_BADGE_CLS = {
  challenge: 'bg-purple-500/20 text-purple-300',
  funded: 'bg-emerald-500/20 text-emerald-300',
  live: 'bg-cyan-500/20 text-cyan-300',
};

const BIAS_OPTIONS = [
  { key: 'bullish', label: 'Bullish', icon: 'TrendingUp', cls: 'bg-green-500/20 text-green-400 border-green-500/40' },
  { key: 'bearish', label: 'Bearish', icon: 'TrendingDown', cls: 'bg-red-500/20 text-red-400 border-red-500/40' },

// ---------------- AUTH SCREEN ----------------
function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [displayName, setDisplayName] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async () => {
    setError('');
    if (!email || !password) { setError('Enter email and password.'); return; }
    setLoading(true);
    try {
      if (mode === 'signup') {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        if (displayName) await cred.user.updateProfile({ displayName });
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }
    } catch (e) {
      setError(e.message.replace('Firebase: ', ''));
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen bg-black text-white flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-gradient-to-br from-gray-900 to-black border border-yellow-500/20 rounded-2xl p-8">
        <h1 className="text-2xl font-bold bg-gradient-to-r from-yellow-400 via-yellow-300 to-yellow-500 bg-clip-text text-transparent text-center mb-1">
          MMM Pro Journal
        </h1>
        <p className="text-gray-500 text-sm text-center mb-6">{mode === 'login' ? 'Sign in to your account' : 'Create your account'}</p>

        {mode === 'signup' && (
          <input value={displayName} onChange={e => setDisplayName(e.target.value)} placeholder="Your name"
            className="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 mb-3 focus:border-yellow-400/50 outline-none" />
        )}
        <input value={email} onChange={e => setEmail(e.target.value)} placeholder="Email" type="email"
          className="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 mb-3 focus:border-yellow-400/50 outline-none" />
        <input value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" type="password"
          className="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 mb-3 focus:border-yellow-400/50 outline-none" />

        {error && <p className="text-red-400 text-xs mb-3">{error}</p>}

        <button onClick={handleSubmit} disabled={loading}
          className="w-full bg-gradient-to-r from-yellow-400 to-yellow-600 text-black py-2.5 rounded-lg font-semibold disabled:opacity-50 mb-3">
          {loading ? 'Please wait...' : mode === 'login' ? 'Sign In' : 'Create Account'}
        </button>

        <p className="text-center text-sm text-gray-500">
          {mode === 'login' ? "Don't have an account?" : "Already have an account?"}{' '}
          <button onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setError(''); }} className="text-yellow-400 hover:underline">
            {mode === 'login' ? 'Sign up' : 'Sign in'}
          </button>
        </p>
      </div>
    </div>
  );
}

// ---------------- RISK OF RUIN PROJECTION ----------------
function RiskOfRuinCard(props) {
  const currentBuffer = props.currentBuffer;
  const rtuc = props.rtuc;
  const accountType = props.accountType;
  const checkpoints = [5, 10, 15, 20, 25, 30, 40, 50].filter(function(n) { return n <= rtuc * 2.5; });
  const rows = checkpoints.map(function(n) {
    const remaining = currentBuffer * Math.pow(1 - 1 / rtuc, n);
    const pctRemaining = currentBuffer > 0 ? (remaining / currentBuffer) * 100 : 0;
    const recoveryPct = remaining > 0 ? ((currentBuffer - remaining) / remaining) * 100 : null;
    return { n: n, remaining: remaining, pctRemaining: pctRemaining, recoveryPct: recoveryPct };
  });

  return (
    <div className="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6">
      <div className="flex items-center gap-2 mb-1">
        <Icon name="TrendingDown" className="h-5 w-5 text-red-400" />
        <h2 className="text-lg font-semibold text-white">Risk of Ruin - Consecutive Loss Projection</h2>
      </div>
      <p className="text-xs text-gray-500 mb-4">
        Hypothetical: if every trade lost at the current RTU (buffer / {rtuc} RTUC). "Gain needed to recover" is the
        percent return required on what's left just to climb back to today's buffer.
      </p>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-gray-500 text-xs uppercase tracking-wide border-b border-gray-800">
              <th className="pb-2 pr-4">Consecutive Losses</th>
              <th className="pb-2 pr-4">Buffer Remaining</th>
              <th className="pb-2 pr-4">% of Buffer Left</th>
              <th className="pb-2">Gain Needed to Recover</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(function(r) {
              return (
                <tr key={r.n} className="border-b border-gray-800/50 last:border-0">
                  <td className="py-2 pr-4 text-white font-medium">{r.n} losses</td>
                  <td className={"py-2 pr-4 font-semibold " + (r.pctRemaining <= 20 ? 'text-red-400' : r.pctRemaining <= 50 ? 'text-yellow-400' : 'text-green-400')}>
                    {fmt(r.remaining)}
                  </td>
                  <td className="py-2 pr-4">
                    <div className="flex items-center gap-2">
                      <div className="w-20 bg-gray-800 rounded-full h-1.5 overflow-hidden">
                        <div className={"h-full rounded-full " + (r.pctRemaining <= 20 ? 'bg-red-400' : r.pctRemaining <= 50 ? 'bg-yellow-400' : 'bg-green-400')}
                          style={{ width: Math.max(r.pctRemaining, 2) + '%' }}></div>
                      </div>
                      <span className={"text-xs " + (r.pctRemaining <= 20 ? 'text-red-400' : r.pctRemaining <= 50 ? 'text-yellow-400' : 'text-green-400')}>
                        {r.pctRemaining.toFixed(1)}%
                      </span>
                    </div>
                  </td>
                  <td className="py-2">
                    {r.recoveryPct === null ? (
                      <span className="text-red-500 font-semibold">Account wiped</span>
                    ) : (
                      <span className={"font-semibold " + (r.recoveryPct >= 100 ? 'text-red-400' : r.recoveryPct >= 40 ? 'text-yellow-400' : 'text-gray-300')}>
                        +{r.recoveryPct.toFixed(1)}% needed
                      </span>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-gray-600 mt-3">
        {accountType === 'challenge'
          ? 'Challenge uses a tighter RTUC to clear the target faster - the trade-off is a losing streak erodes the buffer, and recovery gets steep, quicker.'
          : 'Funded and Live use a wider RTUC on purpose - the buffer erodes slower and recovery math stays gentler under a bad streak, protecting real capital.'}
      </p>
    </div>
  );
}

// ---------------- DAILY TRADE EXECUTION MATRIX ----------------
function DailyTradeMatrix(props) {
  const risk = props.riskUnit;
  const rr = parseFloat(props.rewardRatio) || 2;
  const reward = risk * rr;

  const scenarios = [
    { name: 'A - Perfect',  trades: ['W', 'W', '-'], pnl: 2 * reward },
    { name: 'B - Recovery', trades: ['L', 'W', 'W'], pnl: -risk + 2 * reward },
    { name: 'C - Neutral',  trades: ['L', 'W', 'L'], pnl: reward - 2 * risk },
    { name: 'D - Save',     trades: ['W', 'L', 'L'], pnl: reward - 2 * risk },
    { name: 'E - Worst',    trades: ['L', 'L', '-'], pnl: -2 * risk },
  ];

  return (
    <div className="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-2xl p-6">
      <div className="flex items-center gap-2 mb-1">
        <Icon name="LayoutGrid" className="h-5 w-5 text-yellow-400" />
        <h2 className="text-lg font-semibold text-white">Daily Trade Execution Matrix</h2>
      </div>
      <p className="text-xs text-gray-500 mb-4">
        Max 3 trades/day - stop immediately at 2 wins (DRT satisfied) or 2 losses (DRT exhausted). Every possible way today
        can play out, based on your current RTU ({fmt(risk)}) and {rr}:1 reward.
      </p>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-gray-500 text-xs uppercase tracking-wide border-b border-gray-800">
              <th className="pb-2 pr-4">Scenario</th>
              <th className="pb-2 pr-4">Trade 1</th>
              <th className="pb-2 pr-4">Trade 2</th>
              <th className="pb-2 pr-4">Trade 3</th>
              <th className="pb-2">Daily P&L</th>
            </tr>
          </thead>
          <tbody>
            {scenarios.map(function(s, i) {
              return (
                <tr key={i} className="border-b border-gray-800/50 last:border-0">
                  <td className={"py-2 pr-4 font-medium " + (s.pnl > 0 ? 'text-green-400' : s.pnl < 0 ? 'text-red-400' : 'text-gray-300')}>{s.name}</td>
                  {s.trades.map(function(t, ti) {
                    return (
                      <td key={ti} className="py-2 pr-4">
                        {t === '-' ? <span className="text-gray-700">-</span> :
                          <span className={t === 'W' ? 'text-green-400 font-semibold' : 'text-red-400 font-semibold'}>
                            {t} {t === 'W' ? '+' + fmt(reward) : '-' + fmt(risk)}
                          </span>}
                      </td>
                    );
                  })}
                  <td className={"py-2 font-bold " + (s.pnl > 0 ? 'text-green-400' : s.pnl < 0 ? 'text-red-400' : 'text-gray-300')}>
                    {s.pnl >= 0 ? '+' : ''}{fmt(s.pnl)}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------------- MAIN JOURNAL ----------------
function MMMJournal(props) {
  const user = props.user;
  const [accounts, setAccounts] = useState([]);
  const [entries, setEntries] = useState([]);
  const [activeAccountId, setActiveAccountId] = useState(null);
  const [showAddAccount, setShowAddAccount] = useState(false);
  const [showAddEntry, setShowAddEntry] = useState(false);
  const [expandedEntry, setExpandedEntry] = useState(null);
  const [newAccount, setNewAccount] = useState(emptyAccountForm);
  const [newEntry, setNewEntry] = useState(emptyEntryForm());

  const accountsRef = db.collection('users').doc(user.uid).collection('accounts');
  const entriesRef = db.collection('users').doc(user.uid).collection('entries');

  useEffect(function() {
    const unsub = accountsRef.orderBy('createdAt', 'asc').onSnapshot(function(snap) {
      const list = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
      setAccounts(list);
      if (list.length && !activeAccountId) setActiveAccountId(list[0].id);
    });
    return unsub;
  }, [user.uid]);

  useEffect(function() {
    const unsub = entriesRef.orderBy('date', 'desc').onSnapshot(function(snap) {
      setEntries(snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); }));
    });
    return unsub;
  }, [user.uid]);

  const activeAccount = accounts.find(function(a) { return a.id === activeAccountId; });
  const accountEntries = entries.filter(function(e) { return e.accountId === activeAccountId; });
  const rtuc = activeAccount ? getRTUC(activeAccount) : DIVISOR_TABLE.average.challenge;

  const calcBufferHistory = function(account, accEntries) {
    if (!account) return [];
    const d = getRTUC(account);
    const chronological = accEntries.slice().sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
    let buffer = parseFloat(account.maxDrawdown) || 0;
    const history = [];
    chronological.forEach(function(entry) {
      const signedPnl = entry.trades.reduce(function(s, t) {
        const val = Math.abs(parseFloat(t.pnl) || 0);
        return s + (t.result === 'win' ? val : -val);
      }, 0);
      buffer = buffer + signedPnl;
      history.push({ date: entry.date, buffer: buffer, pnl: signedPnl, riskPerTrade: Math.max(buffer, 0) / d });
    });
    return history;
  };

  const bufferHistory = activeAccount ? calcBufferHistory(activeAccount, accountEntries) : [];
  const currentBuffer = bufferHistory.length > 0 ? bufferHistory[bufferHistory.length - 1].buffer : (activeAccount ? parseFloat(activeAccount.maxDrawdown) || 0 : 0);
  const riskPerTrade = Math.max(currentBuffer, 0) / rtuc;
  const microsUnlocked = Math.max(1, Math.floor(Math.max(currentBuffer, 0) / 1000));
  const nextTierAt = (microsUnlocked + 1) * 1000;
  const distToNextTier = nextTierAt - currentBuffer;

  const totalPnl = accountEntries.reduce(function(sum, e) {
    return sum + e.trades.reduce(function(s, t) {
      const val = Math.abs(parseFloat(t.pnl) || 0);
      return s + (t.result === 'win' ? val : -val);
    }, 0);
  }, 0);

  const winTrades = accountEntries.flatMap(function(e) { return e.trades; }).filter(function(t) { return t.result === 'win'; }).length;
  const lossTrades = accountEntries.flatMap(function(e) { return e.trades; }).filter(function(t) { return t.result === 'loss'; }).length;
  const totalTrades = winTrades + lossTrades;
  const winRate = totalTrades > 0 ? (winTrades / totalTrades) * 100 : 0;
  const activeStatus = activeAccount ? computeStatus(activeAccount, currentBuffer, totalPnl) : 'active';

  const getAccountStatus = function(acc) {
    const accE = entries.filter(function(e) { return e.accountId === acc.id; });
    const hist = calcBufferHistory(acc, accE);
    const buf = hist.length > 0 ? hist[hist.length - 1].buffer : (parseFloat(acc.maxDrawdown) || 0);
    const pnl = accE.reduce(function(sum, e) {
      return sum + e.trades.reduce(function(s, t) {
        const val = Math.abs(parseFloat(t.pnl) || 0);
        return s + (t.result === 'win' ? val : -val);
      }, 0);
    }, 0);
    return computeStatus(acc, buf, pnl);
  };

  const rulesForDirection = function(direction) {
    if (!activeAccount) return [];
    const list = direction === 'long' ? activeAccount.longRules : activeAccount.shortRules;
    return (list || []).filter(function(r) { return r && r.trim(); });
  };

  const biasAligns = function(bias, direction) {
    if (bias === 'neutral') return null;
    if (bias === 'bullish') return direction === 'long';
    if (bias === 'bearish') return direction === 'short';
    return null;
  };

  const handleAddAccount = async function() {
    if (!newAccount.name || !newAccount.startingBalance || !newAccount.maxDrawdown) return;
    const tier = determineTier(newAccount.backtestWinRate, newAccount.backtestSampleSize);
    const doc = await accountsRef.add({
      name: newAccount.name,
      startingBalance: parseFloat(newAccount.startingBalance),
      maxDrawdown: parseFloat(newAccount.maxDrawdown),
      profitTarget: parseFloat(newAccount.profitTarget) || 0,
      rewardRatio: parseFloat(newAccount.rewardRatio) || 2,
      accountType: newAccount.accountType,
      copiedAccountNumber: newAccount.copiedAccountNumber || '',
      linkedFromId: newAccount.linkedFromId || null,
      backtestWinRate: newAccount.backtestWinRate ? parseFloat(newAccount.backtestWinRate) : null,
      backtestSampleSize: newAccount.backtestSampleSize ? parseInt(newAccount.backtestSampleSize) : null,
      winRateTier: tier,

              {sampleTooSmall && (
                <p className="text-xs text-orange-400 mt-2 flex items-center gap-1.5">
                  <Icon name="AlertTriangle" className="h-3.5 w-3.5" /><span>Sample below {MIN_SAMPLE_SIZE} trades - defaulting to average tier.</span>
                </p>
              )}
              <div className="mt-3 bg-black/40 border border-gray-800 rounded-lg p-3 flex items-center justify-between">
                <span className="text-xs text-gray-400">This account will use:</span>
                <span className="text-sm font-semibold text-yellow-400">{DIVISOR_TABLE[previewTier].range} tier - {previewRTUC} RTUC</span>
              </div>
            </div>

            <div className="border-t border-gray-800 pt-4 space-y-4">
              <Field label="Strategy Name">
                <input value={newAccount.strategyName} onChange={function(e) { setNewAccount(Object.assign({}, newAccount, { strategyName: e.target.value })); }} placeholder="e.g. MMM Order Flow Breakout"
                  className="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 focus:border-yellow-400/50 outline-none" />
              </Field>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm text-green-400 mb-1.5 flex items-center gap-1.5">
                    <Icon name="TrendingUp" className="h-3.5 w-3.5" /><span>Long Setup Rules</span>
                  </label>
                  <div className="space-y-2">
                    {newAccount.longRules.map(function(rule, idx) {
                      return (
                        <div key={idx} className="flex items-center gap-1.5">
                          <input value={rule} onChange={function(e) { updateRuleRow('longRules', idx, e.target.value); }} placeholder={"Rule " + (idx + 1)}
                            className="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-1.5 text-sm focus:border-yellow-400/50 outline-none" />
                          {newAccount.longRules.length > 1 && (
                            <button onClick={function() { removeRuleRow('longRules', idx); }} className="text-gray-500 hover:text-red-400 flex-shrink-0"><Icon name="X" className="h-3.5 w-3.5" /></button>
                          )}
                        </div>
                      );
                    })}
                    <button onClick={function() { addRuleRow('longRules'); }} className="text-xs text-green-400 hover:text-green-300 flex items-center gap-1.5">
                      <Icon name="Plus" className="h-3 w-3" /><span>Add rule</span>
                    </button>
                  </div>
                </div>
                <div>
                  <label className="block text-sm text-red-400 mb-1.5 flex items-center gap-1.5">
                    <Icon name="TrendingDown" className="h-3.5 w-3.5" /><span>Short Setup Rules</span>
                  </label>
                  <div className="space-y-2">
                    {newAccount.shortRules.map(function(rule, idx) {
                      return (
                        <div key={idx} className="flex items-center gap-1.5">
                          <input value={rule} onChange={function(e) { updateRuleRow('shortRules', idx, e.target.value); }} placeholder={"Rule " + (idx + 1)}
                            className="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-1.5 text-sm focus:border-yellow-400/50 outline-none" />
                          {newAccount.shortRules.length > 1 && (
                            <button onClick={function() { removeRuleRow('shortRules', idx); }} className="text-gray-500 hover:text-red-400 flex-shrink-0"><Icon name="X" className="h-3.5 w-3.5" /></button>
                          )}
                        </div>
                      );
                    })}
                    <button onClick={function() { addRuleRow('shortRules'); }} className="text-xs text-red-400 hover:text-red-300 flex items-center gap-1.5">
                      <Icon name="Plus" className="h-3 w-3" /><span>Add rule</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <Field label="Master / Copied Account Number (optional)">
              <input value={newAccount.copiedAccountNumber} onChange={function(e) { setNewAccount(Object.assign({}, newAccount, { copiedAccountNumber: e.target.value })); }} placeholder="If copying a master account, enter its account #"
                className="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 focus:border-yellow-400/50 outline-none" />
            </Field>

            <button onClick={handleAddAccount} disabled={!newAccount.name || !newAccount.startingBalance || !newAccount.maxDrawdown}
              className="w-full bg-gradient-to-r from-yellow-400 to-yellow-600 text-black py-2.5 rounded-lg font-semibold disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-1.5">
              <Icon name="Save" className="h-4 w-4" /><span>Save Account</span>
            </button>
          </div>
        </Modal>
      )}

      {showAddEntry && activeAccount && (
        <Modal onClose={function() { setShowAddEntry(false); }} title="Log Today's Trades" size="lg">
          <div className="space-y-4">
            <Field label="Date">
              <input type="date" value={newEntry.date} onChange={function(e) { setNewEntry(Object.assign({}, newEntry, { date: e.target.value })); }}
                className="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 focus:border-yellow-400/50 outline-none" />
            </Field>

            <div>
              <label className="block text-sm text-gray-400 mb-1.5">Daily Bias (which way is the trend?)</label>
              <div className="flex gap-2">
                {BIAS_OPTIONS.map(function(b) {
                  return (
                    <button key={b.key} onClick={function() { setNewEntry(Object.assign({}, newEntry, { dailyBias: b.key })); }}
                      className={"flex-1 py-2 rounded-lg text-sm font-medium transition border flex items-center justify-center gap-1.5 " + (newEntry.dailyBias === b.key ? b.cls : 'bg-gray-800 text-gray-500 border-gray-700')}>
                      <Icon name={b.icon} className="h-3.5 w-3.5" /><span>{b.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="space-y-3">
              <label className="text-sm text-gray-400">Trades</label>
              {newEntry.trades.map(function(trade, idx) {
                const applicableRules = rulesForDirection(trade.direction);
                const aligned = biasAligns(newEntry.dailyBias, trade.direction);
                return (
                  <div key={idx} className="bg-gray-800/40 border border-gray-700 rounded-lg p-3 space-y-2">
                    <div className="flex items-center gap-2">
                      <button onClick={function() { updateTradeRow(idx, 'direction', 'long'); }}
                        className={"px-2.5 py-1.5 rounded-lg text-xs font-medium transition " + (trade.direction === 'long' ? 'bg-green-500/20 text-green-400 border border-green-500/40' : 'bg-gray-800 text-gray-500 border border-gray-700')}>
                        Long
                      </button>
                      <button onClick={function() { updateTradeRow(idx, 'direction', 'short'); }}
                        className={"px-2.5 py-1.5 rounded-lg text-xs font-medium transition " + (trade.direction === 'short' ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-gray-800 text-gray-500 border border-gray-700')}>
                        Short
                      </button>
                      {aligned !== null && (
                        <span className={"text-[10px] px-2 py-1 rounded flex items-center gap-1 " + (aligned ? 'bg-green-500/15 text-green-400' : 'bg-orange-500/15 text-orange-400')}>
                          <Icon name={aligned ? "CheckCircle" : "AlertTriangle"} className="h-2.5 w-2.5" />
                          <span>{aligned ? 'With trend' : 'Against bias'}</span>
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={function() { updateTradeRow(idx, 'result', 'win'); }}
                        className={"px-3 py-2 rounded-lg text-sm font-medium transition " + (trade.result === 'win' ? 'bg-green-500/20 text-green-400 border border-green-500/40' : 'bg-gray-800 text-gray-500 border border-gray-700')}>Win</button>
                      <button onClick={function() { updateTradeRow(idx, 'result', 'loss'); }}
                        className={"px-3 py-2 rounded-lg text-sm font-medium transition " + (trade.result === 'loss' ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-gray-800 text-gray-500 border border-gray-700')}>Loss</button>
                      <input type="number" placeholder="P&L amount" value={trade.pnl} onChange={function(e) { updateTradeRow(idx, 'pnl', e.target.value); }}
                        className="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 focus:border-yellow-400/50 outline-none" />
                      {newEntry.trades.length > 1 && (
                        <button onClick={function() { removeTradeRow(idx); }} className="text-gray-500 hover:text-red-400 flex-shrink-0"><Icon name="X" className="h-4 w-4" /></button>
                      )}
                    </div>
                    {applicableRules.length > 0 && (
                      <div className="bg-black/30 rounded-lg p-2.5 space-y-1.5">
                        <p className="text-[11px] text-gray-500 uppercase tracking-wide">Did you follow your {trade.direction} rules?</p>
                        {applicableRules.map(function(rule, ri) {
                          const checked = (trade.rulesChecked || []).indexOf(rule) !== -1;
                          return (
                            <button key={ri} onClick={function() { toggleRuleChecked(idx, rule); }}
                              className="w-full flex items-center gap-2 text-left text-xs text-gray-300 hover:text-white">
                              <Icon name={checked ? "CheckSquare" : "Square"} className={"h-4 w-4 flex-shrink-0 " + (checked ? 'text-green-400' : 'text-gray-600')} />
                              <span>{rule}</span>
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}

              {entryWins >= 2 && (
                <p className="text-xs text-green-400 flex items-center gap-1.5"><Icon name="CheckCircle" className="h-3.5 w-3.5" /><span>2 wins reached - DRT satisfied, stop for today.</span></p>
              )}
              {entryLosses >= 2 && (
                <p className="text-xs text-red-400 flex items-center gap-1.5"><Icon name="AlertTriangle" className="h-3.5 w-3.5" /><span>2 losses reached - DRT exhausted, stop for today.</span></p>
              )}
              {newEntry.trades.length >= 3 && entryWins < 2 && entryLosses < 2 && (
                <p className="text-xs text-yellow-400">3-trade max reached for today.</p>
              )}

              <button onClick={addTradeRow} disabled={newEntry.trades.length >= 3 || entryWins >= 2 || entryLosses >= 2}
                className="text-sm text-yellow-400 hover:text-yellow-300 flex items-center gap-1.5 mt-1 disabled:opacity-30 disabled:cursor-not-allowed">
                <Icon name="Plus" className="h-3 w-3" /><span>Add another trade</span>
              </button>
            </div>

            <Field label="Notes (optional)">
              <textarea value={newEntry.notes} onChange={function(e) { setNewEntry(Object.assign({}, newEntry, { notes: e.target.value })); }} placeholder="What went well? What to fix tomorrow?"
                className="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-3 py-2 h-20 focus:border-yellow-400/50 outline-none resize-none"></textarea>
            </Field>
            <button onClick={handleSaveEntry} disabled={newEntry.trades.every(function(t) { return t.pnl === ''; })}
              className="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-black py-2.5 rounded-lg font-semibold disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-1.5">
              <Icon name="Save" className="h-4 w-4" /><span>Save Entry</span>
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function StatCard(props) {
  return (
    <div className="bg-gradient-to-br from-gray-900 to-black border border-gray-800 rounded-xl p-4">
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs text-gray-500 uppercase tracking-wide">{props.label}</span>
        <Icon name={props.icon} className={"h-4 w-4 " + props.color} />
      </div>
      <div className={"text-xl font-bold " + props.color}>{props.value}</div>
      {props.sub && <div className="text-xs text-gray-600 mt-0.5">{props.sub}</div>}
    </div>
  );
}

function Modal(props) {
  const size = props.size || 'md';
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="fixed inset-0 bg-black bg-opacity-80" onClick={props.onClose}></div>
      <div className={"relative bg-black border border-yellow-500/20 rounded-2xl p-6 w-full " + (size === 'lg' ? 'max-w-lg' : 'max-w-md') + " max-h-[90vh] overflow-y-auto shadow-2xl"}>
        <div className="flex items-center justify-between mb-5">
          <h3 className="text-lg font-bold text-white">{props.title}</h3>
          <button onClick={props.onClose} className="text-gray-500 hover:text-white flex-shrink-0"><Icon name="X" className="h-5 w-5" /></button>
        </div>
        {props.children}
      </div>
    </div>
  );
}

function Field(props) {
  return (<div><label className="block text-sm text-gray-400 mb-1">{props.label}</label>{props.children}</div>);
}

// ---------------- ROOT ----------------
function App() {
  const [user, setUser] = useState(undefined);
  useEffect(function() {
    const unsub = auth.onAuthStateChanged(function(u) { setUser(u); });
    return unsub;
  }, []);

  if (user === undefined) {
    return <div className="min-h-screen bg-black flex items-center justify-center text-yellow-400">Loading...</div>;
  }
  return user ? <MMMJournal user={user} /> : <AuthScreen />;
}

const rootEl = ReactDOM.createRoot(document.getElementById('root'));
rootEl.render(<App />);
</script>
</body>
</html>
