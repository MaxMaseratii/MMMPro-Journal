<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prop Scale Planner | MMM Trading</title>
<meta name="description" content="Free prop account planner for futures traders: how many accounts, how to copy them, how much to risk and how much money you need. Built from 171 trader interviews and 4 years of strategy tests.">
<link rel="canonical" href="https://www.maxmaserati.com/prop-scale/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MMM Trading">
<meta property="og:title" content="Prop Scale Planner | MMM Trading">
<meta property="og:description" content="Free prop account planner for futures traders, with the proof: 171 trader interviews and 57 strategies tested year by year.">
<meta property="og:url" content="https://www.maxmaserati.com/prop-scale/">
<meta property="og:image" content="https://www.maxmaserati.com/mmm-logo-lockup.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/logo-icon-180-opaque.png">
<meta name="theme-color" content="#0a0a0a">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { background: hsl(0,0%,4%); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .ps-tab { display: inline-flex; flex-direction: column; align-items: flex-start; padding: .45rem 1rem; border-radius: .6rem; color: #d1d5db; transition: background .15s, color .15s; text-align: left; }
  .ps-tab .k { font-size: .65rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .ps-tab .v { font-size: .875rem; font-weight: 800; }
  .ps-tab:hover { color: #fff; background: rgba(255,255,255,.05); }
  .ps-tab[aria-selected="true"] { background: linear-gradient(90deg, var(--mmm-gold), var(--mmm-gold-light)); color: #000; }
  .ps-tab:focus-visible { outline: 2px solid var(--mmm-tiffany); outline-offset: 2px; }
  #ps-wrap { position: relative; background: #0a0a0a; }
  #ps-wrap iframe { display: block; width: 100%; border: 0; background: #0a0a0a; }
  #ps-wrap iframe[hidden] { display: none; }
  #ps-load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: .875rem; pointer-events: none; }
</style>
</head>
<body class="text-white">
<div id="mmm-header"></div>

<nav id="ps-bar" aria-label="Prop Scale Planner" class="border-b border-white/10 bg-black/60">
  <div class="max-w-7xl mx-auto px-4 sm:px-8 py-2.5 flex flex-wrap items-center gap-x-4 gap-y-2">
    <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Prop Scale Planner</span>
    <div class="inline-flex rounded-xl border border-white/15 p-1 bg-white/[0.03]" role="tablist" aria-label="Planner or proof">
      <button type="button" class="ps-tab" role="tab" id="tab-approach" aria-controls="f-approach" aria-selected="true" data-ps="approach"><span class="k">The approach</span><span class="v">Plan your accounts</span></button>
      <button type="button" class="ps-tab" role="tab" id="tab-proof" aria-controls="f-proof" aria-selected="false" data-ps="proof"><span class="k">The proof</span><span class="v">What really works</span></button>
    </div>
    <span class="text-xs text-gray-500">Free &middot; built from 171 trader interviews and 57 strategies tested year by year</span>
  </div>
</nav>

<div id="ps-wrap">
  <div id="ps-load">Loading&hellip;</div>
  <iframe id="f-approach" role="tabpanel" aria-labelledby="tab-approach" title="Prop Scale Planner: plan your prop accounts" src="/prop-scale/planner.html"></iframe>
  <iframe id="f-proof" role="tabpanel" aria-labelledby="tab-proof" title="The proof: prop trader strategies tested year by year" hidden></iframe>
</div>

<div id="mmm-footer"></div>

<script>
(function () {
  'use strict';
  var wrap = document.getElementById('ps-wrap');
  var load = document.getElementById('ps-load');
  var F = { approach: document.getElementById('f-approach'), proof: document.getElementById('f-proof') };
  var SRC = { approach: '/prop-scale/planner.html', proof: '/prop-scale/proof.html' };
  // the frame fills the screen under the site menu and this bar; each tool scrolls inside its own frame
  function fit() {
    var head = document.querySelector('header');
    var top = (head ? head.offsetHeight : 0) + document.getElementById('ps-bar').offsetHeight;
    var h = Math.max(480, window.innerHeight - top) + 'px';
    F.approach.style.height = h; F.proof.style.height = h; wrap.style.minHeight = h;
  }
  function show(k, push) {
    if (!F[k]) k = 'approach';
    if (!F[k].src) F[k].src = SRC[k];
    Object.keys(F).forEach(function (x) {
      F[x].hidden = x !== k;
      document.getElementById('tab-' + x).setAttribute('aria-selected', String(x === k));
    });
    if (push) history.replaceState(null, '', k === 'approach' ? location.pathname : '#proof');
    fit();
  }
  Object.keys(F).forEach(function (k) { F[k].addEventListener('load', function () { load.style.display = 'none'; }); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ps]'); if (!b) return;
    show(b.dataset.ps, true);
    window.scrollTo({ top: wrap.getBoundingClientRect().top + window.scrollY - (document.querySelector('header') || { offsetHeight: 0 }).offsetHeight - document.getElementById('ps-bar').offsetHeight, behavior: 'smooth' });
  });
  // arrow keys move between the two tabs
  document.querySelector('[role="tablist"]').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var k = document.getElementById('tab-approach').getAttribute('aria-selected') === 'true' ? 'proof' : 'approach';
    show(k, true); document.getElementById('tab-' + k).focus();
  });
  window.addEventListener('hashchange', function () { show(location.hash === '#proof' ? 'proof' : 'approach', false); });
  window.addEventListener('resize', fit);
  show(location.hash === '#proof' ? 'proof' : 'approach', false);
  setTimeout(fit, 300);
})();
</script>
<script src="/assets/nav.js"></script>
<script src="/assets/site.js"></script>
<script src="/i18n.js"></script>
</body>
</html>
