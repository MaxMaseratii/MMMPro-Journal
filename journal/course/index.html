<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMM Mastery Course</title>
<meta name="description" content="The MMM Mastery Course: learn to read price as Hammers against Walls, step by step, with quizzes, homework and a certificate.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E1114'/%3E%3Cpath d='M16 5 27 16 16 27 5 16Z' fill='%23D6B15E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: sticky terminal bar on top; landing = headline + live candle scene, then the phase ladder.
   Course = lesson rail on the left, one reading column, sticky step bar at the bottom. */
:root{
  --ground:#0E1114; --panel:#151A1F; --raise:#1C232A; --line:#27303A; --line-2:#36414D; --grid:rgba(120,140,160,.07);
  --ink:#ECE5D3; --ink-2:#A9AFB5; --ink-3:#7A838D;
  --gold:#D6B15E; --gold-soft:rgba(214,177,94,.13); --on-gold:#17120A;
  --bull:#35C281; --bull-soft:rgba(53,194,129,.12);
  --bear:#EF5B60; --bear-soft:rgba(239,91,96,.12);
  --wall:#62A0F5; --wall-soft:rgba(98,160,245,.12);
  --cyan:#45C6D5; --cyan-soft:rgba(69,198,213,.12);
  --scrim:rgba(5,7,9,.6);
  --shadow:0 24px 60px -28px rgba(0,0,0,.75);
  --f-display:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-code:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bar-h:60px;
  --gutter:clamp(16px,4vw,40px);
  color-scheme:dark;
  /* names used inside the lesson content */
  --gr:var(--bull); --rd:var(--bear); --bl:var(--wall); --lt:var(--ink); --fm:var(--f-code); --mt:var(--ink-3); --dm:var(--ink-3); --pu:var(--gold); --cy:var(--cyan);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#EDF0F2; --panel:#FFFFFF; --raise:#E3E7EB; --line:#D3D9DF; --line-2:#BCC5CD; --grid:rgba(40,60,80,.06);
    --ink:#14181C; --ink-2:#47505A; --ink-3:#66707A;
    --gold:#8E6A1B; --gold-soft:rgba(142,106,27,.11); --on-gold:#FFFFFF;
    --bull:#11804C; --bull-soft:rgba(17,128,76,.09);
    --bear:#C2333A; --bear-soft:rgba(194,51,58,.08);
    --wall:#215EC2; --wall-soft:rgba(33,94,194,.08);
    --cyan:#0A7B8A; --cyan-soft:rgba(10,123,138,.08);
    --scrim:rgba(20,28,36,.35);
    --shadow:0 24px 60px -30px rgba(20,30,40,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#EDF0F2; --panel:#FFFFFF; --raise:#E3E7EB; --line:#D3D9DF; --line-2:#BCC5CD; --grid:rgba(40,60,80,.06);
  --ink:#14181C; --ink-2:#47505A; --ink-3:#66707A;
  --gold:#8E6A1B; --gold-soft:rgba(142,106,27,.11); --on-gold:#FFFFFF;
  --bull:#11804C; --bull-soft:rgba(17,128,76,.09);
  --bear:#C2333A; --bear-soft:rgba(194,51,58,.08);
  --wall:#215EC2; --wall-soft:rgba(33,94,194,.08);
  --cyan:#0A7B8A; --cyan-soft:rgba(10,123,138,.08);
  --scrim:rgba(20,28,36,.35);
  --shadow:0 24px 60px -30px rgba(20,30,40,.35);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 1rem/1.62 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.65rem 1.15rem;border-radius:9px;border:1px solid var(--line-2);background:transparent;font-weight:600;font-size:.95rem;line-height:1.2;text-decoration:none;color:var(--ink);transition:background-color .15s,border-color .15s}
.btn:hover{background:var(--raise)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn-gold:hover{background:var(--gold);filter:brightness(1.07)}
.btn-quiet{border-color:transparent;color:var(--ink-2)}
.btn-quiet:hover{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default;background:transparent}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);background:var(--raise)}
.icon-btn svg{width:18px;height:18px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--bar-h);display:flex;align-items:center;gap:.75rem;padding-inline:var(--gutter);background:var(--ground);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;border:0;background:none;padding:.25rem 0;color:var(--ink);font:700 1.05rem/1 var(--f-display);font-stretch:112%;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:22px;height:22px;flex:none}
.brand-mark path{fill:var(--gold)}
.tb-progress{display:flex;align-items:center;gap:.7rem;margin-left:1rem;min-width:0}
.tb-candles{display:block;width:110px;height:30px;flex:none}
.tb-pct{font:600 .85rem/1 var(--f-body);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:.3rem .55rem;font:600 .78rem/1 var(--f-body);color:var(--ink-3);min-height:30px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink)}
.cert-btn{min-height:40px;padding:.5rem .9rem;font-size:.88rem}
.lessons-btn{display:none}
body.mode-landing .tb-progress, body.mode-landing .lessons-btn{display:none!important}

/* ---------- Landing ---------- */
.landing{padding-inline:var(--gutter)}
.wrap{max-width:1180px;margin-inline:auto}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(28px,5vw,72px);align-items:center;padding-block:clamp(36px,7vw,88px) clamp(32px,6vw,72px)}
.hero-copy{display:grid;gap:1.4rem;min-width:0}
.maker{display:flex;align-items:center;gap:.55rem;color:var(--ink-2);font-weight:500;font-size:.95rem}
.maker svg{width:16px;height:16px}
.maker path{fill:var(--gold)}
.hero h1{margin:0;font:850 clamp(2.7rem,6.4vw,5.1rem)/.93 var(--f-display);font-stretch:122%;letter-spacing:-.03em;text-wrap:balance}
.hero-tag{margin:-.4rem 0 0;font:650 clamp(1.25rem,2.4vw,1.7rem)/1.1 var(--f-display);font-stretch:70%;color:var(--gold);letter-spacing:.01em}
.hero-body{margin:0;max-width:34rem;color:var(--ink-2);font-size:1.08rem}
.facts{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;margin:0;padding:0;list-style:none;color:var(--ink-2);font-size:.95rem}
.facts b{font:800 1.35rem/1 var(--f-display);font-stretch:100%;color:var(--ink);margin-right:.3rem;font-variant-numeric:tabular-nums}
.hero-actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.resume-note{margin:0;font-size:.92rem;color:var(--ink-2)}
.resume-note strong{color:var(--ink);font-weight:600}
.meter{height:4px;border-radius:4px;background:var(--line);overflow:hidden;max-width:22rem}
.meter i{display:block;height:100%;background:var(--gold);border-radius:4px}

.scene{margin:0;min-width:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.scene-chart{display:block;width:100%;height:auto;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.scene figcaption{display:grid;gap:.7rem;padding:1rem 1.2rem 1.15rem;border-top:1px solid var(--line)}
.motto{margin:0;font:700 1.05rem/1.35 var(--f-display);font-stretch:96%;color:var(--ink);text-wrap:balance}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1.2rem;margin:0;padding:0;list-style:none;font-size:.84rem;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:.45rem}
.legend i{width:14px;height:10px;border-radius:2px;flex:none}
.lg-wall{background:var(--wall-soft);border:1px solid var(--wall)}
.lg-bull{background:var(--bull)}
.hc-gridline{stroke:var(--line);stroke-width:1}
.hc-band{fill:var(--wall-soft)}
.hc-bandtop{stroke:var(--wall);stroke-width:1.5}
.hc-up rect{fill:var(--bull)} .hc-up line{stroke:var(--bull)}
.hc-down rect{fill:var(--bear)} .hc-down line{stroke:var(--bear)}
.hc-ham rect{fill:var(--bull)} .hc-ham line{stroke:var(--bull)}
.hc-wick{stroke-width:1.6}
.hc-bc{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 4}
.hc-dot{fill:var(--gold)}
.hc-lbl{font:600 12.5px var(--f-body);fill:var(--ink-2)}
.hc-lbl-wall{fill:var(--wall)}
.hc-lbl-gold{fill:var(--gold)}
.hc-lbl-dim{fill:var(--ink-3);font-weight:500}
.hc-grow{transform-box:fill-box;transform-origin:50% 100%;animation:hcGrow 1s cubic-bezier(.2,.75,.15,1) .35s both}
.hc-mark{animation:hcFade .5s ease 1.25s both}
@keyframes hcGrow{from{transform:scaleY(.06)}to{transform:none}}
@keyframes hcFade{from{opacity:0}to{opacity:1}}

.curriculum{padding-block:clamp(28px,5vw,56px) clamp(56px,8vw,96px);border-top:1px solid var(--line)}
.cur-head{display:grid;gap:.8rem;max-width:44rem;margin-bottom:2rem}
.cur-head h2{margin:0;font:800 clamp(1.7rem,3.2vw,2.3rem)/1.05 var(--f-display);font-stretch:112%;letter-spacing:-.02em}
.cur-head p{margin:0;color:var(--ink-2)}
.ladder{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ladder > li{border-bottom:1px solid var(--line)}
.ph-sum{display:grid;grid-template-columns:4.2rem minmax(0,1fr) auto 1.5rem;align-items:center;gap:1rem;padding:1.05rem 0;list-style:none;cursor:pointer}
.ph-sum::-webkit-details-marker{display:none}
.ph-num{font:850 2.7rem/1 var(--f-display);font-stretch:64%;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ph.is-done .ph-num{color:var(--bull)}
.ph.is-current .ph-num{color:var(--gold)}
.ph-name{display:block;font:700 1.18rem/1.2 var(--f-display);font-stretch:104%;letter-spacing:-.005em}
.ph-meta{display:block;margin-top:.2rem;color:var(--ink-3);font-size:.88rem}
.ph-state{font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:999px;font-size:.78rem;font-weight:600;line-height:1.3}
.chip-done{background:var(--bull-soft);color:var(--bull)}
.chev{width:18px;height:18px;color:var(--ink-3);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.ph-body{display:grid;gap:1rem;padding:0 0 1.4rem 5.2rem;max-width:52rem}
.ph-body p{margin:0;color:var(--ink-2)}
.ph-body p strong{color:var(--ink);font-weight:600}
.ph-lessons{margin:0;padding-left:1.1rem;color:var(--ink-2);display:grid;gap:.25rem}
.ph-lessons li::marker{color:var(--gold)}
.foot{padding-block:28px;border-top:1px solid var(--line);color:var(--ink-3);font-size:.85rem}

/* ---------- Course shell ---------- */
.shell{display:grid;grid-template-columns:292px minmax(0,1fr)}
.rail{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--bar-h) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:1.2rem 1rem 2rem;overscroll-behavior:contain}
.rail-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;padding:0 .35rem 1.1rem;border-bottom:1px solid var(--line);margin-bottom:.8rem}
.rail-stats div{display:grid;gap:.15rem}
.rail-stats b{font:800 1.25rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.rail-stats span{font-size:.75rem;color:var(--ink-3);line-height:1.25}
.rail-title{margin:0 .35rem .6rem;font:600 .8rem/1.2 var(--f-body);color:var(--ink-3)}
.rail-close{display:none}
.r-phase{margin-top:.9rem}
.r-ph-head{display:flex;align-items:baseline;gap:.6rem;padding:0 .35rem .3rem}
.r-ph-num{font:850 1.2rem/1 var(--f-display);font-stretch:64%;color:var(--ink-3);min-width:1.1rem;font-variant-numeric:tabular-nums}
.r-phase.is-done .r-ph-num{color:var(--bull)}
.r-ph-name{font:650 .92rem/1.25 var(--f-display);font-stretch:100%;color:var(--ink)}
.r-lesson{display:grid;grid-template-columns:3.2rem minmax(0,1fr) 1rem;gap:.4rem;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:.5rem .45rem;color:var(--ink-2);font-size:.88rem;line-height:1.3}
.r-lesson:hover{background:var(--raise);color:var(--ink)}
.r-lesson[aria-current="true"]{background:var(--gold-soft);color:var(--ink)}
.r-lesson[aria-current="true"] .r-id{color:var(--gold)}
.r-id{font:500 .74rem/1 var(--f-code);color:var(--ink-3)}
.r-check{width:14px;height:14px;color:var(--bull)}
.r-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line-2);justify-self:center}
.scrim{display:none}

.main{display:flex;flex-direction:column;min-height:calc(100dvh - var(--bar-h));min-width:0}
.reader-wrap{flex:1;padding:clamp(24px,4vw,48px) var(--gutter) 48px}
.reader{max-width:46rem;margin-inline:auto}
.l-head{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .75rem;margin-bottom:1.6rem;color:var(--ink-2);font-size:.88rem}
.l-chip{font:700 .82rem/1 var(--f-display);font-stretch:80%;padding:.35rem .6rem;border-radius:6px;background:var(--gold-soft);color:var(--gold);letter-spacing:.01em}
.l-title{font-weight:600;color:var(--ink)}
.l-pos{margin-left:auto;color:var(--ink-3);font-variant-numeric:tabular-nums}
.card{animation:cardIn .28s ease-out}
.card.from-left{animation-name:cardInL}
@keyframes cardIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes cardInL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

.stepbar{position:sticky;bottom:0;z-index:20;background:var(--ground);border-top:1px solid var(--line);padding:.7rem var(--gutter) calc(.7rem + env(safe-area-inset-bottom,0px))}
.stepbar-in{max-width:52rem;margin-inline:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1rem}
.steps{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:28px;min-width:0;overflow:hidden}
.step{width:10px;height:16px;border:0;padding:0;border-radius:2px;background:var(--line-2);flex:none}
.step.is-done{background:var(--ink-3)}
.step.is-quiz{box-shadow:inset 0 -3px 0 var(--wall)}
.step.is-hw{box-shadow:inset 0 -3px 0 var(--gold)}
.step.is-here{height:26px;background:var(--gold);box-shadow:none}
.step:hover{filter:brightness(1.25)}

/* ---------- Lesson content (classes come from the course data) ---------- */
.card-inner,.intro-card{display:block}
.card-inner > * + *, .intro-card > * + *, .chapter-text > * + *{margin-top:1.1rem}
.module-eyebrow{font:600 .88rem/1.3 var(--f-body);color:var(--gold)}
.card-h1{font:820 clamp(1.95rem,4.4vw,2.75rem)/1.04 var(--f-display);font-stretch:114%;letter-spacing:-.022em;text-wrap:balance;color:var(--ink)}
.card-h2{font:720 clamp(1.25rem,2.4vw,1.45rem)/1.2 var(--f-display);font-stretch:106%;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
.card-inner > .card-h2{margin-top:2.2rem}
.card-h3{font:700 1.08rem/1.3 var(--f-display);color:var(--ink)}
.card-lead{font-size:1.16rem;line-height:1.58;color:var(--ink-2);max-width:40rem}
.card-p{color:var(--ink);max-width:42rem}
.card-p strong,.callout-body strong,td strong{font-weight:650}
.section-divider{border:0;border-top:1px solid var(--line);margin-block:2rem}
em{font-style:italic}

.callout{--tone:var(--gold);--tone-soft:var(--gold-soft);display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:.7rem;padding:.95rem 1.1rem;border-radius:12px;background:var(--tone-soft);border:1px solid color-mix(in srgb,var(--tone) 28%,transparent);min-width:0}
.callout-gold{--tone:var(--gold);--tone-soft:var(--gold-soft)}
.callout-blue{--tone:var(--wall);--tone-soft:var(--wall-soft)}
.callout-green{--tone:var(--bull);--tone-soft:var(--bull-soft)}
.callout-red{--tone:var(--bear);--tone-soft:var(--bear-soft)}
.callout-cyan{--tone:var(--cyan);--tone-soft:var(--cyan-soft)}
.callout-icon{font-size:1.02rem;line-height:1.55;text-align:center;color:var(--tone);font-weight:700}
.callout-body{min-width:0;font-size:.97rem}
.callout-body > strong:first-child{color:var(--tone)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.data-table{width:100%;border-collapse:collapse;font-size:.92rem;line-height:1.5}
.data-table th{text-align:left;font:600 .8rem/1.3 var(--f-body);color:var(--ink-3);background:var(--raise);padding:.65rem .85rem;white-space:nowrap}
.data-table td{padding:.75rem .85rem;border-top:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.data-table td:first-child{color:var(--ink)}
@media (hover:hover){.data-table tbody tr:hover td{background:color-mix(in srgb,var(--raise) 45%,transparent)}}

.badge{display:inline-block;font:600 .8rem/1 var(--f-code);padding:.32rem .5rem;border-radius:6px;white-space:nowrap;background:var(--raise);color:var(--ink-2)}
.badge-bu{background:var(--bull-soft);color:var(--bull)}
.badge-be{background:var(--bear-soft);color:var(--bear)}
.badge-gold{background:var(--gold-soft);color:var(--gold)}

/* Chapter opener (intro cards) */
.chapter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(1rem,3vw,2.2rem);align-items:start;padding-block:1rem 1.5rem}
.chapter-num{font:900 clamp(6rem,16vw,10.5rem)/.8 var(--f-display);font-stretch:62%;color:transparent;-webkit-text-stroke:2px var(--gold);letter-spacing:-.02em;font-variant-numeric:tabular-nums;user-select:none}
.intro-emblem{display:none}
.chapter .card-h1{font-size:clamp(2.2rem,5vw,3.3rem)}
.inside{display:grid;gap:.6rem;margin-top:1.8rem;padding-top:1.3rem;border-top:1px solid var(--line)}
.inside h3{margin:0;font:600 .85rem/1.2 var(--f-body);color:var(--ink-3)}
.inside ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.5rem}
.inside li{padding:.35rem .7rem;border:1px solid var(--line);border-radius:999px;font-size:.88rem;color:var(--ink-2)}

/* Quiz */
.quiz{display:grid;gap:1.3rem}
.q-label{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;font-size:.86rem;color:var(--ink-3)}
.q-label b{color:var(--wall);font-weight:600}
.q-text{margin:0;font:720 clamp(1.3rem,2.8vw,1.6rem)/1.3 var(--f-display);font-stretch:100%;letter-spacing:-.008em;text-wrap:pretty}
.q-opts{display:grid;gap:.6rem}
.q-opt{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.85rem;align-items:start;width:100%;text-align:left;padding:.85rem 1rem;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:.98rem;line-height:1.45;transition:border-color .15s,background-color .15s}
.q-opt:hover:not(:disabled){border-color:var(--line-2);background:var(--raise)}
.q-key{display:grid;place-items:center;width:2rem;height:2rem;border-radius:7px;border:1px solid var(--line-2);font:600 .85rem/1 var(--f-code);color:var(--ink-2)}
.q-opt:disabled{cursor:default}
.q-opt.is-right{border-color:var(--bull);background:var(--bull-soft)}
.q-opt.is-right .q-key{background:var(--bull);border-color:var(--bull);color:var(--ground)}
.q-opt.is-wrong{border-color:var(--bear);background:var(--bear-soft)}
.q-opt.is-wrong .q-key{background:var(--bear);border-color:var(--bear);color:var(--ground)}
.q-opt.is-dim{opacity:.5}
.q-fb{display:grid;gap:.7rem;padding:1rem 1.15rem;border-radius:12px;border:1px solid color-mix(in srgb,var(--tone) 35%,transparent);background:var(--tone-soft)}
.q-fb.ok{--tone:var(--bull);--tone-soft:var(--bull-soft)}
.q-fb.no{--tone:var(--bear);--tone-soft:var(--bear-soft)}
.q-fb p{margin:0}
.q-fb strong{color:var(--tone)}
.q-hint{font-size:.82rem;color:var(--ink-3)}

/* Homework */
.hw{display:grid;gap:1.1rem}
.hw-head h2{margin:0 0 .4rem;font:800 clamp(1.8rem,4vw,2.4rem)/1.05 var(--f-display);font-stretch:114%;letter-spacing:-.02em}
.hw-head p{margin:0;color:var(--ink-2);max-width:40rem}
.hw-list{list-style:none;margin:0;padding:0;display:grid;gap:1rem;counter-reset:hw}
.hw-item{counter-increment:hw;display:grid;gap:.85rem;padding:1.15rem 1.2rem;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.hw-item.is-filled{border-color:color-mix(in srgb,var(--bull) 45%,var(--line))}
.hw-q{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.8rem;margin:0}
.hw-q::before{content:counter(hw);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--gold-soft);color:var(--gold);font:800 .95rem/1 var(--f-display)}
.hw-item.is-filled .hw-q::before{background:var(--bull-soft);color:var(--bull)}
.field{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--ground);padding:.7rem .85rem;font-size:.95rem;line-height:1.5;resize:vertical}
.field:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.field::placeholder{color:var(--ink-3)}
.drop{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;padding:.9rem 1rem;border:1.5px dashed var(--line-2);border-radius:10px;background:transparent;color:var(--ink-2)}
.drop:hover,.drop.is-over{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.drop svg{width:26px;height:26px;flex:none;color:var(--gold)}
.drop b{display:block;color:var(--ink);font-weight:600}
.drop small{font-size:.84rem}
.shot{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ground)}
.shot img{display:block;width:100%;max-height:420px;object-fit:contain}
.shot .icon-btn{position:absolute;top:8px;right:8px;background:var(--panel)}
.linkchip{display:inline-flex;align-items:center;gap:.4rem;font-size:.88rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hw-foot{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem}
.saved{font-size:.84rem;color:var(--bull);opacity:0;transition:opacity .2s}
.saved.show{opacity:1}

/* Identity worksheet */
.id-sec{display:grid;gap:.9rem;padding-top:1.4rem;border-top:1px solid var(--line)}
.id-sec h3{margin:0;font:720 1.15rem/1.2 var(--f-display);font-stretch:104%}
.id-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem 1rem}
.id-field{display:grid;gap:.35rem;min-width:0}
.id-field label{font-size:.86rem;font-weight:600;color:var(--ink-2)}
.pledge{display:grid;gap:1rem;padding:1.4rem;border-radius:14px;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);background:var(--gold-soft)}
.pledge blockquote{margin:0;font:500 1.1rem/1.55 var(--f-body);font-style:italic;color:var(--ink)}
.pledge-actions{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}

/* Completion */
.done{display:grid;gap:1.2rem;padding-block:1.5rem}
.done-mark{width:72px;height:72px}
.done-mark path{fill:var(--gold)}
.done .motto{font-size:1.2rem;color:var(--gold);padding-top:1rem;border-top:1px solid var(--line)}

/* Certificate dialog */
dialog.cert{width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--line-2);border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
dialog.cert::backdrop{background:var(--scrim)}
.cert-in{display:grid;gap:1rem;padding:1.4rem}
.cert-top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.cert-top h2{margin:0;font:800 1.5rem/1.1 var(--f-display);font-stretch:110%}
.cert-img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--ground)}
.cert-actions{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.cert-hint{margin:0;font-size:.84rem;color:var(--ink-3)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(520px,calc(100vw - 32px));padding:.75rem 1rem;border-radius:10px;background:var(--ink);color:var(--ground);font-size:.9rem;font-weight:500;box-shadow:var(--shadow)}


/* ---------- Interactive widgets inside lessons ---------- */
.stack{display:grid;gap:.6rem}
.wdg{display:grid;gap:.9rem;padding:1rem;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-width:0}
.wdg-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem}
.wdg-title{margin:0;font:700 1rem/1.2 var(--f-display);font-stretch:104%;color:var(--ink)}
.wseg{flex-wrap:wrap}
.wseg button{min-height:32px;padding:.35rem .6rem}
.wnote{margin:0;font-size:.82rem;color:var(--ink-3)}
.wnav{display:flex;gap:.5rem;align-items:center}
.wnav .icon-btn{width:36px;height:36px}

/* mini candle charts */
.mc-svg{display:block;width:100%;height:auto}
.mc-grid{stroke:var(--line);stroke-width:1}
.mc-c line{stroke-width:1.5}
.mc-bu rect{fill:var(--bull)} .mc-bu line{stroke:var(--bull)}
.mc-be rect{fill:var(--bear)} .mc-be line{stroke:var(--bear)}
.mc-nbc rect{fill:var(--ink-2)} .mc-nbc line{stroke:var(--ink-2)}
.mc-band{stroke:none}
.mc-wall{fill:var(--wall);fill-opacity:.13}
.mc-gold{fill:var(--gold);fill-opacity:.24}
.mc-neu{fill:var(--ink-3);fill-opacity:.1}
.mc-bull{fill:var(--bull);fill-opacity:.24} .mc-bull2{fill:var(--bull);fill-opacity:.11}
.mc-bear{fill:var(--bear);fill-opacity:.24} .mc-bear2{fill:var(--bear);fill-opacity:.11}
.mc-line{fill:none}
.mc-s-gold{stroke:var(--gold)} .mc-s-bull{stroke:var(--bull)} .mc-s-bear{stroke:var(--bear)} .mc-s-wall{stroke:var(--wall)} .mc-s-dim{stroke:var(--ink-3)}
.mc-lbl,.mc-rl,.mc-mark{font:600 11.5px var(--f-body)}
.mc-mark{font-weight:700}
.mc-t-gold{fill:var(--gold)} .mc-t-bull,.mc-t-bull2{fill:var(--bull)} .mc-t-bear,.mc-t-bear2{fill:var(--bear)} .mc-t-wall{fill:var(--wall)} .mc-t-neu,.mc-t-dim{fill:var(--ink-2)}
.mc-steps{display:flex;flex-wrap:wrap;gap:.4rem;margin:0;padding:0;list-style:none}
.mc-step{display:inline-flex;align-items:center;gap:.45rem;min-height:34px;padding:.25rem .7rem .25rem .3rem;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:.84rem;color:var(--ink-2);text-align:left}
.mc-step b{display:grid;place-items:center;width:1.45rem;height:1.45rem;flex:none;border-radius:50%;background:var(--raise);font:700 .76rem/1 var(--f-display);color:var(--ink-2)}
.mc-step:hover{color:var(--ink);border-color:var(--line-2)}
.mc-step[aria-current="step"]{border-color:var(--gold);color:var(--ink)}
.mc-step[aria-current="step"] b{background:var(--gold);color:var(--on-gold)}
.mc-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.mc-note{margin:0;color:var(--ink-2);font-size:.95rem;max-width:40rem}

/* 24-hour volatility map */
.clk-strip{position:relative;display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:20px;border-bottom:1px solid var(--line-2)}
.cb{position:relative;display:flex;align-items:flex-end;height:100%;min-width:0;padding:0;border:0;background:transparent;border-radius:4px 4px 0 0}
.cb i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--c);opacity:.72;transition:opacity .15s}
.cb:hover i,.cb.is-sel i{opacity:1}
.cb.is-sel::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:3px;border-radius:2px;background:var(--ink)}
.cat-quiet{--c:var(--ink-3)} .cat-trade{--c:var(--bull)} .cat-best{--c:var(--gold)} .cat-caution{--c:var(--wall)} .cat-avoid{--c:var(--bear)} .cat-closed{--c:var(--line-2)}
.clk-now{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--ink);pointer-events:none}
.clk-now span{position:absolute;top:0;left:4px;font-size:.7rem;font-weight:700;color:var(--ink);white-space:nowrap}
.clk-now.flip span{left:auto;right:4px}
.clk-ticks{position:relative;height:1.1rem;margin-top:.35rem;font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.clk-ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.clk-ticks span:first-child{transform:none}
.clk-ticks span:last-child{transform:translateX(-100%)}
.clk-detail{display:grid;gap:.45rem;padding:.9rem 1rem;border-radius:10px;background:var(--raise)}
.clk-dhead{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem}
.clk-time{font:800 1.05rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.clk-name{font-weight:600}
.cchip{display:inline-flex;align-items:center;padding:.15rem .55rem;border-radius:999px;font-size:.76rem;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.clk-detail p{margin:0;color:var(--ink-2);font-size:.95rem}
.clk-vol{font-size:.84rem;color:var(--ink-3)}
.clk-legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;margin:0;padding:0;list-style:none;font-size:.8rem;color:var(--ink-2)}
.clk-legend li{display:flex;align-items:center;gap:.4rem}
.clk-legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}

/* two-hour windows */
.win-track{position:relative;height:36px;border-radius:8px;background:var(--raise)}
.win-span{position:absolute;top:4px;bottom:4px;display:grid;place-items:center;min-width:20px;padding:0;border:0;border-radius:6px;background:var(--gold-soft);color:var(--gold);font:800 .82rem/1 var(--f-display)}
.win-span:hover{filter:brightness(1.15)}
.win-span.is-sel{background:var(--gold);color:var(--on-gold)}
.win-head{display:grid;gap:.3rem}
.win-head h3{margin:0;font:760 1.3rem/1.2 var(--f-display);font-stretch:106%}
.win-meta{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.88rem;color:var(--ink-2)}
.win-meta b{font-variant-numeric:tabular-nums;color:var(--ink)}
.win-head p{margin:0;color:var(--ink-2)}
.gantt{display:grid;gap:6px}
.g-row{position:relative;height:24px;border-radius:5px;background:var(--raise)}
.g-seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:6px;overflow:hidden;border-radius:5px;background:var(--c);color:var(--ground);font-size:.66rem;font-weight:700;white-space:nowrap}
.g-done{position:absolute;inset:0;display:flex;align-items:center;padding-left:8px;font-size:.72rem;color:var(--ink-3)}
.g-stop{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--bear)}
.g-scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.k-mark{--c:var(--wall)} .k-check{--c:var(--cyan)} .k-wait{--c:var(--ink-3)} .k-trade{--c:var(--bull)} .k-expect{--c:var(--gold)} .k-stop{--c:var(--bear)}
.wsteps{display:grid;gap:.1rem;margin:0;padding:0;list-style:none}
.wstep{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:.9rem;padding-block:.75rem;border-top:1px solid var(--line)}
.wstep-k{font:800 .84rem/1.2 var(--f-display);letter-spacing:.05em;color:var(--c)}
.wstep-k small{display:block;margin-top:.2rem;font:500 .78rem/1.3 var(--f-body);letter-spacing:0;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wstep ul{display:grid;gap:.35rem;margin:0;padding-left:1.05rem;color:var(--ink-2);font-size:.94rem}

/* risk-to-reward calculator */
.rr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem 1.2rem}
.rr-field{display:grid;gap:.4rem;min-width:0}
.rr-field label,.rr-lab{font-size:.86rem;font-weight:600;color:var(--ink-2)}
.rr-field label b{color:var(--ink);font-variant-numeric:tabular-nums}
.rr-field input[type=range]{width:100%;accent-color:var(--gold)}
.rr-presets{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.rr-presets .field{width:6rem;padding:.4rem .6rem}
.rr-out{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
.rr-cell{display:grid;gap:.25rem;padding:.75rem .8rem;border-radius:10px;background:var(--raise);min-width:0}
.rr-cell span{font-size:.76rem;color:var(--ink-3);line-height:1.25}
.rr-cell b{font:800 1.2rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rr-cell b.pos{color:var(--bull)} .rr-cell b.neg{color:var(--bear)}
.rr-verdict{margin:0;padding:.7rem .9rem;border-radius:10px;font-size:.92rem;font-weight:500;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}
.rr-verdict.ok{--c:var(--bull)} .rr-verdict.thin{--c:var(--gold)} .rr-verdict.no{--c:var(--bear)}

@media (max-width:720px){
  .clk-ticks span.odd{display:none}
  .clk-strip{height:120px}

  .rr-grid{grid-template-columns:minmax(0,1fr)}
  .rr-out{grid-template-columns:repeat(2,minmax(0,1fr))}

}
.sl-tgts{display:flex;flex-wrap:wrap;gap:.5rem}
.sl-tgts:empty{display:none}
.sl-tgt{padding:.4rem .7rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--bull) 40%,var(--line));font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sl-tgt b{color:var(--bull);margin-right:.3rem}

.rr-cell small{font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- Responsive ---------- */
.step-label{display:none;text-align:center;font-size:.8rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media (max-width:960px){

  .rail.open{transform:none}
  .rail-close{display:inline-grid;margin:0 0 .8rem auto}
  .scrim{position:fixed;inset:0;z-index:45;background:var(--scrim)}

  .lessons-btn{display:inline-flex}
}
@media (max-width:720px){
  .ph-sum{grid-template-columns:2.8rem minmax(0,1fr) 1.2rem}
  .ph-num{font-size:2.1rem}
  .ph-state{display:none}
  .ph-body{padding-left:0}
  .id-grid{grid-template-columns:minmax(0,1fr)}
  .chapter{grid-template-columns:minmax(0,1fr)}
  .chapter-num{font-size:6.5rem}
  .stepbar-in{gap:.6rem}
  .stepbar .btn{padding-inline:.8rem}
  .tb-candles{display:none}
  .tb-progress{margin-left:.25rem}

}

/* Curriculum overview text (English, from the original course page) */
const OUTLINE={"intro": "The MMM Mastery Course (The Order Flow Bible) is a structured, institutional-grade trading education that teaches you to read price as a battle between aggressive market orders (Hammers) and passive limit orders (Walls). Each phase below contains lessons, interactive quizzes and homework exercises, building from raw candle mechanics to a complete low-timeframe execution routine and a lasting trading identity.", "phases": [{"desc": "Every price move is the story of two opposing forces. <strong>The Hammer</strong> (aggressive market orders) attacks the opposite side at any price, deleting the Wall and creating expansion candles. <strong>The Wall</strong> (passive limit orders) sits and absorbs aggression — when it holds, you see wicks; when it breaks, you see a Body Close (BC). The Body Close is the only proof of momentum in the MMM: a candle whose body closes beyond the previous candle's range proves that the Hammer dominated. No BC = No momentum = No valid entry. Price oscillates between two states: <strong>Expansion</strong> (Hammers smash through Walls, consecutive BC candles, large bodies) and <strong>Contraction</strong> (Walls contain Hammers, inside bars, tight NBC range). Never enter inside a contraction range — the box is liquidity bait engineered by institutions for the next expansion move.", "lessons": ["Physics of Price — Hammers vs. Walls", "Expansion vs. Contraction market states", "The Body Close (BC) as the only proof of momentum", "The PCX override: opposite BC+ forces immediate exit without exception"]}, {"desc": "The MMM uses exactly 12 building-block candle types that every trader must classify in under 3 seconds. <strong>Expansion candles (BC+)</strong>: BuBC+ (closes above last High AND near its own top — long entry), BeBC+ (closes below last Low AND near its own bottom — short entry), BuBC− and BeBC− (Reload candles — the Wall pushed back, never enter). <strong>The PO4 motto</strong>: No PO4, No Trade. PO4 is the Body Close Violation — a directional body close that penetrates the Open of the prior opposing body close, proving institutional commitment. <strong>Rejection candles (AF)</strong>: BuAF+ (new Low, closes near top — highest conviction Wall defense), BeAF+ (new High, closes near bottom). <strong>Sovereign Sweeps (C2+)</strong>: sweeps a prior Low and closes above a prior High in one candle — the most powerful single-candle signal in the MMM. CI (Close Inside) and S&amp;D (Seek &amp; Destroy) candles require waiting for the first BC exiting their range before entering.", "lessons": ["Expansion Candles — BuBC+, BeBC+, BC− Reload candles", "The Wick Rule — lower wick required on BuBC+, upper wick on BeBC+", "PO4 — Body Close Violation entry motto", "AF candles — Bullish and Bearish Affinity (Strong and Weak)", "CI &amp; S&amp;D candles — pause and chaos classifications", "Sovereign Sweep (C2+) — the highest-conviction single-candle setup"]}, {"desc": "Without a directional bias from higher timeframes, every entry is structurally unjustified. Institutions use the Open of each major timeframe as their cost basis — they defend it when in profit and distribute when at a loss. The hierarchy is Yearly &gt; Quarterly &gt; Monthly &gt; Weekly &gt; Daily (Midnight NY). Price above the Yearly Open = asset managers in profit, buy dips. Price below = distributing, sell rips. The <strong>AMD Cycle (Accumulation–Manipulation–Distribution)</strong> governs every candle from 1-minute to Monthly: A = institutions quietly build positions in a sideways NBC range; M = The Judas Swing, price pushed the wrong direction to trigger retail stop-losses and create institutional liquidity; D = institutions release positions into that liquidity as strong BCs appear in the real direction. <strong>PDH/PDL</strong> (Previous Day High/Low) mark liquidity pools where stop-losses cluster — the highest-probability sweeps occur 9:30–10:30 AM ET at the NY Open.", "lessons": ["OHLC True Opens — Yearly, Quarterly, Monthly, Weekly, Daily institutional cost basis", "The Golden Hierarchy of timeframe opens", "AMD Cycle — Accumulation, Manipulation (Judas Swing), Distribution", "PDH / PDL — Previous Day liquidity pool entries", "NY Golden Window 9:30–10:30 AM ET for highest-probability stop sweeps"]}, {"desc": "Institutions execute on a precise 24-hour schedule. The <strong>Asian session (6 PM–2 AM EST)</strong> is Accumulation — algorithms build the NBC trap range, do not trade inside it. <strong>Frankfurt (2:00–2:30 AM)</strong> pre-engineers the London move. <strong>London Judas (2:30–3:00 AM)</strong> is peak Manipulation — the wrong-direction sweep harvests stop-losses; never enter during this window. <strong>London Open Initial Balance (3:00–4:00 AM)</strong> is the true trend origin with real institutional volume — prime entry window by trading the breakout of the Judas trap. The <strong>NY Golden Window (8:00–11:30 AM EST)</strong> is the highest-volume session with London + NY overlap — top-down confirmed entries only. The NY Initial Balance (9:30–10:30 AM) brings the opening bell retail flood; mark the IB high and low, wait 15 minutes, then trade the 10:30 AM BC. The <strong>Midnight Open (00:00 EST)</strong> is the true daily reset for futures — price above = premium (short bias), price below = discount (long bias).", "lessons": ["Midnight Open — true daily reset at 00:00 EST for futures", "Asian Box — Accumulation phase, never trade inside the NBC range", "London Judas Swing — Manipulation window 2:30–3:00 AM EST", "London Open Initial Balance — true trend origin and prime entry window", "NY Golden Window 8:00–11:30 AM EST — highest volume and best setups", "NY Initial Balance (9:30–10:30 AM) and IB break-and-retest entries"]}, {"desc": "Institutional imbalances are price regions where aggressive order flow skipped levels, leaving unfilled orders that act as powerful magnets for future price delivery. The MMM identifies three gap types: <strong>UAG (Unfair Aggressive Gap)</strong> — formed by two consecutive expansion candles in the same direction with no overlap between their bodies; price must return to fill the imbalance. <strong>UDG (Unfair Distribution Gap)</strong> — a gap between candle bodies created during rapid distribution; marks a high-probability re-test zone. <strong>ULG (Unfair Liquidity Gap)</strong> — the most aggressive imbalance, formed when a candle opens beyond the previous candle's high/low with no wick overlap; highest-priority fill target. Trading UAG/UDG/ULG fills: wait for price to reach the gap zone, then enter on the first confirming BC+ with a PO4 violation. Gaps on higher timeframes (Daily, 4H) have stronger magnetic pull than lower timeframe gaps.", "lessons": ["UAG — Unfair Aggressive Gap: two consecutive expansion candles, no body overlap", "UDG — Unfair Distribution Gap: rapid distribution gap, high-probability re-test zone", "ULG — Unfair Liquidity Gap: most aggressive imbalance, no wick overlap, highest fill priority", "Gap fill entry rules: BC+ with PO4 at gap boundary", "Timeframe hierarchy for gap strength (Daily and 4H gaps have strongest pull)"]}, {"desc": "Market architecture describes the scaffolding of price delivery — the structural framework of blocks, swings, and directional signals that tell you where institutions are delivering price and from where. <strong>CDL (Change of Delivery Long)</strong>: a bullish structural break confirming upward delivery has begun — occurs when a BuBC+ closes above the swing high of the previous bearish leg. <strong>CDS (Change of Delivery Short)</strong>: a bearish structural break confirming downward delivery — BeBC+ closes below the prior swing low. <strong>Blocks</strong>: the last opposing BC before a CDL/CDS forms — these are the institutional order zones where demand or supply was left behind; price returns to these blocks to reload. <strong>Swings</strong>: higher highs / higher lows (bullish structure) vs. lower highs / lower lows (bearish structure). Valid entries must align with the CDL/CDS direction — trading against the delivery structure, even on a perfect candle, is a structurally invalid trade.", "lessons": ["CDL — Change of Delivery Long: bullish structural break above swing high", "CDS — Change of Delivery Short: bearish structural break below swing low", "Blocks — the last opposing BC before a CDL/CDS, institutional order reload zones", "Swings — higher highs/higher lows vs. lower highs/lower lows", "Structure alignment rule — entries must match active CDL/CDS direction"]}, {"desc": "Once a CDL or CDS is confirmed, smart money delivers price through a predictable sequence. <strong>CDLx (Extended Change of Delivery Long)</strong>: price creates a new swing high beyond the CDL trigger, confirming the delivery is extending — enter on BC+ pullbacks to the CDLx level. <strong>CDSx (Extended Change of Delivery Short)</strong>: new swing low beyond the CDS trigger, confirmed downward extension. The <strong>PCX (Price Close Extreme) Override</strong> is the single most important rule in the entire MMM: if an opposite-direction BC+ forms at any time, regardless of structure, bias, or position, exit immediately — no exceptions. The PCX is not a signal to consider; it is a forced exit. Smart money delivery also includes recognizing when a CDL/CDS fails (price fails to make a new swing in the delivery direction) — a failed delivery is the highest-probability reversal signal in the MMM.", "lessons": ["CDLx — Extended long delivery above CDL trigger, pullback entries", "CDSx — Extended short delivery below CDS trigger", "PCX Override — opposite BC+ forces immediate exit without exception, overrides all biases", "Failed CDL/CDS — highest-probability reversal signal when delivery stalls"]}, {"desc": "Liquidity sweeps are engineered moves that reach beyond known levels to harvest stop-losses before reversing in the institutional direction. The MMM classifies three sweep grades: <strong>X (Basic Sweep)</strong>: price wicks beyond a prior swing high or low by a minimal amount — retail stops collected, wall absorbed. <strong>X+ (Extended Sweep)</strong>: price closes beyond the prior swing in a BC pattern — stronger confirmation that the sweep has completed and reversal is imminent. <strong>X++ (Double Sweep)</strong>: two consecutive sweeps of the same level — the highest-confidence sweep signal, often preceding the most explosive directional moves. The <strong>Volume Filter</strong> distinguishes genuine institutional sweeps from random volatility: a sweep accompanied by above-average volume (1.2× or more) on the reversal BC confirms institutional absorption; below-average volume on the sweep candle itself confirms the move was engineered stop-hunting rather than genuine momentum. The entry rule: wait for the first BC+ in the opposite direction after the sweep closes, confirm with PO4, enter at the BC close.", "lessons": ["X — Basic liquidity sweep: wick beyond prior swing, retail stops collected", "X+ — Extended sweep: BC close beyond prior swing, reversal imminent", "X++ — Double sweep: two consecutive sweeps, highest-confidence signal", "Volume Filter: above-average volume on reversal BC confirms institutional absorption", "Sweep entry rule: first BC+ after sweep completes + PO4 confirmation"]}, {"desc": "The 5-step low-timeframe entry checklist converts the entire MMM framework into a mechanical, repeatable execution routine. Every trade must pass all five steps — a score of 4/5 is not a trade. <strong>Step 1 — HTF Bias</strong>: Confirm active CDL or CDS on 4H/Daily, price in discount (longs) or premium (shorts) relative to the Midnight Open. <strong>Step 2 — 4H Confluence</strong>: Identify the nearest UAG/UDG/ULG or Block on the 4H that aligns with the HTF bias direction. <strong>Step 3 — 15M Aligned Fractal Entry</strong>: On the 15M chart, a CDL/CDS must form in the bias direction at or near the 4H confluence zone. <strong>Step 4 — 3M / 30-Second PO4</strong>: Drop to the 3M or 30-second chart and wait for the PO4 Body Close Violation within the 15M CDL/CDS structure. <strong>Step 5 — MMPD Confirmation</strong>: The MMM Perfect Delivery indicator on TradingView must confirm the signal — green arrow for longs, red for shorts. Stop-loss: 1 tick beyond the sweep wick extreme. Target: the next UAG/ULG zone or prior swing in the delivery direction.", "lessons": ["Step 1 — HTF bias: active CDL/CDS on 4H/Daily + Midnight Open premium/discount", "Step 2 — 4H confluence: nearest imbalance or Block aligned with bias", "Step 3 — 15M aligned fractal CDL/CDS at the 4H confluence zone", "Step 4 — 3M/30s PO4 Body Close Violation within the 15M structure", "Step 5 — MMPD indicator confirmation on TradingView", "Stop-loss placement: 1 tick beyond sweep wick extreme", "Target: next UAG/ULG or prior delivery swing"]}, {"desc": "A trading system is only as durable as the trader executing it. Phase 9 establishes the psychological and behavioral framework that keeps you consistent through drawdowns, winning streaks, and the inevitable periods of uncertainty. The <strong>3-Month Commitment</strong> protocol requires journaling every trade with: the setup grade (A/B/C), the five-step checklist score, the emotional state pre- and post-trade, and the outcome in R-multiples. After 90 days, a structured review identifies your most common mistake pattern, your highest-probability setup type, your optimal trading window, and your ideal position sizing. The Trading Identity document is a binding written statement of your rules, your edge, your risk tolerance, and your non-negotiables — reviewed and signed every 90 days. Consistency is the edge: a B-grade setup executed with discipline beats an A-grade setup taken emotionally every single time.", "lessons": ["Your 3-Month Commitment — daily trade journal with setup grade and checklist score", "90-day structured review — identify mistake patterns and highest-probability setups", "Trading Identity document — written rules, edge, risk tolerance, non-negotiables", "Emotional state tracking — pre-trade and post-trade journaling protocol", "R-multiple tracking — outcome measured in risk units, not dollars"]}]};

{type:'quiz', id:'q-po4-1', en:{q:'A BuBC forms closing above the last High (BuBC+ confirmed). But its close is BELOW the Open of the last BeBC. Is this a valid PO4 entry?',opts:['A — Yes — any BuBC+ is valid for entry','B — No — a PO4 requires the BuBC close to be ABOVE the Open of the last BeBC, not below it','C — Yes — the close above the last High is the only requirement','D — Only valid if volume exceeds 1.2x average'],correct:1,fb:'PO4 specifically requires the BuBC close to be ABOVE the Open of the last BeBC. Closing above the last High confirms it is a BuBC+ (expansion candle), but that alone is NOT a PO4. The PO4 is the Body Close Violation — the bullish body must penetrate the bearish body\'s origin (its Open). If the close is below the last BeBC\'s Open, the violation has not occurred. No PO4 = No entry.'},
fr:{q:'Un BuBC se forme en clôturant au-dessus du dernier High (BuBC+ confirmé). Mais sa clôture est EN DESSOUS de l\'Ouverture du dernier BeBC. Est-ce une entrée PO4 valide ?',opts:['A — Oui — tout BuBC+ est valide pour une entrée','B — Non — un PO4 nécessite que la clôture du BuBC soit AU-DESSUS de l\'Ouverture du dernier BeBC','C — Oui — la clôture au-dessus du dernier High est la seule exigence','D — Valide seulement si le volume dépasse 1,2x la moyenne'],correct:1,fb:'Le PO4 nécessite spécifiquement que la clôture du BuBC soit AU-DESSUS de l\'Ouverture du dernier BeBC. Clôturer au-dessus du dernier High confirme un BuBC+ mais ce n\'est PAS un PO4. Pas de PO4 = Pas d\'entrée.'}},
{type:'quiz', id:'q-L1-2', en:{q:'The "Wick Rule" states that a valid BuBC+ entry requires:',opts:['A — The candle must be at least twice the average candle size','B — A lower wick must be present, proving the Wall was tested before the BC closed','C — Volume must exceed 1.5x the average','D — The candle must close at its absolute high with zero upper wick'],correct:1,fb:'The Wick Rule: a BuBC+ requires a lower wick. The wick is physical proof that price tested the downside (the Wall was probed), found buyers (Hammers), and then the close moved higher. No lower wick = the Hammer attacked without testing the Wall = structurally unconfirmed. Same rule inverted for BeBC+ (must have upper wick).'},
fr:{q:'La "Règle des Mèches" stipule qu\'une entrée BuBC+ valide nécessite :',opts:['A — Le chandelier doit faire au moins deux fois la taille moyenne','B — Une mèche inférieure doit être présente, prouvant que le Mur a été testé','C — Le volume doit dépasser 1,5x la moyenne','D — Le chandelier doit clôturer à son high absolu sans mèche supérieure'],correct:1,fb:'La Règle des Mèches : un BuBC+ nécessite une mèche inférieure. La mèche est la preuve physique que le prix a testé le côté baissier (le Mur a été sondé), a trouvé des acheteurs, puis la clôture est montée plus haut.'}},

{id:'L1-2', title:{en:'Rejection, Pause & Sovereign Sweeps',fr:'Rejet, Pause & Balayages Souverains'}, cards:[

{type:'concept', en(){return `<div class="card-inner">${eyebrow('Phase 1','Rejection Candles — The Walls')}${h1('AF Candles & Sweep Candles')}${lead('When the Hammer probes a level and the Wall wins, we get Affinity candles. These prove institutional defense.')}

[tag('badge-be','BeAF+'),'New High → closes NEAR BOTTOM. Wall stopped buyers entirely.','Highest','EXIT LONGS / Entry: Close / T1: Bottom'],
[tag('badge-neu','BeAF−'),'New High → closes near top. Some selling, no conviction.','Medium','50% Wick / T1: Bottom']])}

[tag('badge-be','CI BeAF'),'Entirely INSIDE last candle. Closes in BOTTOM half.','AVOID. Wait for BC closing BELOW range boundary.'],
[tag('badge-bu','S&D BuAF'),'Goes ABOVE and BELOW last candle. Closes near TOP.','WAIT. Enter at open of first BC exiting S&D range upward.'],
[tag('badge-be','S&D BeAF'),'Goes above and below. Closes near BOTTOM.','WAIT. Enter at open of first BC exiting downward.']])}
${h2('Sovereign Sweep Candles — C2')}
${tbl(['Candle','Rule','Why It\'s Powerful'],

[tag('badge-be','BeC2+'),'Takes prior high (sweep) → closes BELOW prior Low near bottom.','Sweeps trapped longs AND closes with maximum bearish conviction. Most powerful single-candle signal.']])}
${ib('gold','⭐','<strong>C2 Sequence Rule:</strong> NEVER enter before the 2nd candle closes. The 2nd candle defines the grade. Stop = 1 tick beyond the wick extreme. These are the highest-conviction single-candle setups in the entire MMM.')}</div>`;},
fr(){return `<div class="card-inner">${eyebrow('Phase 1','Chandeliers de Rejet — Les Murs')}${h1('Chandeliers AF & Balayages Souverains')}
${tbl(['Chandelier','Règle','Force','Entrée'],

[tag('badge-be','BeAF+'),'Nouveau High → clôture PRÈS DU BAS.','Maximale','SORTIR LONGS / La Clôture'],
[tag('badge-bu','S&D BuAF'),'Au-dessus ET en dessous. Clôture près du haut.','Chaos','Attendre BC sortant vers le haut'],

{type:'quiz', id:'q-L1-3', en:{q:'A candle forms a NEW LOW below the previous candle\'s low, then reverses and closes near the TOP of its own range. This is classified as:',opts:['A — BuBC+ (Bullish Body Close Plus)','B — BuC2+ (Sovereign Sweep)','C — BuAF+ (Bullish Affinity Strong) — new low, closes near top','D — CI BuAF (Close Inside Bullish)'],correct:2,fb:'This is a BuAF+ (Bullish Affinity Strong). The key distinction: it makes a new Low (below the previous low) — that\'s the Hammer testing the Wall. But the close near the TOP means the Wall won decisively. It\'s NOT a BuBC+ because it didn\'t close above the previous High. It\'s NOT a BuC2+ because it didn\'t simultaneously sweep and close above a previous reference High.'},
fr:{q:'Un chandelier forme un NOUVEAU LOW en dessous du low précédent, puis se renverse et clôture près du HAUT de sa propre plage. Il est classifié comme :',opts:['A — BuBC+ (Bullish Body Close Plus)','B — BuC2+ (Balayage Souverain)','C — BuAF+ (Affinité Haussière Forte) — nouveau low, clôture près du haut','D — CI BuAF (Close Inside Haussier)'],correct:2,fb:'C\'est un BuAF+ (Affinité Haussière Forte). La distinction clé : il fait un nouveau Low — c\'est le Marteau testant le Mur. Mais la clôture près du HAUT signifie que le Mur a gagné de manière décisive.'}},

{type:'quiz', id:'q-L1-4', en:{q:'An S&D (Seek & Destroy) candle closes near the BOTTOM. What is the correct entry rule?',opts:['A — Enter short immediately at the S&D close','B — Enter long at the midpoint of the S&D candle','C — WAIT for the first BC+ exiting the S&D range downward, then enter at its open','D — Skip entirely — S&D candles have no valid entry'],correct:2,fb:'S&D candles are chaos — they went ABOVE and BELOW the last candle, meaning neither side won conclusively. For a bearish S&D (closes near bottom), you wait for the first BC that exits the S&D range DOWNWARD, then enter at the OPEN of that candle. Entering inside the S&D range means entering before direction is confirmed — you could be wrong on both sides.'},
fr:{q:'Un chandelier S&D (Seek & Destroy) clôture près du BAS. Quelle est la règle d\'entrée correcte ?',opts:['A — Entrer short immédiatement à la clôture du S&D','B — Entrer long au milieu du chandelier S&D','C — ATTENDRE le premier BC+ sortant de la plage S&D vers le bas, puis entrer à son ouverture','D — Ignorer entièrement — les S&D n\'ont pas d\'entrée valide'],correct:2,fb:'Les chandeliers S&D sont du chaos — ils sont allés AU-DESSUS et EN DESSOUS du dernier chandelier. Pour un S&D baissier (clôture près du bas), attendez le premier BC qui sort de la plage S&D VERS LE BAS, puis entrez à l\'ouverture de ce chandelier.'}},

{type:'hw', hwKey:'hw-L1-2', items:[

{type:'intro', en(){return `<div class="intro-card">${eyebrow('Phase 2','Macro Framing & Time Cycles')}<div class="intro-emblem">📅</div>${h1('From Yearly Open to Intraday Bias')}${lead('Without a directional bias from higher timeframes, every single entry is structurally unjustified. Macro framing tells you which side of the trade institutions are on before you look at the first candle.')}</div>`;}, fr(){return `<div class="intro-card">${eyebrow('Phase 2','Cadrage Macro')}<div class="intro-emblem">📅</div>${h1('De l\'Ouverture Annuelle au Biais Intraday')}${lead('Sans biais directionnel des unités de temps supérieures, chaque entrée est structurellement injustifiée.')}</div>`;}},

{type:'concept', en(){return `<div class="card-inner">${eyebrow('Phase 2','The AMD Cycle')}${h1('The Power of 3')}${lead('Every candle from 1-minute to Monthly follows the same 3-phase institutional process. AMD is not a concept — it\'s a mechanical reality of how institutional order flow operates.')}

{type:'quiz', id:'q-L2-1', en:{q:'Price has been trading above the Monthly Open for 3 weeks. It pulls back exactly to the Monthly Open level and a BuBC+ forms on the Daily chart. This is:',opts:['A — A bearish signal — the pullback to the open means the trend is reversing','B — A premium long entry — institutions defending their cost basis with a confirmed BC','C — Neutral — the Monthly Open has no special significance after 3 weeks','D — A long entry, but only if volume exceeds 2x average'],correct:1,fb:'Price returning to the Monthly Open is institutions defending their AVERAGE COST. They\'re protecting their profit. The BuBC+ at the open = institutional demand entering exactly where they need it. This is one of the highest-probability setups in the MMM: HTF Open + BuBC+ = premium entry with institutional backing. No special volume requirement — the BC is the confirmation.'},
fr:{q:'Le prix a tradé au-dessus de l\'Ouverture Mensuelle pendant 3 semaines. Il revient exactement au niveau de l\'Ouverture Mensuelle et un BuBC+ se forme sur le graphique journalier. C\'est :',opts:['A — Un signal baissier — le pullback vers l\'ouverture signifie que la tendance se renverse','B — Une entrée longue premium — les institutions défendent leur coût de base avec un BC confirmé','C — Neutre — l\'Ouverture Mensuelle n\'a pas de signification spéciale après 3 semaines','D — Une entrée longue, mais seulement si le volume dépasse 2x la moyenne'],correct:1,fb:'Le prix revenant à l\'Ouverture Mensuelle = les institutions défendent leur COÛT MOYEN. Le BuBC+ à l\'ouverture = la demande institutionnelle entre exactement là où elle en a besoin. C\'est l\'un des setups de plus haute probabilité du MMM : Ouverture HTF + BuBC+ = entrée premium avec soutien institutionnel.'}},

{type:'quiz', id:'q-L2-2', en:{q:'It\'s Tuesday. Price pushed DOWN sharply during the London session (2:30–3:00 AM), sweeping Monday\'s accumulation low. Then at 3:05 AM a BuBC+ forms and price starts moving up. This is the classic:',opts:['A — CDS (Change of Delivery Short) — bearish structural break','B — AMD Cycle — the Tuesday Judas Swing sweeping lows, followed by the real distribution upward','C — UDG (Unfair Distribution Gap) formation','D — PDL (Previous Day Low) sweep and recovery'],correct:1,fb:'This is the textbook AMD cycle on the weekly timeframe compressed into daily sessions. Monday = Accumulation (sideways). Tuesday London = Manipulation/Judas Swing (wrong direction, sweeping Monday lows to trigger stop-losses). 3:00 AM London Open = Distribution begins (real direction, BuBC+ confirms). Retail entered short on the Monday low break and is now trapped long.'},
fr:{q:'C\'est mardi. Le prix a baissé fortement pendant la session London (2h30–3h), balayant le bas d\'accumulation du lundi. Puis à 3h05 un BuBC+ se forme et le prix commence à monter. C\'est le classique :',opts:['A — CDS (Change of Delivery Short) — cassure structurelle baissière','B — Cycle AMD — le Judas Swing du mardi balayant les bas, suivi de la vraie distribution haussière','C — Formation d\'UDG (Unfair Distribution Gap)','D — Balayage et récupération du PDL'],correct:1,fb:'C\'est le cycle AMD classique. Lundi = Accumulation (latéral). Mardi London = Manipulation/Judas Swing (mauvaise direction, balayant les bas du lundi pour déclencher les stop-loss). 3h00 Ouverture London = Distribution commence (vraie direction, BuBC+ confirme).'}},

{type:'quiz', id:'q-L2-3', en:{q:'Price is above the Yearly Open, above the Quarterly Open, but just broke BELOW the Monthly Open with a BeBC+. Your trading bias is:',opts:['A — Strongly bullish — 2 of 3 major opens are bullish','B — Strongly bearish — only the Monthly matters for daily trading','C — Cautiously bearish — the short-term bias flips bearish but macro context is still bullish. Precision short entries only, targeting Monthly Open recapture.','D — Neutral — wait until price reclaims all three opens before trading'],correct:2,fb:'This is the nuanced answer that separates advanced MMM traders. Yearly + Quarterly bullish = macro tailwind still intact. BUT Monthly Open break with BeBC+ = short-term distribution confirmed. The correct approach: cautious short entries with tight risk, expecting a move down but acknowledging the broader macro is bullish. This move may be engineered to find buyers — a sweep and reclaim is very possible.'},
fr:{q:'Le prix est au-dessus de l\'Ouverture Annuelle, au-dessus de l\'Ouverture Trimestrielle, mais vient de casser EN DESSOUS de l\'Ouverture Mensuelle avec un BeBC+. Votre biais de trading est :',opts:['A — Fortement haussier — 2 des 3 ouvertures majeures sont haussières','B — Fortement baissier — seul le mensuel compte pour le trading quotidien','C — Prudemment baissier — le biais court terme devient baissier mais le contexte macro reste haussier. Entrées short de précision seulement.','D — Neutre — attendre que le prix récupère les trois ouvertures'],correct:2,fb:'Annuelle + Trimestrielle haussières = vent arrière macro intact. MAIS cassure de l\'Ouverture Mensuelle avec BeBC+ = distribution court terme confirmée. Approche correcte : entrées short prudentes avec risque serré, mais reconnaissant que le macro plus large est haussier.'}},

{type:'quiz', id:'q-L3-1', en:{q:'It is 2:47 AM EST. You see a very clean BeBC+ on the 5M chart that breaks below the Asian box low. This looks like a strong bearish signal. You should:',opts:['A — Enter short immediately — the BeBC+ is confirmed and the structure is broken','B — DO NOT ENTER — this is the London Judas period (2:30–3:00 AM), designed to trap shorts before a bullish reversal','C — Enter with half size to manage risk','D — Set an alert and re-evaluate at 3:00 AM'],correct:1,fb:'2:47 AM EST is inside the London Judas period (2:30–3:00 AM). This is THE manipulation window — price is specifically engineered to sweep stops in the wrong direction before the real move begins. The BeBC+ breaking the Asian low is EXACTLY the Judas Swing playing out. Retail shorts are being trapped. The real move after 3:00 AM London Open is very likely UP. DO NOT ENTER SHORT here regardless of how clean the signal looks.'},
fr:{q:'Il est 2h47 EST. Vous voyez un BeBC+ très propre sur le graphique 5M qui casse en dessous du bas de la boîte asiatique. Vous devez :',opts:['A — Entrer short immédiatement — le BeBC+ est confirmé','B — NE PAS ENTRER — c\'est la période du Judas London (2h30–3h), conçue pour piéger les shorts','C — Entrer avec moitié de la taille pour gérer le risque','D — Mettre une alerte et réévaluer à 3h'],correct:1,fb:'2h47 EST est dans la période du Judas London (2h30–3h). C\'est LA fenêtre de manipulation — le prix est spécifiquement conçu pour balayer les stops dans la mauvaise direction. Le BeBC+ cassant le bas asiatique est EXACTEMENT le Judas Swing en action. NE PAS ENTRER SHORT ici.'}},

{type:'quiz', id:'q-L3-2', en:{q:'The Dead Zone (11:30 AM – 1:30 PM EST) exists because:',opts:['A — US market is closed for lunch and volume drops to zero','B — London is closed, NY institutional traders are at lunch, volume is thin, and false signals dominate without real institutional flow','C — The SEC restricts trading activity during midday hours','D — Algorithms are reset at midday, creating unpredictable price action'],correct:1,fb:'The Dead Zone is NOT a legal restriction or technical reset. London closed at approximately 11:00 AM, and NY institutional desks are at lunch. With no major institutional flow, volume drops significantly. In this environment, small retail order flow can move price irrationally, creating signals that look valid but lead nowhere. The pattern of Dead Zone "setups" leading to losses is remarkably consistent — hence the absolute rule: Do Not Trade.'},
fr:{q:'La Zone Morte (11h30–13h30 EST) existe parce que :',opts:['A — Le marché américain est fermé pour le déjeuner et le volume tombe à zéro','B — London est fermé, les traders institutionnels NY sont au déjeuner, le volume est faible et les faux signaux dominent','C — La SEC restreint l\'activité de trading pendant les heures de midi','D — Les algorithmes sont réinitialisés à midi'],correct:1,fb:'La Zone Morte n\'est PAS une restriction légale. London a fermé, les desks institutionnels NY sont au déjeuner. Sans flux institutionnel majeur, le volume baisse significativement. Dans cet environnement, les petits flux retail peuvent faire bouger le prix de manière irrationnelle.'}},

['<strong style="color:var(--gold)">UDG<br>Unfair Distribution Gap</strong>','3-candle: C1 wick does NOT overlap C3 wick. C2 is an aggressive BC. The primary FVG.','🏆 Maximum — primary magnet','BC after gap = Level 1 (max continuation). CI = Level 2 (reload). AF = Level 3 (exhaustion).'],
['<strong style="color:var(--bl)">ULG<br>Unfair Liquidity Gap</strong>','Bodies do NOT overlap, but WICKS DO touch. Thin liquidity — train moved fast but tracks existed.','⚖ High — speed bump','Sharp fast reaction on return. Momentum was accelerating through.']])}
${ib('red','⚠️','<strong>NEVER blindly enter at a gap edge.</strong> Always wait for a BC confirmation candle at the level. The gap is the target zone — the BC is the entry trigger. Entering before BC confirmation = entering in front of the freight train.')}

${tbl(['Scenario','Signal','Action'],
[['<span style="color:var(--gr)">Defense (Continuity)</span>','AF or new BC forms at the EXACT EDGE of the gap.','Enter in the direction of the original gap. Trend confirmed.'],

${ib('gold','⭐','<strong>Golden Rule:</strong> Never stand in front of momentum because there\'s a gap behind it. Gaps are gravitational magnets — momentum is a rocket engine. Trade the momentum. Use gaps as TARGETS and RELOAD ZONES, never as entry zones without BC confirmation.')}</div>`;},

{type:'quiz', id:'q-L4-1', en:{q:'A UDG forms on the 1H chart. The 3rd candle (C3) is a CI (Close Inside). Price is approaching the gap from above. You should:',opts:['A — Enter long aggressively at the gap edge (Level 1 — max continuation)','B — Enter long at the 50% fill of the gap (Level 2 — reload zone), then watch for CI to break upward with a BC','C — Do not trade — CI after gap means the gap is violated','D — Enter short — CI after gap signals reversal'],correct:1,fb:'CI as the 3rd candle = Level 2 (Reload Zone). The Hammer paused but didn\'t give up. The correct entry: wait for price to come back to the 50% level of the gap, then watch for a BuBC+ or BuAF+ confirmation candle before entering. The CI tells you the gap needs to breathe before continuing. Level 1 (aggressive) requires a BC+ as C3, not a CI.'},
fr:{q:'Un UDG se forme sur le graphique 1H. Le 3ème chandelier (C3) est un CI (Close Inside). Le prix approche le gap par le dessus. Vous devez :',opts:['A — Entrer long agressivement à l\'orée du gap (Niveau 1 — continuation max)','B — Entrer long à 50% de remplissage du gap (Niveau 2 — zone de rechargement), puis surveiller le CI pour casser vers le haut avec un BC','C — Ne pas trader — CI après le gap signifie que le gap est violé','D — Entrer short — CI après gap signale un renversement'],correct:1,fb:'CI comme 3ème chandelier = Niveau 2 (Zone de Rechargement). Le Marteau a fait une pause mais n\'a pas abandonné. Entrée correcte : attendre que le prix revienne au niveau de 50% du gap, puis surveiller un chandelier de confirmation BuBC+ ou BuAF+.'}},

{type:'quiz', id:'q-L4-2', en:{q:'The difference between a UDG and a ULG is:',opts:['A — A UDG is bullish and a ULG is bearish','B — In a UDG, the wicks of C1 and C3 do NOT overlap. In a ULG, the bodies do NOT overlap but the wicks DO touch','C — A UDG appears on daily charts, a ULG appears on intraday charts','D — A UDG requires volume confirmation, a ULG does not'],correct:1,fb:'This is the precise structural distinction: UDG (Unfair Distribution Gap) = C1 wick top does NOT reach C3 wick bottom — complete separation even including wicks. ULG (Unfair Liquidity Gap) = the BODIES don\'t overlap, but the WICKS DO touch. Think of it as: UDG = train completely left the station with no tracks remaining. ULG = tracks still existed (wicks touch) but the train moved too fast for anyone to board (bodies don\'t overlap).'},
fr:{q:'La différence entre un UDG et un ULG est :',opts:['A — Un UDG est haussier et un ULG est baissier','B — Dans un UDG, les mèches de C1 et C3 ne se chevauchent PAS. Dans un ULG, les corps ne se chevauchent pas mais les mèches se TOUCHENT','C — Un UDG apparaît sur les graphiques journaliers, un ULG sur les graphiques intraday','D — Un UDG nécessite une confirmation du volume, un ULG non'],correct:1,fb:'C\'est la distinction structurelle précise : UDG = la mèche de C1 n\'atteint pas la mèche de C3 — séparation complète même en incluant les mèches. ULG = les CORPS ne se chevauchent pas, mais les MÈCHES se touchent.'}},

{type:'intro', en(){return `<div class="intro-card">${eyebrow('Phase 5','Market Architecture')}<div class="intro-emblem">🏗</div>${h1('Blocks, Swings & The Four Signal Systems')}${lead('The MMM defines four independent signal systems built on the Block and Swing framework. This is the backbone of structural trading — the skeleton every setup is built on.')}</div>`;}, fr(){return `<div class="intro-card">${eyebrow('Phase 5','Architecture du Marché')}<div class="intro-emblem">🏗</div>${h1('Blocs, Swings & Les Quatre Systèmes')}${lead('Le MMM définit quatre systèmes de signaux indépendants construits sur le cadre des Blocs et des Swings. C\'est le squelette sur lequel chaque configuration est construite.')}</div>`;}},

{type:'concept', en(){return `<div class="card-inner">${eyebrow('Phase 5','Block Types')}${h1('MMM Block Definitions')}
${ib('gold','🟨','<strong>MMM Expander Block:</strong> A BC candle that COULD NOT continue (expansion stopped) + the NBC candle(s) that immediately follow it. The BC sets the structural boundary. The NBC confirms the halt of momentum. This is the most common CDLx/CDSx trigger zone.')}
${ib('blue','🟦','<strong>MMM Contraction Block:</strong> Only NBC candles — no preceding failed BC. Pure equilibrium. Institutions are in full accumulation/distribution mode inside this range. Neither Hammers nor Walls won.')}

${tbl(['Signal','Trigger','Anchor','Target','Invalidation'],
[['<span style="color:var(--gr)">CDL — Change of Delivery Long</span>','Close ABOVE confirmed SH (Swing High)','CDL SL = the SL that caused the move up. Protected stop reference.','Buyers TGT = next SH','Close BELOW CDL SL'],
['<span style="color:var(--rd)">CDS — Change of Delivery Short</span>','Close BELOW confirmed SL (Swing Low)','CDS SH = the SH that caused the move down.','Sellers TGT = next SL','Close ABOVE CDS SH'],
['<span style="color:var(--gr)">LD1/LD2/LD3</span>','Additional SH breaks within active CDL','Same CDL SL anchor throughout','Next SH','CDL SL violated'],
['<span style="color:var(--rd)">SD1/SD2/SD3</span>','Additional SL breaks within active CDS','Same CDS SH anchor throughout','Next SL','CDS SH violated']])}
${ib('cyan','📊','<strong>Four Signal Systems:</strong><br>System 1: CDL/CDS = swing break (most common)<br>System 2: CDL+/CDS+ = non-touch BC break (bypassed level)<br>System 3: CDLx/CDSx + LDx/SDx = block reversal (highest precision)<br>System 4: PCX / CDLx+/CDSx+ = BC-on-BC power close (maximum conviction)')}</div>`;},
fr(){return `<div class="card-inner">${eyebrow('Phase 5','Types de Blocs')}${h1('Définitions des Blocs MMM')}
${ib('gold','🟨','<strong>Bloc Expander MMM :</strong> Un BC qui N\'A PAS PU continuer + les chandeliers NBC qui suivent immédiatement. C\'est la zone de déclenchement CDLx/CDSx la plus courante.')}
${ib('blue','🟦','<strong>Bloc Contraction MMM :</strong> Uniquement des chandeliers NBC. Équilibre pur. Les institutions sont en mode d\'accumulation/distribution complète.')}
${h2('CDL / CDS — Cassures Structurelles (Système 1)')}
${tbl(['Signal','Déclencheur','Invalidation'],

['<span style="color:var(--rd)">CDS</span>','Clôture EN DESSOUS du SL confirmé','Clôture AU-DESSUS du CDS SH']])}
${ib('cyan','📊','<strong>Quatre Systèmes :</strong><br>Sys 1 : CDL/CDS = cassure de swing<br>Sys 2 : CDL+/CDS+ = BC non-touché<br>Sys 3 : CDLx/CDSx = renversement de bloc<br>Sys 4 : PCX = BC-sur-BC')}</div>`;}},

{type:'quiz', id:'q-L5-1', en:{q:'The CDL SL (anchor) is:',opts:['A — The most recent Swing Low before the CDL signal','B — The specific Swing Low that CAUSED the upward move that eventually broke the Swing High (CDL trigger)','C — Any Swing Low below the current price','D — The stop-loss level set by the trader based on risk management'],correct:1,fb:'The CDL SL is highly specific: it\'s the SL that CAUSED the momentum that led to the CDL signal. Not just any SL. The sequence: price was at a SL → BCs moved up → made a SH → pullback → more BCs → CDL (close above SH). The SL from which the initial upward move originated is the CDL SL anchor. This remains the structural invalidation level as long as the CDL is active.'},
fr:{q:'Le CDL SL (ancre) est :',opts:['A — Le Swing Low le plus récent avant le signal CDL','B — Le Swing Low spécifique qui A CAUSÉ le mouvement haussier qui a finalement cassé le Swing High (déclencheur CDL)','C — Tout Swing Low en dessous du prix actuel','D — Le niveau de stop-loss fixé par le trader'],correct:1,fb:'Le CDL SL est très spécifique : c\'est le SL qui A CAUSÉ le momentum qui a conduit au signal CDL. Pas n\'importe quel SL. La séquence : prix au SL → BCs montent → font un SH → pullback → plus de BCs → CDL (clôture au-dessus du SH). Le SL d\'où provient le mouvement haussier initial est l\'ancre CDL SL.'}},

{type:'quiz', id:'q-L5-2', en:{q:'An MMM Expander Block requires:',opts:['A — Only NBC (neutral/contraction) candles, no expansion attempt','B — A BC candle that FAILED to continue expansion + the NBC candle(s) that immediately follow','C — At least 3 consecutive NBC candles','D — A gap imbalance within the block range'],correct:1,fb:'Expander Block = BC that COULD NOT continue + NBC immediately following. The failed BC sets the block boundary (the high or low). The NBC confirms the halt. Together they form the trigger zone for CDLx (if a BuBC later closes above the block high) or CDSx (if a BeBC closes below the block low). Just NBCs alone = Contraction Block, not Expander.'},
fr:{q:'Un Bloc Expander MMM nécessite :',opts:['A — Uniquement des chandeliers NBC, sans tentative d\'expansion','B — Un chandelier BC qui N\'A PAS PU continuer + les chandeliers NBC qui suivent immédiatement','C — Au moins 3 chandeliers NBC consécutifs','D — Un déséquilibre de gap dans la plage du bloc'],correct:1,fb:'Bloc Expander = BC qui N\'A PAS PU continuer + NBC immédiatement suivant. Le BC raté fixe la limite du bloc. Le NBC confirme l\'arrêt. Ensemble ils forment la zone de déclenchement pour CDLx ou CDSx. Les NBC seuls = Bloc Contraction, pas Expander.'}},

{type:'concept', en(){return `<div class="card-inner">${eyebrow('Phase 6','The Complete Delivery Cycle')}${h1('Balance → Break → Delivery')}${p('Every high-conviction MMM trade follows this exact four-step sequence. Skipping any step reduces the probability significantly.')}
<div style="display:flex;flex-direction:column;gap:8px;margin:16px 0">
