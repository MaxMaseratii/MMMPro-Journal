${ib('gold','③','<strong>CDLx / CDSx Block Break:</strong> BuBC closes ABOVE block high = CDLx. BeBC closes BELOW block low = CDSx. This is the primary entry trigger. The block that held price in balance has been decisively broken.')}
${ib('green','④','<strong>LDx / SDx Continuation:</strong> Pullback blocks form within the active CDLx/CDSx trend. LDx = pullback block broken back upward. SDx = pullback block broken back downward. Each LDx/SDx is another entry opportunity.')}
</div>
${h2('System 4: PCX — BC-on-BC Power Closes')}
${tbl(['Signal','Exact Trigger','What It Proves'],
[['<span style="color:var(--gr)">CDLx+</span>','BuBC closes ABOVE a BeBC candle\'s full BODY','Maximum conviction bullish delivery. Institutional demand overwhelmed ALL supply in a single candle. Most violent bullish signal.'],
['<span style="color:var(--rd)">CDSx+</span>','BeBC closes BELOW the LOW of a BuBC candle\'s full body','Maximum conviction bearish delivery. Institutional supply overwhelmed ALL demand. Most violent bearish signal.']])}
${ib('gold','⭐','<strong>PCX Distinction:</strong> CDLx+/CDSx+ are NOT block-based — they are direct BC-on-BC events. One directional BC so powerful it completely closes through the body of the opposing BC. You don\'t need a block trigger. The BC collision itself is the signal.')}</div>`;},
fr(){return `<div class="card-inner">${eyebrow('Phase 6','Le Cycle de Livraison Complet')}${h1('Équilibre → Cassure → Livraison')}
<div style="display:flex;flex-direction:column;gap:8px;margin:16px 0">
${ib('blue','①','<strong>Phase d\'Équilibre :</strong> Les chandeliers NBC forment un Bloc Contraction. OU un BC tente une expansion mais échoue → crée un Bloc Expander.')}
${ib('red','②','<strong>Fausse Cassure (Optionnelle mais Haute Valeur) :</strong> Prix balaye AU-DELÀ du bas/haut du bloc pour chasser les stop-loss retail. C\'est le carburant pour le vrai mouvement.')}
${ib('gold','③','<strong>Déclencheur CDLx/CDSx :</strong> BuBC clôture AU-DESSUS du haut du bloc = CDLx. BeBC clôture EN DESSOUS du bas du bloc = CDSx.')}
${ib('green','④','<strong>Continuation LDx/SDx :</strong> Les blocs de pullback se forment. LDx = bloc de pullback cassé vers le haut. Chaque LDx/SDx est une nouvelle opportunité d\'entrée.')}
</div>
${ib('gold','⭐','<strong>Distinction PCX :</strong> CDLx+/CDSx+ ne sont PAS basés sur des blocs — ce sont des événements BC-sur-BC directs. Un BC si puissant qu\'il clôture complètement à travers le corps du BC opposant.')}</div>`;}},

{type:'quiz', id:'q-L6-1', en:{q:'A CDLx signal (BuBC closes above block high) occurs AFTER a false break below the block low. Compared to a CDLx without a false break, this setup is:',opts:['A — Less reliable — the false break suggests indecision','B — Same reliability — the CDLx rule is the only factor','C — MORE reliable — the false break swept retail stops, creating institutional fuel. CDLx after false break = highest conviction long entry','D — Only valid if accompanied by a gap imbalance'],correct:2,fb:'False break BEFORE CDLx = highest conviction combination in Phase 6. Here\'s why: the false break below the block low (1) hunted retail stop-losses, (2) gave institutions maximum liquidity to accumulate long positions at the lowest possible price, and (3) trapped retail short sellers. When the CDLx then fires (close above block high), all those trapped shorts are forced to cover — adding MORE fuel to the upside move. This is the complete institutional delivery cycle.'},
fr:{q:'Un signal CDLx (BuBC clôture au-dessus du haut du bloc) se produit APRÈS une fausse cassure en dessous du bas du bloc. Par rapport à un CDLx sans fausse cassure, ce setup est :',opts:['A — Moins fiable — la fausse cassure suggère l\'indécision','B — Même fiabilité — la règle CDLx est le seul facteur','C — PLUS fiable — la fausse cassure a balayé les stops retail, créant du carburant institutionnel. CDLx après fausse cassure = entrée longue de conviction maximale','D — Valide seulement si accompagné d\'un déséquilibre de gap'],correct:2,fb:'Fausse cassure AVANT CDLx = combinaison de conviction maximale en Phase 6. La fausse cassure sous le bas du bloc a (1) chassé les stop-loss retail, (2) donné aux institutions une liquidité maximale pour accumuler des positions longues, et (3) piégé les vendeurs retail short.'}},

{type:'quiz', id:'q-L6-2', en:{q:'CDLx+ (System 4 PCX) differs from CDLx (System 3) because:',opts:['A — CDLx+ requires a gap imbalance, CDLx does not','B — CDLx is block-based (BuBC closes above block high). CDLx+ is BC-on-BC (BuBC closes above a BeBC\'s full body) — no block required','C — CDLx+ only applies on the daily timeframe','D — CDLx+ requires volume confirmation, CDLx does not'],correct:1,fb:'This is the precise technical distinction: CDLx = BuBC closes above the HIGH of an Expander or Contraction Block. Requires a block to exist. CDLx+ = BuBC closes above the BODY of a BeBC — no block needed. Just two BC candles facing each other. The CDLx+ is actually more visually dramatic and requires no block scanning — you just need to see one BC completely engulf the opposing BC.'},
fr:{q:'CDLx+ (Système 4 PCX) diffère de CDLx (Système 3) parce que :',opts:['A — CDLx+ nécessite un déséquilibre de gap, CDLx non','B — CDLx est basé sur un bloc (BuBC clôture au-dessus du haut du bloc). CDLx+ est BC-sur-BC (BuBC clôture au-dessus du corps complet d\'un BeBC) — pas de bloc requis','C — CDLx+ s\'applique uniquement sur le timeframe journalier','D — CDLx+ nécessite une confirmation de volume, CDLx non'],correct:1,fb:'CDLx = BuBC clôture au-dessus du HIGH d\'un Bloc Expander ou Contraction. Nécessite l\'existence d\'un bloc. CDLx+ = BuBC clôture au-dessus du CORPS d\'un BeBC — pas besoin de bloc. Juste deux chandeliers BC face à face.'}},

{type:'hw', hwKey:'hw-L6', items:[
{id:'hw-L6-1', chart:true, en:'Find 3 COMPLETE MMM delivery cycles on 4H/Daily: annotate all 4 steps (NBC block → false break if present → CDLx trigger → LD1/LD2 continuation). Measure the full point delivery from CDLx close to the first LD high. Paste screenshot:',fr:'Trouvez 3 cycles de livraison MMM COMPLETS sur 4H/Journalier : annotez les 4 étapes (bloc NBC → fausse cassure si présente → déclencheur CDLx → continuation LD1/LD2). Mesurez la livraison complète en points. Capture :'},
{id:'hw-L6-2', chart:true, en:'Find 5 CDLx+ (PCX) signals on any timeframe. For EACH confirm: the BuBC body closes above the FULL BeBC body (not just the close level — the entire body). Note the immediate 3-candle reaction in points. Paste screenshot:',fr:'Trouvez 5 signaux CDLx+ (PCX) sur n\'importe quel timeframe. Pour CHACUN confirmez : le corps BuBC clôture au-dessus du CORPS COMPLET BeBC. Notez la réaction immédiate sur 3 chandeliers en points. Capture :'}
]}
]}
]},

/* ──────────────── PHASE 7: SWEEPS ──────────────── */
{phase:7, icon:'🌊', title:{en:'Sweeps & Absorption',fr:'Balayages & Absorption'}, lessons:[
{id:'L7-1', title:{en:'X · X+ · X++ & Volume Filter',fr:'X · X+ · X++ & Filtre Volume'}, cards:[

{type:'intro', en(){return `<div class="intro-card">${eyebrow('Phase 7','Sweeps & Absorption')}<div class="intro-emblem">🌊</div>${h1('Liquidity Absorption & Sweep Classification')}${lead('Understanding what happens at a price level — absorbed, rejected, or broken — is the final order flow confirmation layer. It answers the key question: is the Wall genuinely holding, or is this a trap?')}</div>`;}, fr(){return `<div class="intro-card">${eyebrow('Phase 7','Balayages & Absorption')}<div class="intro-emblem">🌊</div>${h1('Classification des Balayages')}${lead('Comprendre ce qui se passe à un niveau de prix — absorbé, rejeté ou cassé — est la dernière couche de confirmation du flux d\'ordres.')}</div>`;}},

{type:'concept', en(){return `<div class="card-inner">${eyebrow('Phase 7','Sweep Grades')}${h1('X · X+ · X++ Classification')}${p('A sweep occurs when price PIERCES a Swing High or Low but fails to CLOSE beyond it. The level held despite being temporarily breached. The grade determines how convincingly it held.')}
${tbl(['Grade','Name','Close Location','Reliability','Entry Approach'],
[[tag('badge-neu','X'),'Weak Sweep','Close barely returns past the Swing level.','Low — often leads to a second, stronger sweep.','Skip or wait for X+ confirmation.'],
[tag('badge-bu','X+'),'Strong Sweep','Close returns INSIDE the swing range — past the sweep candle OPEN.','Medium-High — next candle is the entry trigger.','Enter on next BC+ in sweep direction. Stop: beyond wick.'],
[tag('badge-gold','X++'),'Super Strong Sweep','Close returns DEEP past the MIDPOINT of the range.','Highest — sweep candle itself is often the entry.','Enter at the sweep candle close. Stop: 1 tick beyond wick extreme.']])}
${h2('Volume Context — The Critical Filter')}
${tbl(['Volume Ratio','Classification','Meaning','Action'],
[['≤ 0.8x average','<span style="color:var(--bl)">Stop Hunt</span>','Thin liquidity sweep. No real institutional selling. Retail stops cleared.','Continuation likely — real move often continues in sweep direction after stops clear.'],
['0.8x – 1.2x average','Normal Defense','Sellers present but not overwhelming. Level held without violence.','Wait for next BC confirmation before entering.'],
['≥ 1.2x average','<span style="color:var(--gold)">Absorption</span>','Institutions absorbed ALL opposing pressure. Wall is very strong.','High conviction: BeBC+/BeAF+ on next candle = short entry (or BuBC+/BuAF+ for long).'],
['≥ 1.5x average','<span style="color:var(--rd)">Exhaustion</span>','Complete trend exhaustion. Distribution confirmed.','Immediate entry on the confirmation candle. Maximum conviction reversal.']])}
${ib('red','⚠️','<strong>NEVER act on a sweep without the volume check.</strong> A beautiful X++ sweep at a Swing High with 0.6x volume is a Stop Hunt — the real move may continue up. The same sweep with 1.4x volume = Absorption — high conviction reversal. Volume transforms identical chart patterns into opposite trade decisions.')}</div>`;},
fr(){return `<div class="card-inner">${eyebrow('Phase 7','Niveaux de Balayage')}${h1('Classification X · X+ · X++')}
${tbl(['Niveau','Nom','Emplacement de Clôture','Fiabilité'],
[[tag('badge-neu','X'),'Balayage Faible','Clôture revient à peine au-delà du niveau de Swing.','Faible'],
[tag('badge-bu','X+'),'Balayage Fort','Clôture revient À L\'INTÉRIEUR de la plage — au-delà de l\'ouverture du chandelier.','Moyen-Élevé'],
[tag('badge-gold','X++'),'Balayage Super Fort','Clôture retourne EN PROFONDEUR au-delà du POINT MÉDIAN.','Le plus élevé']])}
${tbl(['Ratio Volume','Classification','Action'],
[['≤ 0,8x moy','<span style="color:var(--bl)">Chasse aux Stops</span>','Continuation probable — le vrai mouvement continue souvent.'],
['≥ 1,2x moy','<span style="color:var(--gold)">Absorption</span>','Haute conviction : BC+/AF+ sur le prochain chandelier = entrée.'],
['≥ 1,5x moy','<span style="color:var(--rd)">Épuisement</span>','Renversement de conviction maximale.']])}
${ib('red','⚠️','<strong>Ne JAMAIS agir sur un balayage sans vérifier le volume.</strong> Un X++ avec 0,6x de volume = Chasse aux Stops. Le même X++ avec 1,4x = Absorption. Le volume transforme des configurations identiques en décisions de trade opposées.')}</div>`;}},

{type:'quiz', id:'q-L7-1', en:{q:'An X++ sweep occurs at a Swing High (close returns deep past midpoint). Volume is 0.7x the 20-period average. You should:',opts:['A — Enter short immediately — X++ is the strongest sweep grade','B — Enter short with reduced size — the grade is confirmed but volume is light','C — DO NOT ENTER — volume ≤0.8x = Stop Hunt. The real move may continue UPWARD after clearing retail shorts','D — Wait for the next candle; if it\'s a BeBC+ then enter short regardless of volume'],correct:2,fb:'Volume 0.7x = Stop Hunt classification. Despite the impressive X++ grade, thin volume means institutional sellers were NOT genuinely present at that level. Price moved that far to clear retail stop-losses, not because smart money is distributing. After the stop hunt clears, the Hammer may resume upward. DO NOT SHORT. Watch for a BuBC+ recovery instead — that would be the real directional signal.'},
fr:{q:'Un balayage X++ se produit à un Swing High (clôture revient profondément au-delà du point médian). Le volume est à 0,7x la moyenne sur 20 périodes. Vous devez :',opts:['A — Entrer short immédiatement — X++ est le niveau de balayage le plus fort','B — Entrer short avec taille réduite — le niveau est confirmé mais le volume est léger','C — NE PAS ENTRER — volume ≤0,8x = Chasse aux Stops. Le vrai mouvement peut continuer à LA HAUSSE après avoir effacé les shorts retail','D — Attendre le prochain chandelier ; si c\'est un BeBC+ alors entrer short peu importe le volume'],correct:2,fb:'Volume 0,7x = classification Chasse aux Stops. Malgré le niveau X++ impressionnant, le volume fin signifie que les vendeurs institutionnels n\'étaient PAS réellement présents à ce niveau. Le prix s\'est déplacé aussi loin pour effacer les stop-loss retail, pas parce que le smart money distribue. NE PAS SHORTER.'}},

{type:'quiz', id:'q-L7-2', en:{q:'The difference between "Sellers Absorbed Buyers" and "Stop Hunt" at a Swing High is:',opts:['A — Stop Hunts always push below Swing Highs; Absorption always stays above','B — Absorption has volume ≥1.2x average (institutional sellers genuinely present). Stop Hunt has volume ≤0.8x (thin sweep, no real distribution)','C — Absorption requires a BeBC+ confirmation; Stop Hunt requires a BuBC+','D — They are the same pattern with different names'],correct:1,fb:'Volume is the ONLY differentiator. Same visual pattern (wick above SH, close back below), opposite trade implications. Absorption (≥1.2x) = institutional sellers distributed INTO the buying pressure, confirming strong supply at that level. Stop Hunt (≤0.8x) = retail stops cleared with minimal institutional involvement, price may continue up. This is why the MMM insists: check volume BEFORE any sweep trade.'},
fr:{q:'La différence entre "Vendeurs Ont Absorbé les Acheteurs" et "Chasse aux Stops" à un Swing High est :',opts:['A — Les Chasses aux Stops poussent toujours en dessous des Swing Highs ; l\'Absorption reste toujours au-dessus','B — L\'Absorption a un volume ≥1,2x la moyenne (vendeurs institutionnels présents). La Chasse aux Stops a un volume ≤0,8x (balayage fin, pas de vraie distribution)','C — L\'Absorption nécessite une confirmation BeBC+ ; la Chasse aux Stops une BuBC+','D — Ce sont les mêmes configurations avec des noms différents'],correct:1,fb:'Le volume est le SEUL différenciateur. Même configuration visuelle, implications de trade opposées. Absorption (≥1,2x) = vendeurs institutionnels ont distribué DANS la pression d\'achat. Chasse aux Stops (≤0,8x) = stops retail effacés avec implication institutionnelle minimale.'}},

{type:'hw', hwKey:'hw-L7', items:[
{id:'hw-L7-1', chart:true, en:'Find 10 sweeps on 15M or 1H charts. For each record: grade (X/X+/X++), direction (bull/bear), volume ratio vs 20-MA, actual outcome over next 3 candles. Paste your annotated screenshot showing at least 3 of these:',fr:'Trouvez 10 balayages sur graphiques 15M ou 1H. Pour chacun enregistrez : niveau (X/X+/X++), direction (haussier/baissier), ratio volume vs MA-20, résultat sur 3 chandeliers. Capture annotée (au moins 3) :'},

]}
]}

{phase:8, icon:'🎯', title:{en:'LTF Execution Matrix',fr:'Matrice d\'Exécution LTF'}, lessons:[

{type:'intro', en(){return `<div class="intro-card">${eyebrow('Phase 8','LTF Execution Matrix')}<div class="intro-emblem">🎯</div>${h1('Precision Entry Tools')}${lead('Top-down analysis delivers you to a Point of Interest. LTF tools are the sniper scope that gives you the exact candle, exact price, and exact timing to pull the trigger — with maximum precision and minimum risk.')}</div>`;}, fr(){return `<div class="intro-card">${eyebrow('Phase 8','Matrice d\'Exécution LTF')}<div class="intro-emblem">🎯</div>${h1('Outils d\'Entrée de Précision')}${lead('L\'analyse top-down vous amène au Point d\'Intérêt. Les outils LTF sont la lunette de précision qui vous donne le chandelier exact, le prix exact et le timing exact.')}</div>`;}},

{type:'concept', en(){return `<div class="card-inner">${eyebrow('Phase 8','The Non-Negotiable Checklist')}${h1('5-Step Entry Checklist')}${p('Every single entry must pass ALL 5 checks. No exceptions. No "close enough." The checklist exists to eliminate FOMO, Dead Zone trades, and structurally unjustified entries.')}
${tbl(['Step','Check','Pass Criteria','Fail = Action'],
[['<span style="color:var(--gold);font-weight:800;font-family:var(--fm)">1</span>','<strong>HTF Structure</strong>','CDL or CDS active on Daily/4H. Directional bias confirmed.','No trade. Wait for structural break.'],
['<span style="color:var(--gold);font-weight:800;font-family:var(--fm)">2</span>','<strong>Price Location</strong>','Longs: Discount (0–35%). Shorts: Premium (65–100%).','No trade. Price is in wrong zone for the bias.'],
['<span style="color:var(--gold);font-weight:800;font-family:var(--fm)">3</span>','<strong>Imbalance Zone</strong>','UDG, PEL, or PES within 5–10 points of entry.','No trade. No institutional magnet nearby.'],
['<span style="color:var(--gold);font-weight:800;font-family:var(--fm)">4</span>','<strong>PO4 + LTF Entry Candle</strong>','<span style="color:var(--gold);font-weight:600">PO4 required:</span> BuBC closes above last BeBC open (long) or BeBC closes below last BuBC open (short). Then entry candle: BuBC+/BuAF+/BuC2+ long, BeBC+/BeAF+/BeC2+ short. <strong>No PO4 = No entry. Always.</strong>','No trade. No PO4 violation = no entry regardless of candle quality.'],
['<span style="color:var(--gold);font-weight:800;font-family:var(--fm)">5</span>','<strong>Volume Context</strong>','Volume ≥1.0x average. Delta aligned with direction.','No trade. Absorption absent = Wall may still win.']])}
${h2('LTF Execution Tools')}
${tbl(['Tool','Settings','MMM Application'],
[['<strong>Fibonacci OTE</strong>','0.5, 0.618, 0.705, 0.786','Measure 15M impulse from HTF zone. Enter at Golden Zone (0.618–0.786 retracement). OTE + BuAF+ at 0.705 inside PEL = gold standard.'],
['<strong>Volume Profile</strong>','POC, VAH, VAL','VAL + BuAF+/BuBC+ inside PEL = Perfect Entry Long. VAH + BeAF+/BeBC+ inside PES = Perfect Entry Short.'],
['<strong>EMA Ribbon</strong>','20 + 50 EMA (5M)','Cross inside HTF POI in direction of bias. EMA cross + CDL active + BC+ = three-layer confluence.'],
['<strong>Bollinger Bands</strong>','Length 20, 2.0 SD','Squeeze inside HTF POI = energy compressing. Enter on BC+ breaking upper/lower band.'],
['<strong>RSI Divergence</strong>','Length 14, 15M','Price higher high but RSI lower high at HTF resistance = exhaustion. Combine with BeBC+ + X++ sweep.']])}
${ib('red','🚫','<strong>ALL 5 must PASS. 4/5 is NOT enough.</strong> The checklist is the difference between a professional MMM trader and a retail guesser. If one step fails, the trade does not exist — it gets logged as "missed setup" and you move on.')}</div>`;},
fr(){return `<div class="card-inner">${eyebrow('Phase 8','La Checklist Non-Négociable')}${h1('Checklist d\'Entrée en 5 Étapes')}
${tbl(['Étape','Vérification','Critère de Réussite'],
[['<span style="color:var(--gold);font-weight:800">1</span>','<strong>Structure HTF</strong>','CDL ou CDS actif sur Journalier/4H.'],
['<span style="color:var(--gold);font-weight:800">2</span>','<strong>Localisation du Prix</strong>','Longs : Remise (0–35%). Shorts : Prime (65–100%).'],

['<span style="color:var(--gold);font-weight:800">5</span>','<strong>Contexte de Volume</strong>','Volume ≥1,0x moy. Delta aligné.']])}
${ib('red','🚫','<strong>TOUTES les 5 doivent RÉUSSIR. 4/5 ne suffit PAS.</strong> La checklist est la différence entre un trader MMM professionnel et un devineur retail.')}</div>`;}},

{type:'quiz', id:'q-L8-1', en:{q:'You find a setup: CDL active (Step 1 ✓), price in Discount zone (Step 2 ✓), UDG nearby (Step 3 ✓), clean BuBC+ formed (Step 4 ✓), but volume is 0.85x average (Step 5 ✗). You should:',opts:['A — Enter — 4/5 is an excellent score, the one failure is minor','B — Enter with reduced position size to compensate for the volume','C — DO NOT ENTER. All 5 must pass. Log it as a missed setup and wait.','D — Enter if the next candle closes above the BuBC+ with higher volume'],correct:2,fb:'4/5 = NO TRADE. This is absolute. The 0.85x volume tells you absorption is absent — the Wall may still be resisting. Yes, 4 conditions align perfectly. But without volume confirmation, you\'re entering a potentially false signal. The professional move: log it as "missed setup" (not a loss), note that volume was the missing piece, and observe what happens. This data trains your patience over time.'},
fr:{q:'Vous trouvez un setup : CDL actif (Étape 1 ✓), prix en zone Remise (Étape 2 ✓), UDG proche (Étape 3 ✓), BuBC+ propre formé (Étape 4 ✓), mais le volume est à 0,85x la moyenne (Étape 5 ✗). Vous devez :',opts:['A — Entrer — 4/5 est un excellent score, l\'échec est mineur','B — Entrer avec une taille de position réduite','C — NE PAS ENTRER. Les 5 doivent réussir. L\'enregistrer comme setup manqué et attendre.','D — Entrer si le prochain chandelier clôture au-dessus du BuBC+ avec un volume plus élevé'],correct:2,fb:'4/5 = PAS DE TRADE. C\'est absolu. Le volume à 0,85x vous dit que l\'absorption est absente — le Mur peut encore résister. Le mouvement professionnel : l\'enregistrer comme "setup manqué" (pas une perte), noter que le volume était la pièce manquante, et observer ce qui se passe.'}},

{type:'quiz', id:'q-L8-2', en:{q:'The Fibonacci OTE "Golden Zone" for entries is between:',opts:['A — 0.5 and 0.618 retracement','B — 0.618 and 0.786 retracement (with 0.705 as the ideal entry)','C — 0.786 and 1.0 (deep retracement)','D — 0.382 and 0.5 (shallow retracement)'],correct:1,fb:'The MMM Fibonacci OTE Golden Zone = 0.618 to 0.786 retracement, with 0.705 as the ideal precision entry. The sequence: (1) identify the 15M impulse move away from your HTF zone, (2) draw Fibonacci from the swing low to swing high of that impulse, (3) wait for price to retrace INTO 0.618–0.786, (4) look for BuAF+/BuBC+ confirmation at 0.705 inside an active PEL. This is the "gold standard" LTF entry in the MMM system.'},
fr:{q:'La "Zone d\'Or" Fibonacci OTE pour les entrées se situe entre :',opts:['A — Retracement 0,5 et 0,618','B — Retracement 0,618 et 0,786 (avec 0,705 comme entrée idéale)','C — Retracement 0,786 et 1,0 (retracement profond)','D — Retracement 0,382 et 0,5 (retracement peu profond)'],correct:1,fb:'La Zone d\'Or Fibonacci OTE MMM = retracement 0,618 à 0,786, avec 0,705 comme entrée de précision idéale. Séquence : (1) identifier le mouvement d\'impulsion 15M loin de votre zone HTF, (2) tracer le Fibonacci du bas au haut de cet élan, (3) attendre le retracement DANS 0,618–0,786, (4) chercher confirmation BuAF+/BuBC+ à 0,705 dans un PEL actif.'}},

{type:'quiz',id:'q-L3-3-3',

/* ---------- PHASE 5 · Trend, Pullback & Resumption ---------- */
const LESSON_TPR={id:'L5-2',title:{en:'Trend, Pullback & Resumption',fr:'Tendance, Pullback & Reprise'},cards:[
{type:'intro',
 en(){return `<div class="intro-card">${eyebrow('Phase 5',`Market Architecture`)}<div class="intro-emblem">🌊</div>${h1(`Trend, Pullback & Resumption`)}${lead(`Markets move in waves. Each wave has an origin, a pullback and a resumption. Number them, and you always know if the trend is continuing or turning.`)}</div>`;},
 fr(){return `<div class="intro-card">${eyebrow('Phase 5',`Architecture du Marché`)}<div class="intro-emblem">🌊</div>${h1(`Tendance, Pullback & Reprise`)}${lead(`Les marchés bougent en vagues. Chaque vague a une origine, un pullback et une reprise. Numérotez-les, et vous saurez toujours si la tendance continue ou tourne.`)}</div>`;}},
{type:'concept',
 en(){return `<div class="card-inner">${eyebrow('Phase 5',`The Three Wave Points`)}${h1(`T, P and R`)}${lead(`The market moves in structural waves. Every wave point sits at the OPEN of the body-close candle that created it.`)}
${tbl([`Point`,`Name`,`What It Marks`],[
 [`<strong style="color:var(--gold)">T</strong> (T1, T2, T3)`,`Trend Origin`,`The starting point of an impulse leg: the PO4 origin.`],
 [`<strong style="color:var(--rd)">P</strong> (P1, P2, P3)`,`Pullback`,`The origin of a retracement against the trend: the first body close in the opposite direction.`],
 [`<strong style="color:var(--gr)">R</strong> (R1, R2, R3)`,`Resumption`,`The point where the trend resumes: the first body close back in the trend direction after the pullback.`]])}
${h2(`The Structural Range`)}${p(`The zone between a trend origin and its pullback (for example T1 to P1) is the <strong>Structural Range</strong>. Inside it the market is in a <strong>waiting phase</strong>: it consolidates until it confirms either a continuation or a reversal.`)}
${ib('gold','⭐',`<strong>The PO4 Origin Leg:</strong> After a pullback, the first candle body close back in the trend direction is the <strong>Resumption Candle</strong>. When price breaks out of the range, that Resumption Candle officially becomes the new PO4 Origin Leg (T2, T3...) for the next phase of the trend.`)}
${ib('blue','🔗',`<strong>Link to Phase 1:</strong> "No PO4, no trade" says a body close must violate the OPEN of the opposing body close. Now you can see where those opens come from: every T, P and R level is a candle's open.`)}</div>`;},
 fr(){return `<div class="card-inner">${eyebrow('Phase 5',`Les Trois Points de Vague`)}${h1(`T, P et R`)}${lead(`Le marché bouge en vagues structurelles. Chaque point de vague se trouve à l'OUVERTURE de la bougie à clôture de corps qui l'a créé.`)}
${tbl([`Point`,`Nom`,`Ce Qu'il Marque`],[
 [`<strong style="color:var(--gold)">T</strong> (T1, T2, T3)`,`Origine de Tendance`,`Le point de départ d'une jambe d'impulsion : l'origine PO4.`],
 [`<strong style="color:var(--rd)">P</strong> (P1, P2, P3)`,`Pullback`,`L'origine d'un retracement contre la tendance : la première clôture de corps dans le sens opposé.`],
 [`<strong style="color:var(--gr)">R</strong> (R1, R2, R3)`,`Reprise`,`Le point où la tendance reprend : la première clôture de corps dans le sens de la tendance après le pullback.`]])}
${h2(`Le Range Structurel`)}${p(`La zone entre une origine de tendance et son pullback (par exemple T1 à P1) est le <strong>Range Structurel</strong>. À l'intérieur, le marché est en <strong>phase d'attente</strong> : il consolide jusqu'à confirmer une continuation ou un renversement.`)}
${ib('gold','⭐',`<strong>La Jambe d'Origine PO4 :</strong> après un pullback, la première clôture de corps dans le sens de la tendance est la <strong>Bougie de Reprise</strong>. Quand le prix sort du range, cette Bougie de Reprise devient officiellement la nouvelle Jambe d'Origine PO4 (T2, T3...) pour la phase suivante de la tendance.`)}
${ib('blue','🔗',`<strong>Lien avec la Phase 1 :</strong> « Pas de PO4, pas de trade » dit qu'une clôture de corps doit violer l'OUVERTURE de la clôture opposée. Vous voyez maintenant d'où viennent ces ouvertures : chaque niveau T, P et R est l'ouverture d'une bougie.`)}</div>`;}},
{type:'concept',
 en(){return `<div class="card-inner">${eyebrow('Phase 5',`Continuation vs. Reversal`)}${h1(`The Two Rules`)}${lead(`Two strict rules decide the state of the market. Pick a rule and step through it.`)}
${WG('chart','data-charts="tpr-cont,tpr-rev"')}
${tbl([`Rule`,`Sequence`,`Condition`,`Result`],[
 [`<span style="color:var(--gr)">Continuation</span>`,`T1 → P1 → R1`,`The resumption (R1) leg closes beyond P1.`,`TREND CONTINUATION. The breakout establishes T2.`],
 [`<span style="color:var(--rd)">Reversal</span>`,`T1 → P1`,`P1 breaks and price closes beyond T1.`,`TREND REVERSAL. The P1 origin becomes the new T1 of the opposite trend.`]])}
${ib('red','🚫',`<strong>Inside the range, wait.</strong> Between T1 and P1 nothing is decided. Do not guess the outcome. Let a close beyond P1 or beyond T1 tell you.`)}</div>`;},
 fr(){return `<div class="card-inner">${eyebrow('Phase 5',`Continuation vs. Renversement`)}${h1(`Les Deux Règles`)}${lead(`Deux règles strictes décident de l'état du marché. Choisissez une règle et avancez étape par étape.`)}
${WG('chart','data-charts="tpr-cont,tpr-rev"')}
${tbl([`Règle`,`Séquence`,`Condition`,`Résultat`],[
 [`<span style="color:var(--gr)">Continuation</span>`,`T1 → P1 → R1`,`La jambe de reprise (R1) clôture au-delà de P1.`,`CONTINUATION DE TENDANCE. La cassure établit T2.`],
 [`<span style="color:var(--rd)">Renversement</span>`,`T1 → P1`,`P1 casse et le prix clôture au-delà de T1.`,`RENVERSEMENT DE TENDANCE. L'origine P1 devient le nouveau T1 de la tendance opposée.`]])}
${ib('red','🚫',`<strong>Dans le range, attendez.</strong> Entre T1 et P1 rien n'est décidé. Ne devinez pas. Laissez une clôture au-delà de P1 ou de T1 vous le dire.`)}</div>`;}},
{type:'quiz',id:'q-L5-2-1',
 en:{q:'Bull trend: T1 → P1 → R1. A candle now closes ABOVE the P1 level. What happened?',opts:['A — A reversal','B — Nothing yet, wait for T3','C — A new P1 forms','D — Trend continuation: the breakout establishes T2, and the R1 resumption candle becomes the new PO4 origin'],correct:3,fb:'Continuation rule: T1 → P1 → R1, and the resumption leg closes beyond P1. The trend continues and the Resumption Candle becomes the new PO4 Origin Leg, T2. On MMM Pro this prints as LD1 (Long Delivery).'},
 fr:{q:"Tendance haussière : T1 → P1 → R1. Une bougie clôture maintenant AU-DESSUS du niveau P1. Que s'est-il passé ?",opts:["A — Un renversement","B — Rien encore, attendez T3","C — Un nouveau P1 se forme","D — Continuation de tendance : la cassure établit T2, et la bougie de reprise R1 devient la nouvelle origine PO4"],correct:3,fb:"Règle de continuation : T1 → P1 → R1, et la jambe de reprise clôture au-delà de P1. La tendance continue et la Bougie de Reprise devient la nouvelle Jambe d'Origine PO4, T2. Sur MMM Pro, cela s'affiche LD1 (Long Delivery)."}},
{type:'quiz',id:'q-L5-2-2',
 en:{q:'Bull trend: T1 → P1. Price falls and closes BELOW T1. What happened?',opts:['A — Trend reversal: the P1 origin becomes the new T1 of the bearish trend','B — Continuation','C — P2 forms','D — The trend stays bullish until the daily close'],correct:0,fb:'Reversal rule: P1 breaks and price closes beyond T1. The bullish trend is over. The P1 origin, the open of the first bearish pullback candle, becomes the new bearish T1.'},
 fr:{q:"Tendance haussière : T1 → P1. Le prix baisse et clôture EN DESSOUS de T1. Que s'est-il passé ?",opts:["A — Renversement de tendance : l'origine P1 devient le nouveau T1 de la tendance baissière","B — Continuation","C — P2 se forme","D — La tendance reste haussière jusqu'à la clôture journalière"],correct:0,fb:"Règle de renversement : P1 casse et le prix clôture au-delà de T1. La tendance haussière est finie. L'origine P1, l'ouverture de la première bougie baissière de pullback, devient le nouveau T1 baissier."}},
{type:'quiz',id:'q-L5-2-3',

/* ---------- NEW PHASE · The MMM Pro Indicator ---------- */
const LESSON_MMP1={id:'MMP-1',title:{en:'Reading the Labels',fr:'Lire les Étiquettes'},cards:[
{type:'intro',
 en(){return `<div class="intro-card">${eyebrow('Phase 8',`MMM Pro`)}<div class="intro-emblem">📡</div>${h1(`The MMM Pro Indicator`)}${lead(`MMM Pro is the main MMM order flow indicator. It reads every candle, tracks trend, pullback and resumption for you, and draws the levels, blocks and entries on your TradingView chart.`)}</div>`;},
 fr(){return `<div class="intro-card">${eyebrow('Phase 8',`MMM Pro`)}<div class="intro-emblem">📡</div>${h1(`L'Indicateur MMM Pro`)}${lead(`MMM Pro est l'indicateur principal du flux d'ordres MMM. Il lit chaque bougie, suit la tendance, le pullback et la reprise pour vous, et dessine les niveaux, les blocs et les entrées sur votre graphique TradingView.`)}</div>`;}},
{type:'concept',
 en(){return `<div class="card-inner">${eyebrow('Phase 8',`How MMM Pro Sees a Candle`)}${h1(`BuX, BeX and NBC`)}${lead(`MMM Pro sorts every closed candle into one of three groups. Everything else it draws is built from these.`)}
${tbl([`Candle`,`Rule on the Indicator`,`Meaning`],[
 [tag('badge-bu','BuX'),`Closes ABOVE the prior high, or opens above it (a gap up).`,`Bullish body close: buyers ate the offers above.`],
 [tag('badge-be','BeX'),`Closes BELOW the prior low, or opens below it (a gap down).`,`Bearish body close: sellers ate the bids below.`],
 [tag('badge-neu','NBC'),`Neither: no body close beyond the prior high or low.`,`Balance. Painted one flat color (white by default).`]])}
${ib('gold','⭐',`<strong>Every level sits at a candle's OPEN.</strong> When MMM Pro draws a T1, P1, MC or GMC line, the price is the open of the BuX or BeX candle that created it.`)}
${ib('blue','🔗',`<strong>Same alphabet:</strong> BuX and BeX are the family names for the Phase 1 body-close candles (BuBC+ = BuX+, BeBC+ = BeX+). MMM Pro uses the short names on its labels.`)}
${ib('red','🚫',`<strong>Confirmed candles only.</strong> MMM Pro decides on the candle CLOSE. A level is never confirmed by a candle that is still forming.`)}</div>`;},
 fr(){return `<div class="card-inner">${eyebrow('Phase 8',`Comment MMM Pro Voit une Bougie`)}${h1(`BuX, BeX et NBC`)}${lead(`MMM Pro range chaque bougie clôturée dans un de trois groupes. Tout ce qu'il dessine est construit à partir de ça.`)}
${tbl([`Bougie`,`Règle de l'Indicateur`,`Signification`],[
 [tag('badge-bu','BuX'),`Clôture AU-DESSUS du haut précédent, ou ouvre au-dessus (gap haussier).`,`Clôture haussière : les acheteurs ont mangé les offres au-dessus.`],
 [tag('badge-be','BeX'),`Clôture EN DESSOUS du bas précédent, ou ouvre en dessous (gap baissier).`,`Clôture baissière : les vendeurs ont mangé les bids en dessous.`],
 [tag('badge-neu','NBC'),`Ni l'un ni l'autre : aucune clôture au-delà du haut ou du bas précédent.`,`Équilibre. Peinte d'une seule couleur (blanc par défaut).`]])}
${ib('gold','⭐',`<strong>Chaque niveau est à l'OUVERTURE d'une bougie.</strong> Quand MMM Pro trace une ligne T1, P1, MC ou GMC, le prix est l'ouverture de la bougie BuX ou BeX qui l'a créée.`)}
${ib('blue','🔗',`<strong>Même alphabet :</strong> BuX et BeX sont les noms de famille des bougies à clôture de corps de la Phase 1 (BuBC+ = BuX+, BeBC+ = BeX+). MMM Pro utilise les noms courts sur ses étiquettes.`)}
${ib('red','🚫',`<strong>Bougies confirmées uniquement.</strong> MMM Pro décide à la CLÔTURE de la bougie. Un niveau n'est jamais confirmé par une bougie encore en formation.`)}</div>`;}},
{type:'concept',
 en(){return `<div class="card-inner">${eyebrow('Phase 8',`The Label Dictionary`)}${h1(`What Every Label Means`)}${lead(`Step through a real sequence, then use the table as your reference.`)}
${WG('chart','data-charts="tpr-cont,tpr-rev"')}
${tbl([`Label`,`Full Name`,`When It Prints`],[
 [`<strong style="color:var(--gold)">T1 · BuPO4 / BePO4</strong>`,`PO4 Origin, Trend 1`,`A new trend starts, born of a CDL / CDS reversal. Thickest line.`],
 [`<strong style="color:var(--gold)">T2, T3…</strong>`,`PO4 Origin, continuation`,`Born of an LD / SD continuation. Steps forward with the trend.`],
 [`MC`,`Momentum Control (Urgency)`,`A raw body close in the trend direction, before any pullback.`],
 [`GMC`,`Gap Momentum Control (Extreme Urgency)`,`The next candle confirms the MC with a gap. MC upgrades to GMC.`],
 [`MP1 / GMP1`,`Pullback (raw / gap-confirmed)`,`The first counter-trend body close of the range. Numbered. Later ones print in small letters (mp / gmp).`],
 [`MCR1 / GMCR1`,`Resumption (raw / gap-confirmed)`,`The first body close back in the trend direction after the pullback.`],
 [`<span style="color:var(--gr)">LD1</span> / <span style="color:var(--rd)">SD1</span>`,`Long / Short Delivery`,`Price closes through the numbered pullback: continuation and the next T-tier. LD1+ / SD1+ = that pullback was gap-confirmed (a strong break).`],
 [`<span style="color:var(--gr)">CDL</span> / <span style="color:var(--rd)">CDS</span>`,`Change of Delivery Long / Short`,`Price closes through a gap-confirmed level (GMC, GMP, GMCR). CAPITALS = major shift. small letters (cdl / cds) = internal shift inside the range.`]])}
${ib('cyan','📊',`<strong>Urgency naming option:</strong> In settings you can switch the names to UC / XUC / UP / XUP. U = Urgency (raw body close), XU = Extreme Urgency (gap-confirmed). So MC = UC, GMC = XUC, MP = UP, GMP = XUP, MCR = UCR, GMCR = XUCR.`)}
${ib('red','🚫',`<strong>A level dies on a CLOSE through it, not a wick.</strong> MC, MP and MCR lines are deleted the moment a candle closes through them. A close through a gap-confirmed level prints a CDL or CDS. A close through a PO4 line always deletes it.`)}</div>`;},
 fr(){return `<div class="card-inner">${eyebrow('Phase 8',`Le Dictionnaire des Étiquettes`)}${h1(`Ce Que Veut Dire Chaque Étiquette`)}${lead(`Avancez dans une vraie séquence, puis gardez le tableau comme référence.`)}
${WG('chart','data-charts="tpr-cont,tpr-rev"')}
${tbl([`Étiquette`,`Nom Complet`,`Quand Elle Apparaît`],[
 [`<strong style="color:var(--gold)">T1 · BuPO4 / BePO4</strong>`,`Origine PO4, Tendance 1`,`Une nouvelle tendance commence, née d'un renversement CDL / CDS. Ligne la plus épaisse.`],
 [`<strong style="color:var(--gold)">T2, T3…</strong>`,`Origine PO4, continuation`,`Née d'une continuation LD / SD. Avance avec la tendance.`],
 [`MC`,`Momentum Control (Urgence)`,`Une clôture brute dans le sens de la tendance, avant tout pullback.`],
 [`GMC`,`Gap Momentum Control (Urgence Extrême)`,`La bougie suivante confirme le MC avec un gap. Le MC devient GMC.`],
 [`MP1 / GMP1`,`Pullback (brut / confirmé par gap)`,`La première clôture contre la tendance dans le range. Numérotée. Les suivantes s'écrivent en minuscules (mp / gmp).`],
 [`MCR1 / GMCR1`,`Reprise (brute / confirmée par gap)`,`La première clôture dans le sens de la tendance après le pullback.`],
 [`<span style="color:var(--gr)">LD1</span> / <span style="color:var(--rd)">SD1</span>`,`Long / Short Delivery`,`Le prix clôture à travers le pullback numéroté : continuation et palier T suivant. LD1+ / SD1+ = ce pullback était confirmé par un gap (cassure forte).`],
 [`<span style="color:var(--gr)">CDL</span> / <span style="color:var(--rd)">CDS</span>`,`Change of Delivery Long / Short`,`Le prix clôture à travers un niveau confirmé par gap (GMC, GMP, GMCR). MAJUSCULES = changement majeur. minuscules (cdl / cds) = changement interne au range.`]])}
${ib('cyan','📊',`<strong>Option de noms « Urgence » :</strong> dans les réglages, vous pouvez passer aux noms UC / XUC / UP / XUP. U = Urgence (clôture brute), XU = Urgence Extrême (confirmée par gap). Donc MC = UC, GMC = XUC, MP = UP, GMP = XUP, MCR = UCR, GMCR = XUCR.`)}
${ib('red','🚫',`<strong>Un niveau meurt sur une CLÔTURE à travers lui, pas une mèche.</strong> Les lignes MC, MP et MCR sont supprimées dès qu'une bougie clôture à travers elles. Une clôture à travers un niveau confirmé par gap affiche un CDL ou un CDS. Une clôture à travers une ligne PO4 la supprime toujours.`)}</div>`;}},
{type:'quiz',id:'q-mmp-1',
 en:{q:'On MMM Pro, what makes a candle a BuX?',opts:['A — It is green','B — Its volume is above average','C — It closes above the prior high, or opens above it','D — It has no wicks'],correct:2,fb:'BuX = close above the prior high OR open above it (a gap up). Color alone means nothing: a green candle that stays inside the prior range is an NBC.'},
 fr:{q:"Sur MMM Pro, qu'est-ce qui fait d'une bougie une BuX ?",opts:["A — Elle est verte","B — Son volume est au-dessus de la moyenne","C — Elle clôture au-dessus du haut précédent, ou ouvre au-dessus","D — Elle n'a pas de mèches"],correct:2,fb:"BuX = clôture au-dessus du haut précédent OU ouverture au-dessus (gap haussier). La couleur seule ne veut rien dire : une bougie verte qui reste dans la plage précédente est une NBC."}},
{type:'quiz',id:'q-mmp-2',
 en:{q:'An MC line just changed to GMC. What happened?',opts:['A — The next candle confirmed it with a gap: Urgency upgraded to Extreme Urgency','B — Price closed through it','C — A new day started','D — The trend reversed'],correct:0,fb:'MC upgrades to GMC when the following candle leaves a gap (a UDG void between candle 1 and candle 3). It is the same level, upgraded. MC and GMC never stack side by side.'},
 fr:{q:"Une ligne MC vient de devenir GMC. Que s'est-il passé ?",opts:["A — La bougie suivante l'a confirmée avec un gap : l'Urgence est devenue Urgence Extrême","B — Le prix a clôturé à travers elle","C — Un nouveau jour a commencé","D — La tendance s'est renversée"],correct:0,fb:"Le MC devient GMC quand la bougie suivante laisse un gap (un vide UDG entre la bougie 1 et la bougie 3). C'est le même niveau, amélioré. MC et GMC ne s'empilent jamais côte à côte."}},
{type:'quiz',id:'q-mmp-3',
 en:{q:'You see "LD2+" on the chart. What does it mean?',opts:['A — A bearish reversal','B — The second long entry','C — An internal shift in small letters','D — Long Delivery: price closed through the numbered pullback of range 2, a continuation that creates T3. "+" means that pullback was gap-confirmed'],correct:3,fb:'LD = Long Delivery, the continuation event. The number is the range it closed (range 2, between T2 and P2), so the next origin is T3. The "+" says the broken pullback was a GMP: a strong break.'},
 fr:{q:"Vous voyez « LD2+ » sur le graphique. Que veut-il dire ?",opts:["A — Un renversement baissier","B — La deuxième entrée longue","C — Un changement interne en minuscules","D — Long Delivery : le prix a clôturé à travers le pullback numéroté du range 2, une continuation qui crée T3. « + » signifie que ce pullback était confirmé par un gap"],correct:3,fb:"LD = Long Delivery, l'événement de continuation. Le chiffre est le range clôturé (range 2, entre T2 et P2), donc la prochaine origine est T3. Le « + » dit que le pullback cassé était un GMP : une cassure forte."}},
{type:'quiz',id:'q-mmp-4',
 en:{q:'What is the difference between "CDS" and "cds" on MMM Pro?',opts:['A — None','B — CDS in capitals is a major shift; cds in small letters is an internal shift inside the range','C — cds only appears on lower timeframes','D — CDS is bullish'],correct:1,fb:'Both mean price closed below a gap-confirmed level. CAPITALS mark the shift that matters (for example the first break of the last GMC by the pullback). Small letters are internal shifts that can be cleared when the range closes.'},
 fr:{q:"Quelle est la différence entre « CDS » et « cds » sur MMM Pro ?",opts:["A — Aucune","B — CDS en majuscules est un changement majeur ; cds en minuscules est un changement interne au range","C — cds n'apparaît que sur les petites unités de temps","D — CDS est haussier"],correct:1,fb:"Les deux veulent dire que le prix a clôturé sous un niveau confirmé par gap. Les MAJUSCULES marquent le changement qui compte (par exemple la première cassure du dernier GMC par le pullback). Les minuscules sont des changements internes qui peuvent être effacés quand le range se ferme."}},
{type:'hw',hwKey:'hw-MMP-1',items:[
 {id:'hw-MMP-1-1',chart:true,en:'Load MMM Pro on a 5M NQ or ES chart. Find a T1 and label every level that followed it: GMC, P1 (MP1 or GMP1), R1 (MCR1) and the LD / SD that created T2. Upload your screenshot:',fr:"Chargez MMM Pro sur un graphique NQ ou ES en 5M. Trouvez un T1 et nommez chaque niveau qui a suivi : GMC, P1 (MP1 ou GMP1), R1 (MCR1) et le LD / SD qui a créé T2. Chargez votre capture :"},
 {id:'hw-MMP-1-2',chart:false,en:'In your own words: which CDL or CDS caused your T1, and which candle was the Resumption Candle that became T2?',fr:"Avec vos mots : quel CDL ou CDS a causé votre T1, et quelle bougie était la Bougie de Reprise devenue T2 ?"}
]}
]};

const LESSON_MMP2={id:'MMP-2',title:{en:'Blocks, Voids & Candle Colors',fr:'Blocs, Vides & Couleurs'},cards:[
{type:'concept',
 en(){return `<div class="card-inner">${eyebrow('Phase 8',`Zones on the Chart`)}${h1(`eBlocks and iBlocks`)}${lead(`Blocks are zones drawn on the candle that created a level. The higher the tier, the stronger the zone.`)}
${tbl([`Block`,`Drawn On`,`Strength`],[
 [`<strong style="color:var(--gold)">eBlock</strong>`,`T1 origins only: where a reversal (CDL / CDS) started a new trend.`,`Highest tier`],
 [`iBlock`,`T2, T3, T4… origins: born of an LD / SD continuation.`,`Official resumption`],
 [`XU iBlock`,`GMC / GMCR: a body close confirmed by a gap.`,`Extreme Urgency`],
 [`U iBlock`,`MC / MCR: a raw body close, not yet gap-confirmed.`,`Urgency, the lowest tier (off by default)`]])}
${p(`A bullish block covers the <strong>lower part</strong> of its candle; a bearish block covers the <strong>upper part</strong>. "Zone Selection" sets how deep: 50% (default), Standard, Balanced or Extreme. Turn on "Volume Strength" to label each block with its candle's volume compared with the 20-bar average: Strong (150% or more 🔥), Normal (80% or more) or Weak.`)}
${h2(`Structural Voids`)}
${tbl([`Void`,`Full Name`,`How It Forms`],[
 [`UDG`,`Unfair Delivery Gap`,`Delivery skipped entirely between candle 1 and candle 3. Strongest tier. This gap is also what confirms MC → GMC.`],
 [`UOG`,`Unfair Opening Gap`,`A clean open above the prior high (bull) or below the prior low (bear).`],
 [`ULG`,`Unfair Liquidity Gap`,`Bodies don't overlap but wicks do. The subtlest tier.`]])}
${ib('blue','🔗',`<strong>Naming note:</strong> On MMM Pro, UDG stands for Unfair <em>Delivery</em> Gap. Use the definitions on this card when you read the indicator.`)}</div>`;},
 fr(){return `<div class="card-inner">${eyebrow('Phase 8',`Les Zones du Graphique`)}${h1(`eBlocks et iBlocks`)}${lead(`Les blocs sont des zones dessinées sur la bougie qui a créé un niveau. Plus le palier est haut, plus la zone est forte.`)}
${tbl([`Bloc`,`Dessiné Sur`,`Force`],[
 [`<strong style="color:var(--gold)">eBlock</strong>`,`Les origines T1 uniquement : là où un renversement (CDL / CDS) a lancé une nouvelle tendance.`,`Palier le plus haut`],
 [`iBlock`,`Les origines T2, T3, T4… : nées d'une continuation LD / SD.`,`Reprise officielle`],
 [`XU iBlock`,`GMC / GMCR : une clôture confirmée par un gap.`,`Urgence Extrême`],
 [`U iBlock`,`MC / MCR : une clôture brute, pas encore confirmée par gap.`,`Urgence, le palier le plus bas (désactivé par défaut)`]])}
${p(`Un bloc haussier couvre la <strong>partie basse</strong> de sa bougie ; un bloc baissier couvre la <strong>partie haute</strong>. « Zone Selection » règle la profondeur : 50 % (défaut), Standard, Balanced ou Extreme. Activez « Volume Strength » pour afficher sur chaque bloc le volume de sa bougie comparé à la moyenne de 20 bougies : Strong (150 % ou plus 🔥), Normal (80 % ou plus) ou Weak.`)}
${h2(`Vides Structurels`)}
${tbl([`Vide`,`Nom Complet`,`Comment Il Se Forme`],[
 [`UDG`,`Unfair Delivery Gap`,`La livraison a sauté complètement entre la bougie 1 et la bougie 3. Palier le plus fort. C'est aussi ce gap qui confirme MC → GMC.`],
 [`UOG`,`Unfair Opening Gap`,`Une ouverture nette au-dessus du haut précédent (haussier) ou sous le bas précédent (baissier).`],
 [`ULG`,`Unfair Liquidity Gap`,`Les corps ne se chevauchent pas mais les mèches oui. Le palier le plus subtil.`]])}
${ib('blue','🔗',`<strong>Note sur les noms :</strong> sur MMM Pro, UDG veut dire Unfair <em>Delivery</em> Gap. Utilisez les définitions de cette carte quand vous lisez l'indicateur.`)}</div>`;}},
{type:'concept',
 en(){return `<div class="card-inner">${eyebrow('Phase 8',`Candle Colors`)}${h1(`Candle Conviction Coloring`)}${lead(`MMM Pro colors each candle by WHERE it closes compared with the candle before it. The further the close travels, the stronger the color.`)}
${WG('chart','data-charts="conviction"')}
${tbl([`Close Zone (vs. prior candle)`,`Stance`,`Color (MMM theme)`],[
 [`1 · Above the prior HIGH`,`Strongest bull`,`Full cyan`],
 [`2 · Above the prior body, up to its high`,`Strong bull`,`Lighter cyan`],
 [`3 · Inside the prior body`,`Balanced`,`Pale cyan (grey if the candle is red)`],
 [`4 · Below the prior body, down to its low`,`Strong bear`,`Lighter purple`],
 [`5 · Below the prior LOW`,`Strongest bear`,`Full purple`]])}
${ib('red','⚠️',`<strong>Gap Absorbed:</strong> a bullish close (zone 1–2) with a red body, or a bearish close (zone 4–5) with a green body, is painted red / lime. The candle opened far beyond and was pushed back: the gap was absorbed.`)}
${ib('gold','⭐',`<strong>NBC coloring wins.</strong> With NBC coloring on (the default), every candle with no body close beyond the prior high or low is painted one flat color, so the candles that carry structure stand out. That means most zone 2–4 candles show as NBC. Turn NBC coloring off to see every tier.`)}
${ib('cyan','🔥',`<strong>Volume Intensity (Premium plan):</strong> turn it on to recolor High and Ultra-High relative-volume candles using TradingView footprint data. It overrides conviction colors; NBC coloring still has the final word.`)}</div>`;},
 fr(){return `<div class="card-inner">${eyebrow('Phase 8',`Couleurs des Bougies`)}${h1(`Coloration de Conviction`)}${lead(`MMM Pro colore chaque bougie selon l'ENDROIT où elle clôture par rapport à la bougie précédente. Plus la clôture va loin, plus la couleur est forte.`)}
${WG('chart','data-charts="conviction"')}
${tbl([`Zone de Clôture (vs. bougie précédente)`,`Position`,`Couleur (thème MMM)`],[
 [`1 · Au-dessus du HAUT précédent`,`Haussier le plus fort`,`Cyan plein`],
 [`2 · Au-dessus du corps précédent, jusqu'à son haut`,`Haussier fort`,`Cyan plus clair`],
 [`3 · Dans le corps précédent`,`Équilibré`,`Cyan pâle (gris si la bougie est rouge)`],
 [`4 · Sous le corps précédent, jusqu'à son bas`,`Baissier fort`,`Violet plus clair`],
 [`5 · Sous le BAS précédent`,`Baissier le plus fort`,`Violet plein`]])}
${ib('red','⚠️',`<strong>Gap Absorbé :</strong> une clôture haussière (zone 1–2) avec un corps rouge, ou une clôture baissière (zone 4–5) avec un corps vert, est peinte en rouge / vert vif. La bougie a ouvert loin et a été repoussée : le gap a été absorbé.`)}
${ib('gold','⭐',`<strong>La couleur NBC gagne.</strong> Avec la coloration NBC activée (par défaut), chaque bougie sans clôture au-delà du haut ou du bas précédent est peinte d'une seule couleur, pour faire ressortir les bougies qui portent la structure. La plupart des bougies des zones 2–4 apparaissent donc en NBC. Désactivez la coloration NBC pour voir chaque palier.`)}
${ib('cyan','🔥',`<strong>Intensité du Volume (abonnement Premium) :</strong> activez-la pour recolorer les bougies à volume relatif High et Ultra-High avec les données footprint de TradingView. Elle remplace les couleurs de conviction ; la coloration NBC a toujours le dernier mot.`)}</div>`;}},
{type:'quiz',id:'q-mmp-5',
 en:{q:'Which block is drawn ONLY on T1 origins, where a reversal started a new trend?',opts:['A — U iBlock','B — XU iBlock','C — iBlock','D — eBlock'],correct:3,fb:'The eBlock is the highest tier and is drawn only on T1 origins born of a CDL / CDS reversal. T2, T3… origins draw iBlocks.'},
 fr:{q:"Quel bloc est dessiné UNIQUEMENT sur les origines T1, là où un renversement a lancé une nouvelle tendance ?",opts:["A — U iBlock","B — XU iBlock","C — iBlock","D — eBlock"],correct:3,fb:"L'eBlock est le palier le plus haut et n'est dessiné que sur les origines T1 nées d'un renversement CDL / CDS. Les origines T2, T3… dessinent des iBlocks."}},
{type:'quiz',id:'q-mmp-6',
 en:{q:"A candle closes above the prior candle's HIGH. Which conviction zone is it?",opts:['A — Zone 1, strongest bull','B — Zone 3, balanced','C — Zone 2, strong bull','D — Zone 4, strong bear'],correct:0,fb:'A close above the prior high is zone 1: the strongest bullish conviction. It is also a BuX, so NBC coloring never hides it.'},

{type:'concept',
 en(){return `<div class="card-inner">${eyebrow('Phase 6',`The Balanced Zone Philosophy`)}${h1(`Calm Before Urgency`)}${lead(`A balanced zone is a cluster of NBC candles: no candle closes beyond the prior high or low. Price is fair, so nobody needs to chase it.`)}

{type:'concept',

const LESSON_BZB={id:'BZB-1',title:{en:'Balanced Zone Break Indicator',fr:'Indicateur Balanced Zone Break'},cards:[
{type:'concept',

 fr(){return `<div class="card-inner">${eyebrow('Phase 8',`Balanced Zone Break @MaxMaserati`)}${h1(`Chaque Zone, Chaque Cassure`)}${lead(`Cet indicateur trouve chaque zone équilibrée pour vous, l'encadre, et écrit le nom de la cassure quand le prix en sort avec une clôture.`)}

 [`Boîte`,`La zone équilibrée. Construite avec les corps par défaut (« Box Uses Body »). Une ligne pointillée marque son milieu.`],
 [`<strong style="color:var(--gr)">CDLx</strong> / <strong style="color:var(--rd)">CDSx</strong>`,`Renversement hors de la zone. Activé par défaut.`],

 [`PEL / PES`,`Le prix dans la zone où le plus de volume s'est échangé (son POC). PEL pour les cassures haussières, PES pour les baissières.`],

${ib('gold','⭐',`<strong>Le nom de la cassure est écrit sur la boîte.</strong> « Write Break Name On Box » est activé par défaut, donc chaque boîte CDLx, CDSx, LDx et SDx affiche son nom et son ✓ ou ⚠.`)}</div>`;}},
{type:'concept',
 en(){return `<div class="card-inner">${eyebrow('Phase 8',`Reading the Structure`)}${h1(`Edges, Stops and Filters`)}

${ib('green','③',`<strong>Delivery:</strong> body closes in the real direction leave the zone: the CDLx / CDSx break of Phase 6. Traders who chased the sweep are now trapped on the wrong side.`)}

const OLD_ORDER=[];COURSE.forEach(ph=>ph.lessons.forEach(ls=>ls.cards.forEach((c,i)=>OLD_ORDER.push(ls.id+'#'+i))));
(function assemble(){
  const byPhase=n=>COURSE.find(p=>p.phase===n);
  COURSE.forEach((ph,i)=>{const o=OUTLINE&&OUTLINE.phases[i];ph.outline=o?{desc:o.desc,lessons:o.lessons.slice()}:null;});
  [2,3,6].forEach(n=>{const ph=byPhase(n),f=OUTLINE_FIX[n];if(ph&&f)ph.outline={desc:f.desc,lessons:f.lessons.slice()};});
  const l21=(byPhase(2)||{lessons:[]}).lessons.find(l=>l.id==='L2-1');
  if(l21){l21.title={en:'Opens, PDH/PDL & the Delivery Cycle',fr:'Ouvertures, PDH/PDL & Cycle de Livraison'};l21.cards[1]=P2_OPENS_CARD;l21.cards[2]=P2_CYCLE_CARD;const qi=l21.cards.findIndex(c=>c.id==='q-L2-2');if(qi>=0)l21.cards[qi]=P2_QUIZ;const hw=l21.cards.find(c=>c.type==='hw');if(hw){const ii=hw.items.findIndex(x=>x.id==='hw-L2-2');if(ii>=0)hw.items[ii]=P2_HW_ITEM;}}
  const p3=byPhase(3), l31=p3?p3.lessons.findIndex(l=>l.id==='L3-1'):-1; if(l31>=0) p3.lessons[l31]=LESSON_SESSIONS;
  COURSE.forEach(ph=>ph.lessons.forEach(ls=>ls.cards.forEach(c=>{if(c.type==='identity')c.items.forEach(it=>{
    if(it.id==='id-macro')it.ph={en:'HTF Opens + PDH/PDL + overnight range',fr:'Ouvertures HTF + PDH/PDL + plage de nuit'};
    if(it.id==='id-session')it.ph={en:'Window A: NY Open (09:45–11:00 ET)',fr:'Fenêtre A : Ouverture NY (09h45–11h00 ET)'};});})));
  const add=(n,lesson,first)=>{const ph=byPhase(n);if(!ph)return;if(first)ph.lessons.unshift(lesson);else ph.lessons.push(lesson);const line=NEW_OUTLINE[lesson.id];if(ph.outline&&line){if(first)ph.outline.lessons.unshift(line);else ph.outline.lessons.push(line);}};
  add(0,LESSON_F2); add(3,LESSON_CLOCK); add(3,LESSON_WINDOWS); add(5,LESSON_TPR); add(6,LESSON_BZ,true); add(9,LESSON_RISK,true);
  const p8=byPhase(8), p9=byPhase(9);
  p9.phase=10; p8.phase=9;
  p8.lessons.forEach(ls=>ls.cards.forEach(c=>['en','fr'].forEach(lg=>{const f=c[lg];if(typeof f==='function')c[lg]=function(){return f.call(this).replace(/Phase 8/g,'Phase 9');};})));
  PHASE_MMP.lessons.push(LESSON_BZB,LESSON_SLM);
  PHASE_MMP.title={en:'The MMM Indicators',fr:'Les Indicateurs MMM'};
  PHASE_MMP.outline=OUTLINE_FIX[8];
  COURSE.forEach(ph=>{if(ph.outline){ph.outline.desc=ph.outline.desc.replace(/Midnight Open/g,'Daily Open (6:00 PM ET)');ph.outline.lessons=ph.outline.lessons.map(x=>x.replace(/Midnight Open/g,'Daily Open (6:00 PM ET)'));}});
  COURSE.splice(COURSE.indexOf(p8),0,PHASE_MMP);
})();

function effectiveTheme(){
  const a=document.documentElement.getAttribute('data-theme');
  if(a) return a;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
}
function updateThemeLabel(){$('theme-btn').setAttribute('aria-label',effectiveTheme()==='dark'?t('theme_to_light'):t('theme_to_dark'));}

  const next=effectiveTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next); store.set('mmm_course_theme',next); updateThemeLabel();
  if($('cert-dialog').open) drawCert();
}

function heroChart(){
  const W=560,H=330,pl=18,pr=108,pt=20,pb=22;
  const C=[[122,123,115,116],[116,117,108,109],[109,112,106.5,111],[111,114.8,108,108.6],[108.6,111,106,110.4],[110.4,115.2,109,110],[110,112.5,107,107.8],[107.8,110.5,106.2,109.6],[109.6,114.9,108.4,108.2],[108.2,128,106.6,127.2],[127.2,132,125.6,131],[131,134,128.8,129.6]];
  const lo=101,hi=137,y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const step=(W-pl-pr)/C.length,bw=step*.54,x=i=>pl+step*i+step/2;
  let s='';
  s+=`<title>${esc(t('chart_alt'))}</title>`;
  for(let v=105;v<=135;v+=5) s+=`<line class="hc-gridline" x1="${pl}" x2="${W-8}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`;
  const bx1=x(2)-step/2+2,bx2=x(8)+step/2-2,bt=y(115.7),bb=y(113.3);
  s+=`<rect class="hc-band" x="${bx1.toFixed(1)}" y="${bt.toFixed(1)}" width="${(bx2-bx1).toFixed(1)}" height="${(bb-bt).toFixed(1)}"/>`;
  s+=`<line class="hc-bandtop" x1="${bx1.toFixed(1)}" x2="${bx2.toFixed(1)}" y1="${bt.toFixed(1)}" y2="${bt.toFixed(1)}"/>`;
  s+=`<text class="hc-lbl hc-lbl-wall" x="${bx1.toFixed(1)}" y="${(bt-9).toFixed(1)}">${esc(t('ch_wall'))}</text>`;
  s+=`<text class="hc-lbl hc-lbl-dim" x="${((bx1+bx2)/2).toFixed(1)}" y="${(y(104.2)).toFixed(1)}" text-anchor="middle">${esc(t('ch_box'))}</text>`;
  C.forEach((c,i)=>{
    const [o,h,l,cl]=c,up=cl>=o,cls=i===9?'hc-ham':(up?'hc-up':'hc-down');
    const top=y(Math.max(o,cl)),ht=Math.max(1.6,Math.abs(y(o)-y(cl)));
    const g=`<line class="hc-wick" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(h).toFixed(1)}" y2="${y(l).toFixed(1)}"/><rect x="${(x(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${ht.toFixed(1)}" rx="1.5"/>`;

function buildCard(card){

function enhance(root){

function buildIntro(card,html){

/* ---------- Quiz ---------- */
function quizId(card){return card.id||('q'+card.globalIdx);}
function buildQuiz(card){
  const qd=card[lang]||card.en, qid=quizId(card), res=quizResults[qid];
  const inPhase=allCards.filter(c=>c.phaseNum===card.phaseNum&&c.type==='quiz');
  const num=inPhase.findIndex(c=>c.globalIdx===card.globalIdx)+1;
  const answered=res!==undefined, picked=answered?quizResults[qid+'_pick']:null, reveal=res===true||quizResults[qid+'_show']===true;
  const opts=qd.opts.map((o,i)=>{
    let cls='q-opt';
    if(answered){
      if(reveal&&i===qd.correct) cls+=' is-right';
      else if(i===picked) cls+=' is-wrong';
      else if(reveal) cls+=' is-dim';
    }
    return `<button class="${cls}" type="button" data-act="answer" data-q="${qid}" data-i="${i}"${answered?' disabled':''}><span class="q-key">${'ABCD'[i]}</span><span>${o.replace(/^[A-D]\s*[—–-]\s*/,'')}</span></button>`;
  }).join('');
  let fb=`<p class="q-hint">${esc(t('key_hint'))}</p>`;
  if(res===true) fb=`<div class="q-fb ok"><p><strong>${esc(t('correct'))}</strong> ${qd.fb||''}</p></div>`;
  else if(res===false&&reveal) fb=`<div class="q-fb no"><p><strong>${esc(t('wrong'))}</strong> ${qd.fb||''}</p><div><button class="btn" type="button" data-act="retry" data-q="${qid}">${esc(t('retry'))}</button></div></div>`;
  else if(res===false) fb=`<div class="q-fb no"><p><strong>${esc(t('wrong'))}</strong> ${esc(t('wrong_hint'))}</p><div class="hw-foot"><button class="btn" type="button" data-act="retry" data-q="${qid}">${esc(t('retry'))}</button><button class="btn btn-quiet" type="button" data-act="show" data-q="${qid}">${esc(t('show_answer'))}</button></div></div>`;
  return `<section class="quiz" aria-label="${esc(t('knowledge'))}"><div class="q-label"><b>${esc(t('knowledge'))}</b><span>${esc(fmt(t('q_of'),{i:num,n:inPhase.length}))}</span></div><p class="q-text">${qd.q}</p><div class="q-opts" role="group">${opts}</div>${fb}</section>`;
}
function answerQuiz(qid,i){
  const card=allCards.find(c=>quizId(c)===qid); if(!card||quizResults[qid]!==undefined) return;
  const qd=card[lang]||card.en, ok=i===qd.correct;
  quizResults[qid]=ok; quizResults[qid+'_pick']=i;
  if(ok) completed.add(card.key);
  saveProgress(); rerenderCurrent();
  const fb=$('reader').querySelector('.q-fb'); if(fb&&fb.scrollIntoView) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function showAnswer(qid){quizResults[qid+'_show']=true;saveProgress();rerenderCurrent();}
function retryQuiz(qid){delete quizResults[qid];delete quizResults[qid+'_pick'];delete quizResults[qid+'_show'];saveProgress();rerenderCurrent();const b=$('reader').querySelector('.q-opt');if(b)b.focus();}
function rerenderCurrent(){
  const card=allCards[cardIndex]; const el=$('reader').querySelector('.card');
  el.innerHTML=buildCard(card); el.classList.remove('from-left'); el.style.animation='none'; enhance(el);
  renderRail(); renderSteps(card,allCards.filter(c=>c.lessonId===card.lessonId));

function isImgUrl(u){return /^data:image\//.test(u)||/^https?:\/\/\S+\.(png|jpe?g|gif|webp)(\?\S*)?$/i.test(u);}
function chartBlock(id){

function hwFilled(item){const im=hwImages[item.id]||{};return !!((hwAnswers[item.id]||'').trim()||im.src||im.url);}
function buildHW(card){

let hwTimer;
function flashSaved(id){const s=$('sv-'+id);if(!s)return;s.classList.add('show');clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('show'),1600);}
function refreshFilled(id){const box=$('hwbox-'+id);const card=allCards[cardIndex];if(!box||!card.items)return;const it=card.items.find(i=>i.id===id);if(it)box.classList.toggle('is-filled',hwFilled(it));}
function onHwInput(id,val){hwAnswers[id]=val;refreshFilled(id);clearTimeout(hwTimer);hwTimer=setTimeout(()=>{if(saveProgress())flashSaved(id);},600);}
function redrawChart(id){const el=$('chart-'+id);if(!el)return;const tmp=document.createElement('div');tmp.innerHTML=chartBlock(id);el.replaceWith(tmp.firstElementChild);refreshFilled(id);}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//.test(file.type)){reject(new Error('type'));return;}
    const r=new FileReader();
    r.onerror=()=>reject(new Error('read'));
    r.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('decode'));img.onload=()=>{
      const max=1400,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      const cx=cv.getContext('2d');cx.fillStyle='#ffffff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      resolve(cv.toDataURL('image/jpeg',.82));};img.src=r.result;};
    r.readAsDataURL(file);
  });
}
async function attachImage(id,file){
  try{
    const src=await compressImage(file); const prev=hwImages[id];
    hwImages[id]={src,url:(prev&&prev.url)||''};
    if(!saveProgress()){hwImages[id]=prev||{src:'',url:''};toast(t('storage_full'));return;}
    redrawChart(id); flashSaved(id); toast(t('img_added'));
  }catch(e){toast(t('img_bad'));}
}

function removeImage(id){const im=hwImages[id]||{};hwImages[id]={src:'',url:im.url&&!isImgUrl(im.url)?im.url:''};saveProgress();redrawChart(id);}

    case 'go': {const i=+el.dataset.idx;renderCard(i,i<cardIndex?'left':'right');break;}

/* ============================================================
   WIDGET ENGINE: time zones, volatility map, windows, charts, calculator
============================================================ */
const TZ_OPTS=[{id:'et',tz:'America/New_York'},{id:'lon',tz:'Europe/London'},{id:'par',tz:'Europe/Paris'},{id:'loc',tz:null}];
let tzChoice='et';
function tzOffset(tz,d){
  try{
    const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const pr={};f.formatToParts(d).forEach(x=>{pr[x.type]=x.value;});
    const asUTC=Date.UTC(+pr.year,+pr.month-1,+pr.day,(+pr.hour)%24,+pr.minute);
    const base=new Date(d.getTime());base.setUTCSeconds(0,0);
    return Math.round((asUTC-base.getTime())/60000);
  }catch(e){return null;}
}
function localTz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||null;}catch(e){return null;}}
function chosenTz(){return tzChoice==='loc'?localTz():(TZ_OPTS.find(o=>o.id===tzChoice)||TZ_OPTS[0]).tz;}
function zoneShift(){
  if(tzChoice==='et') return 0;
  const now=new Date(), et=tzOffset('America/New_York',now), tz=chosenTz(), o=tz?tzOffset(tz,now):null;
  return (et==null||o==null)?0:o-et;
}
const pad2=n=>String(n).padStart(2,'0');
function fmtTime(etMin){
  const m=(((etMin+zoneShift())%1440)+1440)%1440, h=Math.floor(m/60), mi=m%60;
  if(tzChoice==='et'&&lang==='en'){const h12=h%12===0?12:h%12;return `${h12}:${pad2(mi)} ${h<12?'AM':'PM'}`;}
  return lang==='fr'?`${pad2(h)}h${pad2(mi)}`:`${pad2(h)}:${pad2(mi)}`;
}
const fmtRange=(s,e)=>fmtTime(s)+' – '+fmtTime(e);
function nowEtMin(){const d=new Date(),o=tzOffset('America/New_York',d);if(o==null)return null;return (((d.getUTCHours()*60+d.getUTCMinutes()+o)%1440)+1440)%1440;}
const dayPos=m=>((((m-1080)%1440)+1440)%1440)/1440;
const durOf=(s,e)=>(((e-s)%1440)+1440)%1440;
function tzControl(){
  const lab={et:t('tz_et'),lon:t('tz_lon'),par:t('tz_par'),loc:t('tz_loc')};
  return `<div class="seg wseg" role="group" aria-label="${esc(t('tz_label'))}">${TZ_OPTS.map(o=>`<button type="button" data-act="tz" data-tz="${o.id}" aria-pressed="${o.id===tzChoice}">${esc(lab[o.id])}</button>`).join('')}</div>`;
}
function tzNote(){return tzChoice==='et'?t('tz_note_et'):fmt(t('tz_note'),{tz:chosenTz()||'?'});}
function dayTicks(){
  let h='';for(let k=0;k<=8;k++){h+=`<span${k%2?' class="odd"':''} style="left:${(k/8*100).toFixed(3)}%">${esc(fmtTime(1080+k*180))}</span>`;}
  return `<div class="clk-ticks" aria-hidden="true">${h}</div>`;
}
const ICON_PREV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>';
const ICON_NEXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

/* ---------- 24-hour volatility map ---------- */
function blockAt(m){
  const pm=dayPos(m);
  return CLOCK_BLOCKS.findIndex(b=>{const a=dayPos(b.s);return pm>=a&&pm<a+durOf(b.s,b.e)/1440-1e-9;});
}
function renderClock(el){
  const now=nowEtMin(), nowIdx=now==null?-1:blockAt(now);
  let sel=el.dataset.sel!==undefined?+el.dataset.sel:(nowIdx>=0?nowIdx:8);
  el.dataset.sel=sel;
  const bars=CLOCK_BLOCKS.map((b,i)=>{
    const d=b[lang]||b.en, hgt=b.lvl===0?3:Math.round(b.lvl/5*100);
    return `<button class="cb cat-${b.cat}${i===sel?' is-sel':''}" type="button" style="flex:${durOf(b.s,b.e)} 1 0" data-act="clk-sel" data-i="${i}" aria-pressed="${i===sel}" aria-label="${esc(fmtRange(b.s,b.e)+', '+d.n+', '+d.v)}"><i style="height:${hgt}%"></i></button>`;
  }).join('');
  const np=now==null?null:dayPos(now)*100;
  const nowMark=np==null?'':`<div class="clk-now${np>85?' flip':''}" style="left:${np.toFixed(2)}%"><span>${esc(t('now'))} ${esc(fmtTime(now))}</span></div>`;

  el.innerHTML=`<div class="wdg-top"><p class="wdg-title">${esc(t('clk_title'))}</p>${tzControl()}</div>
