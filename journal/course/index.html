    <div class="clk-detail" aria-live="polite">
      <div class="clk-dhead"><span class="clk-time">${esc(fmtRange(b.s,b.e))}</span><span class="clk-name">${esc(d.n)}</span><span class="cchip cat-${b.cat}">${esc(t('cat_'+b.cat))}</span>${sel===nowIdx?`<span class="cchip cat-quiet">${esc(t('now'))}</span>`:''}</div>
      <span class="clk-vol">${esc(d.v)}</span><p>${esc(d.d)}</p>
      <div class="wnav"><button class="icon-btn" type="button" data-act="clk-step" data-d="-1" aria-label="${esc(t('prev_block'))}">${ICON_PREV}</button><button class="icon-btn" type="button" data-act="clk-step" data-d="1" aria-label="${esc(t('next_block'))}">${ICON_NEXT}</button></div>
    </div>
    <ul class="clk-legend">${cats.map(c=>`<li class="cat-${c}"><i></i>${esc(t('cat_'+c))}</li>`).join('')}</ul>
    <p class="wnote">${esc(tzNote())}</p>`;
}

/* ---------- two-hour windows ---------- */
function renderWindows(el){
  const sel=WINDOWS.find(w=>w.id===el.dataset.sel)||WINDOWS[0]; el.dataset.sel=sel.id;
  const wd=sel[lang]||sel.en;
  const laneEnd=[], laneOf={};
  WINDOWS.slice().sort((x,y)=>dayPos(x.s)-dayPos(y.s)).forEach(w=>{const a0=dayPos(w.s),b0=a0+durOf(w.s,w.e)/1440;let ln=0;while(laneEnd[ln]!=null&&laneEnd[ln]>a0+1e-9)ln++;laneEnd[ln]=b0;laneOf[w.id]=ln;});
  const nL=Math.max(1,laneEnd.length);
  const spans=WINDOWS.map(w=>`<button class="win-span${w.id===sel.id?' is-sel':''}" type="button" data-act="win-sel" data-w="${w.id}" style="left:${(dayPos(w.s)*100).toFixed(2)}%;width:${(durOf(w.s,w.e)/1440*100).toFixed(2)}%;top:calc(${(laneOf[w.id]*100/nL).toFixed(2)}% + 3px);height:calc(${(100/nL).toFixed(2)}% - 6px);bottom:auto" aria-pressed="${w.id===sel.id}" aria-label="${esc(t('win_label')+' '+w.id+': '+(w[lang]||w.en).n+', '+fmtRange(w.s,w.e))}">${w.id}</button>`).join('');
  const tabs=`<div class="seg wseg" role="group" aria-label="${esc(t('win_label'))}">${WINDOWS.map(w=>`<button type="button" data-act="win-sel" data-w="${w.id}" aria-pressed="${w.id===sel.id}" title="${esc((w[lang]||w.en).n)}">${w.id}</button>`).join('')}</div>`;
  const span=durOf(sel.s,sel.e), pos=m=>(durOf(sel.s,m)/span*100);
  const seg=(st)=>{const wd=durOf(st.s,st.e)/span*100;return `<div class="g-seg k-${st.k}" style="left:${pos(st.s).toFixed(2)}%;width:${Math.max(.8,wd).toFixed(2)}%" title="${esc(t('step_'+st.k)+' '+fmtRange(st.s,st.e))}">${wd>=10?esc(t('step_'+st.k)):''}</div>`;};
  const main=sel.steps.filter(st=>['mark','wait','trade'].includes(st.k)&&st.s!=null);
  const chk=sel.steps.find(st=>st.k==='check');
  const stop=sel.steps.find(st=>st.k==='stop');
  const stopMarks=stop?[stop.s].concat(stop.e2!=null?[stop.e2]:[]).map(m=>`<div class="g-stop" style="left:${Math.min(100,pos(m)).toFixed(2)}%" title="${esc(t('step_stop')+' '+fmtTime(m))}"></div>`).join(''):'';
  const gantt=`<div class="gantt" aria-hidden="true"><div class="g-row">${main.map(seg).join('')}${stopMarks}</div><div class="g-row">${chk&&!chk.done?seg(chk):`<div class="g-done">${esc(t('step_check')+': '+t('check_done')+(chk?' ('+fmtRange(chk.ds,chk.de)+')':''))}</div>`}</div><div class="g-scale"><span>${esc(fmtTime(sel.s))}</span><span>${esc(fmtTime(sel.e))}</span></div></div>`;
  const when=st=>{
    if(st.k==='check'&&st.done) return `${t('check_done')} · ${fmtRange(st.ds,st.de)}`;
    if(st.k==='stop') return st.e2!=null?`${fmtTime(st.s)} ${t('stop_norisk')} · ${fmtTime(st.e2)} ${t('stop_flat')}`:fmtTime(st.s);
    if(st.s!=null) return fmtRange(st.s,st.e);
    return '';
  };
  const steps=sel.steps.map(st=>`<li class="wstep k-${st.k}"><div class="wstep-k">${esc(t('step_'+st.k))}${when(st)?`<small>${esc(when(st))}</small>`:''}</div><ul>${(st[lang]||st.en).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></li>`).join('');
  el.innerHTML=`<div class="wdg-top">${tabs}${tzControl()}</div>
    <div><div class="win-track" style="height:${nL*26+8}px">${spans}</div>${dayTicks()}</div>
    <div class="win-head"><h3>${esc(t('win_label')+' '+sel.id+': '+wd.n)}</h3><div class="win-meta"><b>${esc(fmtRange(sel.s,sel.e))}</b><span>${esc(wd.what)}</span></div><p>${esc(wd.intro)}</p></div>
    ${gantt}<ol class="wsteps">${steps}</ol><p class="wnote">${esc(tzNote())}</p>`;
}

/* ---------- mini candle charts ---------- */
function miniChartSVG(def,si){
  const W=560,H=300,pl=12,pr=166,pt=20,pb=20;
  const n=def.slots||def.candles.length, step=(W-pl-pr)/n, bw=Math.min(20,step*.55);
  const X=i=>pl+step*i+step/2, Y=v=>pt+(def.hi-v)/(def.hi-def.lo)*(H-pt-pb);
  const st=def.steps[si], last=Math.min(st.n,def.candles.length)-1, tx=a=>a[lang]||a.en, f1=v=>v.toFixed(1);
  let s=`<title>${esc(tx(def.title)+': '+tx(st.t))}</title>`;
  for(let k=1;k<5;k++){const y=pt+(H-pt-pb)*k/5;s+=`<line class="mc-grid" x1="${pl}" x2="${W-8}" y1="${f1(y)}" y2="${f1(y)}"/>`;}
  const right=[];
  st.ann.filter(a=>a.t==='band').forEach(a=>{
    const x1=X(a.from)-step/2+2, x2=a.to==null?W-pr+4:X(a.to)+step/2-2, y1=Y(a.y2), y2=Y(a.y1);
    s+=`<rect class="mc-band mc-${a.cls}" x="${f1(x1)}" y="${f1(y1)}" width="${f1(x2-x1)}" height="${f1(y2-y1)}" rx="3"/>`;
    if(a.label&&(a.lin||(y2-y1)>=44)) s+=`<text class="mc-lbl mc-t-${a.cls}" x="${f1(x1+6)}" y="${f1(y1+14)}">${esc(tx(a.label))}</text>`;
    else if(a.label) right.push({y:(y1+y2)/2,txt:tx(a.label),cls:a.cls});
    if(a.rlabel) right.push({y:(y1+y2)/2,txt:tx(a.rlabel),cls:a.cls});
  });
  def.candles.forEach((c,i)=>{
    if(!c||i>last) return;
    const pv=def.candles[i-1];
    const k=pv?((c[3]>pv[1]||c[0]>pv[1])?'bu':(c[3]<pv[2]||c[0]<pv[2])?'be':'nbc'):(def.first||(c[3]>=c[0]?'bu':'be'));
    const top=Y(Math.max(c[0],c[3])), ht=Math.max(1.6,Math.abs(Y(c[0])-Y(c[3])));
    s+=`<g class="mc-c mc-${k}"><line x1="${f1(X(i))}" x2="${f1(X(i))}" y1="${f1(Y(c[1]))}" y2="${f1(Y(c[2]))}"/><rect x="${f1(X(i)-bw/2)}" y="${f1(top)}" width="${f1(bw)}" height="${f1(ht)}" rx="1.5"/></g>`;
  });
  st.ann.filter(a=>a.t==='line').forEach(a=>{
    const x1=X(a.from)-bw/2-2, x2=a.to==null?W-pr+6:X(a.to)+bw/2, y=Y(a.y);
    s+=`<line class="mc-line mc-s-${a.cls}" x1="${f1(x1)}" x2="${f1(x2)}" y1="${f1(y)}" y2="${f1(y)}" stroke-width="${a.w||1.6}"${a.dash?' stroke-dasharray="5 4"':''}/>`;
    if(a.label&&a.to==null) right.push({y,txt:tx(a.label),cls:a.cls});
  });
  st.ann.filter(a=>a.t==='mark').forEach(a=>{
    const c=def.candles[a.i], y=a.pos==='above'?Y(c[1])-8:Y(c[2])+17;
    s+=`<text class="mc-mark mc-t-${a.cls}" x="${f1(X(a.i))}" y="${f1(y)}" text-anchor="middle">${esc(tx(a.label))}</text>`;
  });
  right.sort((a,b)=>a.y-b.y);
  for(let k=1;k<right.length;k++) if(right[k].y-right[k-1].y<15) right[k].y=right[k-1].y+15;
  const over=right.length?right[right.length-1].y-(H-8):0; if(over>0) right.forEach(r=>{r.y-=over;});
  right.forEach(r=>{s+=`<text class="mc-rl mc-t-${r.cls}" x="${W-pr+12}" y="${f1(r.y+4)}">${esc(r.txt)}</text>`;});
  return `<svg class="mc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tx(def.title)+': '+tx(st.t))}">${s}</svg>`;
}
function renderChartWidget(el){
  const ids=(el.dataset.charts||'').split(',').filter(k=>CHARTS[k]); if(!ids.length) return;
  const cur=CHARTS[el.dataset.cur]&&ids.includes(el.dataset.cur)?el.dataset.cur:ids[0];
  const def=CHARTS[cur], si=Math.max(0,Math.min(+(el.dataset.step||0),def.steps.length-1)), tx=a=>a[lang]||a.en;
  el.dataset.cur=cur; el.dataset.step=si;
  const tabs=ids.length>1?`<div class="seg wseg" role="group">${ids.map(k=>`<button type="button" data-act="ch-tab" data-c="${k}" aria-pressed="${k===cur}">${esc(tx(CHARTS[k].title))}</button>`).join('')}</div>`:`<p class="wdg-title">${esc(tx(def.title))}</p>`;
  const multi=def.steps.length>1;
  const steps=multi?`<ol class="mc-steps">${def.steps.map((st,i)=>`<li><button class="mc-step" type="button" data-act="ch-step" data-s="${i}"${i===si?' aria-current="step"':''}><b>${i+1}</b>${esc(tx(st.t))}</button></li>`).join('')}</ol>`:'';
  const nav=multi?`<div class="wnav"><button class="icon-btn" type="button" data-act="ch-move" data-d="-1" aria-label="${esc(t('ch_prev'))}"${si===0?' disabled':''}>${ICON_PREV}</button><button class="icon-btn" type="button" data-act="ch-move" data-d="1" aria-label="${esc(t('ch_next'))}"${si===def.steps.length-1?' disabled':''}>${ICON_NEXT}</button></div>`:'';
  el.innerHTML=`<div class="wdg-top">${tabs}</div>${miniChartSVG(def,si)}${steps}<div class="mc-foot"><p class="mc-note" aria-live="polite">${esc(tx(def.steps[si].note))}</p>${nav}</div>`;
}

/* ---------- risk-to-reward calculator ---------- */
const RR_PRESETS=[1,1.5,2,3,5];
function money(v){const d=(Math.abs(v)<100&&Math.round(v)!==v)?2:0;try{return v.toLocaleString(lang==='fr'?'fr-FR':'en-US',{style:'currency',currency:'USD',minimumFractionDigits:d,maximumFractionDigits:d});}catch(e){return '$'+v.toFixed(d);}}
function num(v,d){try{return v.toLocaleString(lang==='fr'?'fr-FR':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}catch(e){return v.toFixed(d);}}
function renderRR(el){
  const rr=+(el.dataset.rr||2), w=+(el.dataset.w||45), risk=+(el.dataset.risk||200);
  el.dataset.rr=rr; el.dataset.w=w; el.dataset.risk=risk;
  el.innerHTML=`<div class="rr-grid">
    <div class="rr-field"><span class="rr-lab" id="rr-lab">${esc(t('rr_ratio'))}</span><div class="rr-presets" role="group" aria-labelledby="rr-lab">${RR_PRESETS.map(v=>`<button class="btn" type="button" data-act="rr-preset" data-v="${v}" aria-pressed="${v===rr}" style="min-height:36px;padding:.35rem .7rem">1:${esc(num(v,v%1?1:0))}</button>`).join('')}<label class="sr" for="rr-custom">${esc(t('rr_custom'))}</label><input class="field" id="rr-custom" type="number" min="0.2" max="20" step="0.1" value="${rr}" data-rr="rr" aria-label="${esc(t('rr_custom'))}"></div></div>
    <div class="rr-field"><label for="rr-risk">${esc(t('rr_risk'))}</label><input class="field" id="rr-risk" type="number" min="1" step="1" value="${risk}" data-rr="risk"></div>
    <div class="rr-field" style="grid-column:1/-1"><label for="rr-w">${esc(t('rr_win'))}: <b id="rr-wv">${w}%</b></label><input id="rr-w" type="range" min="5" max="90" step="1" value="${w}" data-rr="w"></div>
  </div><div class="rr-out" id="rr-out" aria-live="polite"></div><p class="rr-verdict" id="rr-verdict"></p>`;
  updateRR(el);
}
function updateRR(el){
  const rr=Math.max(.2,+el.dataset.rr||2), w=+el.dataset.w, risk=Math.max(0,+el.dataset.risk||0), W_=w/100;
  const be=100/(1+rr), exp=W_*rr-(1-W_), sign=(v,d)=>(v>=0?'+':'−')+num(Math.abs(v),d);
  const pct=v=>num(v,2)+(lang==='fr'?' %':'%');
  const cells=[[t('rr_be'),pct(be),''],[t('rr_exp'),sign(exp,2)+' R',exp>=0?'pos':'neg'],[t('rr_100'),sign(exp*100,1)+' R · '+(exp>=0?'+':'−')+money(Math.abs(exp*100*risk)),exp>=0?'pos':'neg'],[t('rr_14'),'−'+money(14*risk),'neg']];
  el.querySelector('#rr-out').innerHTML=cells.map(([k,v,c])=>`<div class="rr-cell"><span>${esc(k)}</span><b class="${c}">${esc(v)}</b></div>`).join('');
  const v=el.querySelector('#rr-verdict'); const cls=w<=be?'no':(w-be<5?'thin':'ok');
  v.className='rr-verdict '+cls; v.textContent=t(cls==='no'?'rr_no':cls==='thin'?'rr_thin':'rr_ok');
  const wv=el.querySelector('#rr-wv'); if(wv) wv.textContent=w+'%';
  el.querySelectorAll('[data-act="rr-preset"]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===rr)));
}

/* ---------- mount + events ---------- */
function renderWidget(el){
  const k=el.dataset.widget;
  if(k==='clock') renderClock(el);
  else if(k==='windows') renderWindows(el);
  else if(k==='chart') renderChartWidget(el);
  else if(k==='rrcalc') renderRR(el);
  else if(k==='slcalc') renderSL(el);
}
function widgetAction(a,el){
  const w=el.closest('[data-widget]'); if(!w) return false;
  if(a==='tz'){tzChoice=el.dataset.tz;store.set('mmm_course_tz',tzChoice);document.querySelectorAll('[data-widget="clock"],[data-widget="windows"]').forEach(renderWidget);return true;}
  if(a==='clk-sel'){w.dataset.sel=el.dataset.i;renderClock(w);const b=w.querySelector(`.cb[data-i="${el.dataset.i}"]`);if(b)b.focus();return true;}
  if(a==='clk-step'){const n=CLOCK_BLOCKS.length;w.dataset.sel=((+w.dataset.sel+(+el.dataset.d))%n+n)%n;renderClock(w);const b=w.querySelector(`[data-act="clk-step"][data-d="${el.dataset.d}"]`);if(b)b.focus();return true;}
  if(a==='win-sel'){w.dataset.sel=el.dataset.w;renderWindows(w);const b=w.querySelector(`.seg [data-w="${el.dataset.w}"]`);if(b)b.focus();return true;}
  if(a==='ch-tab'){w.dataset.cur=el.dataset.c;w.dataset.step=0;renderChartWidget(w);const b=w.querySelector(`[data-act="ch-tab"][data-c="${el.dataset.c}"]`);if(b)b.focus();return true;}
  if(a==='ch-step'){w.dataset.step=el.dataset.s;renderChartWidget(w);const b=w.querySelector(`[data-act="ch-step"][data-s="${el.dataset.s}"]`);if(b)b.focus();return true;}
  if(a==='ch-move'){w.dataset.step=(+w.dataset.step)+(+el.dataset.d);renderChartWidget(w);const b=w.querySelector(`[data-act="ch-move"][data-d="${el.dataset.d}"]`);if(b&&!b.disabled)b.focus();return true;}
  if(a==='sl-phase'||a==='sl-inst'||a==='sl-mode'){const key={'sl-phase':'phase','sl-inst':'inst','sl-mode':'mode'}[a];w.dataset[key]=el.dataset.v;if(a==='sl-mode'){const f=w.querySelector('#sl-pts');if(f)f.hidden=el.dataset.v!=='manual';}w.querySelectorAll(`[data-act="${a}"]`).forEach(x=>x.setAttribute('aria-pressed',String(x===el)));updateSL(w);return true;}
  if(a==='rr-preset'){w.dataset.rr=el.dataset.v;const c=w.querySelector('#rr-custom');if(c)c.value=el.dataset.v;updateRR(w);return true;}
  return false;
}
function widgetInput(el){
  const sw=el.closest('[data-widget="slcalc"]'); if(sw&&el.dataset.sl){const v=parseFloat(el.value);if(!isNaN(v)){sw.dataset[el.dataset.sl]=v;updateSL(sw);}return true;}
  const w=el.closest('[data-widget="rrcalc"]'); if(!w||!el.dataset.rr) return false;
  const v=parseFloat(el.value); if(isNaN(v)) return true;
  w.dataset[el.dataset.rr]=v; updateRR(w); return true;
}

/* ---------- SL Manager stop & size calculator (same rules as the indicator) ---------- */
const SL_SPECS={NQ:{pv:20,micro:'MNQ'},ES:{pv:50,micro:'MES'},YM:{pv:5,micro:'MYM'},RTY:{pv:50,micro:'M2K'}};
function slCompute(buf,phase,inst,manual,manualPts,nt){
  const sp=SL_SPECS[inst]||SL_SPECS.NQ; let tier='none',n=0,pvT=sp.pv,name=inst;
  if(buf>=10000){tier='mini';n=Math.floor(buf/10000);pvT=sp.pv;name=inst;}
  else if(buf>=1000){tier='micro';n=Math.floor(buf/1000);pvT=sp.pv/10;name=sp.micro;}
  else if(buf>=100){tier='nano';n=Math.floor(buf/100);pvT=sp.pv/100;name='Nano '+inst;}
  const pct=phase==='live'?2:10, allowed=buf*pct/100, auto=pct*100/sp.pv, stop=manual?manualPts:auto;
  const perPt=pvT*n, risk=stop*perPt, over=risk>allowed+0.01;
  return {tier,n,name,pct,allowed,auto,stop,perPt,risk,over,targets:Array.from({length:nt},(_,k)=>({k:k+1,pts:stop*(k+1),usd:risk*(k+1)}))};
}
function renderSL(el){
  const d=el.dataset; d.buf=d.buf||2000; d.phase=d.phase||'challenge'; d.inst=d.inst||'NQ'; d.mode=d.mode||'auto'; d.pts=d.pts||30; d.nt=d.nt||3;
  const seg=(act,vals,cur,lab)=>`<div class="seg wseg" role="group" aria-label="${esc(lab)}">${vals.map(([v,l])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${esc(l)}</button>`).join('')}</div>`;
  el.innerHTML=`<div class="rr-grid">
    <div class="rr-field"><label for="sl-buf">${esc(t('sl_buffer'))}</label><input class="field" id="sl-buf" type="number" min="0" step="100" value="${d.buf}" data-sl="buf"></div>
    <div class="rr-field"><span class="rr-lab">${esc(t('sl_phase'))}</span>${seg('sl-phase',[['challenge',t('ph_challenge')],['funded',t('ph_funded')],['live',t('ph_live')]],d.phase,t('sl_phase'))}</div>
    <div class="rr-field"><span class="rr-lab">${esc(t('sl_inst'))}</span>${seg('sl-inst',[['NQ','NQ'],['ES','ES'],['YM','YM'],['RTY','RTY']],d.inst,t('sl_inst'))}</div>
    <div class="rr-field"><span class="rr-lab">${esc(t('sl_mode'))}</span><div class="rr-presets">${seg('sl-mode',[['auto',t('sl_auto')],['manual',t('sl_manual')]],d.mode,t('sl_mode'))}<label class="sr" for="sl-pts">${esc(t('sl_manual_pts'))}</label><input class="field" id="sl-pts" type="number" min="0.25" step="0.25" value="${d.pts}" data-sl="pts"${d.mode==='manual'?'':' hidden'} aria-label="${esc(t('sl_manual_pts'))}"></div></div>
  </div><div class="rr-out" id="sl-out" aria-live="polite"></div><div id="sl-tgts" class="sl-tgts"></div><p class="rr-verdict" id="sl-verdict"></p>`;
  updateSL(el);
}
function updateSL(el){
  const d=el.dataset, r=slCompute(Math.max(0,+d.buf||0),d.phase,d.inst,d.mode==='manual',Math.max(0.25,+d.pts||0.25),Math.max(1,Math.min(5,+d.nt||3)));
  const pts=v=>num(v,v%1?2:0)+(lang==='fr'?' pts':' pts');
  const size=r.n>0?`${r.n} ${r.name}`:t('sl_small_short');
  const cells=[[t('sl_size'),size,r.n>0?t('tier_'+r.tier):'',r.n>0?'':'neg'],[t('sl_allowed'),money(r.allowed),fmt(t('sl_of_buf'),{pct:r.pct}),''],[t('sl_stop'),'−'+pts(r.stop),'−'+money(r.risk),r.over?'neg':''],[t('sl_perpt'),money(r.perPt),'','']];
  el.querySelector('#sl-out').innerHTML=cells.map(([k,v,sub,c])=>`<div class="rr-cell"><span>${esc(k)}</span><b class="${c}">${esc(v)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>`).join('');
  el.querySelector('#sl-tgts').innerHTML=r.n>0?r.targets.map(x=>`<span class="sl-tgt"><b>${x.k}R</b> +${esc(pts(x.pts))} · +${esc(money(x.usd))}</span>`).join(''):'';
  const v=el.querySelector('#sl-verdict');
  let cls='ok',msg=fmt(t('sl_ok'),{stop:pts(r.stop)});
  if(r.n<=0){cls='no';msg=t('sl_small');}
  else if(r.over){cls='no';msg=fmt(t('sl_over'),{risk:money(r.risk),allowed:money(r.allowed),auto:pts(r.auto)});}
  else if(d.mode==='manual'&&r.stop<r.auto){cls='thin';msg=fmt(t('sl_tight'),{risk:money(r.risk),pct:num(r.risk/Math.max(1,+d.buf)*100,1)});}
  v.className='rr-verdict '+cls; v.textContent=msg;
}

(function init(){
  const th=store.get('mmm_course_theme',null); if(th==='light'||th==='dark') document.documentElement.setAttribute('data-theme',th);
  loadProgress(); buildCardList(); applyStatic(); renderLanding();
  if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: light)');if(mq.addEventListener)mq.addEventListener('change',updateThemeLabel);}
