<section class="wide"><h2>What this sheet is</h2>
<ul>
<li>A general <b>foundation test</b> built from your two PDFs: <i>MMM Range Ladder — Long &amp; Short Entry Rules</i> and the <i>MMM Indicator Test Plan</i>.</li>
<li>Data: NQ 1-minute, <b>Dec 26 2022 → Dec 11 2025</b>. Charts: 1m, 5m, 15m, 1h. 5m/15m/1h replay every candle on the 1m chart (magnifier) to know what came first: fill, stop or target.</li>
<li><b>After costs:</b> 1 pt taken off every trade (1 tick slippage each side + commission).</li>
<li>Pick a tab at the bottom. In a grid tab: use the dropdowns, click a column title to sort, set Min trades, tick PASS only.</li>
</ul></section>
<section><h2>What gets tested</h2>
<div class="tw"><table><tr><th>Family</th><th>Event</th><th>eBlock / iBlock</th></tr>
<tr><td>CANDLE TYPES (MMCB)</td><td>Every BC+, BC−, C2+, C2−, AFs+, AFs− candle</td><td>—</td></tr>
<tr><td>ZONE x (BZ)</td><td>ZBrk: close outside the BZ (resets 18:00, 02:00, 09:30)</td><td>FLIP = CDLx/CDSx · CONT = LDx/SDx</td></tr>
<tr><td>CANDLE c-O</td><td>CBrk: close through the last GMC Open</td><td>FLIP = CDLc/CDSc · CONT = LDc/SDc</td></tr>
<tr><td>CANDLE c-L</td><td>CBrk: close through the whole GMC candle</td><td>same</td></tr>
<tr><td>SWING s</td><td>SBrk: close through a locked swing</td><td>FLIP = CDLs/CDSs · CONT = LDs/SDs</td></tr></table></div>
<p>Views: ALL, LONG, SHORT, FLIP (eBlock), CONT (iBlock), BRK+ (break candle closed past its own 50%), BRK− (it did not). Candles: each type, long and short.</p></section>
<section><h2>Entries</h2>
<div class="tw"><table><tr><th>Code</th><th>Breaks (long)</th></tr>
<tr><td>E1</td><td>Break Close, market</td></tr><tr><td>E2</td><td>Break Open (limit)</td></tr><tr><td>E3</td><td>Broken level retest (BZ edge / GMC level / swing line)</td></tr>
<tr><td>E4</td><td>Zone near edge: OCL for BZ, origin candle High for c/s</td></tr><tr><td>E5</td><td>Zone 50: BZ 50, origin candle 50% for c/s</td></tr><tr><td>E6</td><td>Leg 50: halfway PL → break candle High</td></tr></table></div>
<div class="tw"><table><tr><th>Code</th><th>Candle types (long; short mirrors)</th></tr>
<tr><td>C</td><td>Close, market</td></tr><tr><td>O</td><td>Open (limit)</td></tr><tr><td>L-P</td><td>P 87.5% = 12.5% pullback</td></tr><tr><td>L-MP</td><td>MP 75%</td></tr><tr><td>L-BAL</td><td>BAL 50%</td></tr><tr><td>L-MD</td><td>MD 25%</td></tr><tr><td>L-D</td><td>D 12.5% = deep</td></tr></table></div>
<p>Every limit runs twice: <b>Touch</b> (·T) and <b>Through</b> (·Th, price trades 1 tick past). A limit is cancelled if the 1:2 target prints first, a new break of the same engine prints (candles: 20 candles), price closes past PL / the candle's 0%, or the next open comes.</p></section>
<section><h2>Stops, exits, targets</h2>
<ul>
<li><b>S0</b> fixed 50 pts · <b>S1</b> break candle Low (candles: candle extreme) · <b>S2</b> broken level · <b>S3</b> OC zone (BZ only) · <b>S4</b> PL · <b>S5</b> swing of the last 2 legs · <b>S6</b> ATR(14) × 1.0 / 1.5 / 2.0. All 1 tick beyond. Stops under 4 ticks are skipped.</li>

    let h=`<div class="doc"><section class="wide"><p class="lede">Every strategy that held in <b>both</b> test periods, in one format. Each number is shown as <b>2022–25 → 2026 · Blended</b>: the NQ result 2022–25, then the fresh MNQ result 2026, then both periods together as one run. Money = ${BK.n} ${BK.c} contract${BK.n>1?'s':''} (change it at the top), after a 1 pt cost on every trade.</p></section>
    <section><h2>Strategy names</h2><p>Every strategy has a code: the indicator letters, then M1, M2, M3… (M = model).</p><div class="tw"><table><tr><th class="l">Code</th><th class="l">Indicator</th><th class="l">What it focuses on</th></tr>${BK_NAMES.map(n=>`<tr><td class="l"><b>${n[0]}.M1, ${n[0]}.M2…</b></td><td class="l">${n[1]}</td><td class="l">${n[2]}</td></tr>`).join('')}</table></div></section>
    <section><h2>How to read</h2><ul><li><b>WR</b> = win rate: the share of trades that end in profit. <b>Break-even WR</b> = the WR you need just to not lose at that target.</li><li><b>Avg RR</b> = the average result per trade in R (1R = your stop), after costs. <b>PF</b> = money won ÷ money lost.</li><li><b>t-score</b> = 2 or more means probably real. Under 2 can still be luck.</li><li><b>Max drawdown</b> = the biggest drop from the account’s high point. <b>Max losses / wins in a row</b> = the longest streaks seen.</li><li><b>TRADE</b> = held in both periods with enough trades. <b>WATCH</b> = held, but a small sample or a caveat: paper-trade it first.</li><li><b>Limit entries</b> (EP.M3, X.M2, X.M3): 2026 uses only the months with 1-min or 5-min data. 15-min bars made limit fills look better than they were.</li></ul></section>
    <section class="wide"><h2>All strategies</h2><p class="note">Each cell = <b>2022–25 → 2026 · Blended</b>. Net, max drawdown and streaks are for the blended run.</p><div class="tw"><table><tr><th class="l">Code</th><th class="l">Strategy</th><th class="l">Status</th><th class="l">Target</th><th>Trades</th><th>WR</th><th>Avg RR</th><th>PF</th><th>t-score</th><th>Net (blended)</th><th>Max drawdown</th><th>Max losses in a row</th><th>Max wins in a row</th></tr>${idx}</table></div></section>`;
    for(const ind of ['EP','x','c','XCS']){const L=B.filter(s=>s.ind===ind);if(!L.length)continue;h+=`<section class="wide flat"><h2 style="font-size:17px;margin:8px 0 0">${BK_IND[ind]}</h2></section>`+L.map(sheet).join('')}
    sc.innerHTML=h+'</div>';sc.scrollTop=y;
    sc.querySelectorAll('[data-j]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById('bk-'+a.dataset.j);if(t)t.scrollIntoView({block:'start'})});
    sc.querySelectorAll('button[data-pk]').forEach(b=>b.onclick=()=>{BK.pick[b.dataset.pk]=+b.dataset.v;paint()});
    sc.querySelectorAll('button[data-pv]').forEach(b=>b.onclick=()=>{BK.per[b.dataset.pv]=b.dataset.v;paint()})}
  paint();
};

// ───────────────── tabs, router, 2022–25 grids ─────────────────
const TABS=[
 {grp:'GUIDE'},
 {id:'start',name:'START HERE',kind:'guide',win:true},
 {id:'words',name:'MMM WORDS',kind:'guide'},
 {id:'ind',name:'INDICATORS',kind:'guide'},
 {id:'tested',name:'HOW WE TESTED',kind:'guide'},
 {id:'book',name:'STRATEGY BOOK',kind:'guide',win:true},
 {id:'verdicts',name:'VERDICTS',kind:'guide',win:true},
 {id:'edge',name:'EDGE PRO LAB',kind:'guide'},
 {id:'prop',name:'PROP & SIZE',kind:'guide'},
 {id:'levels',name:'LEVELS & ODDS',kind:'guide'},
 {id:'retest',name:'2026 RETEST',kind:'guide'},
 {grp:'2022–25 GRID'},
 {id:'readme',name:'HOW TO READ',kind:'doc'},
 {id:'answers',name:'ANSWERS',kind:'doc'},
 {id:'run',name:'BREAK RUN',file:'d_run.json'},
 {id:'cmap',name:'CANDLE MAP',file:'d_cmap.json'},
 {id:'bmap',name:'BRKZONE MAP',file:'d_bmap.json'},
 {id:'marg',name:'BEST ENTRY · STOP · EXIT',file:'d_marg.json'},
 {id:'es',name:'ENTRY × STOP',file:'d_es.json'},
 {id:'top',name:'TOP 10 BY PF',file:'d_top.json'},
 {id:'topt',name:'TOP 10 BY t-SCORE',file:'d_topt.json'},
 {id:'proof',name:'PROOF CHECKLIST',file:'d_proof.json'},
 {id:'fsum',name:'FILTERS SUMMARY',file:'d_fsum.json'},
 {id:'filt',name:'FILTERS DETAIL',file:'d_filt.json'},
 {id:'g1',name:'FULL GRID 1m',tf:'1m'},
 {id:'g5',name:'FULL GRID 5m',tf:'5m'},
 {id:'g15',name:'FULL GRID 15m',tf:'15m'},
 {id:'g60',name:'FULL GRID 1h',tf:'1h'},
];
let gridFiles=null;const famSel={};
const cache={};let cur=null;const state={};
function fmt(v,t){
  if(v===null||v===undefined||v==='')return '';
  switch(t){
    case 'p':return (v*100).toFixed(0)+'%';
    case 'i':return Math.round(v).toLocaleString('en-US');
    case 'r':case 'f':return (v>0&&t==='r'?'+':'')+v.toFixed(2);
    case 't':return v.toFixed(2);
    case 'pf':return v>=99?'∞':v.toFixed(2);
    case 'n1':return v.toFixed(1);
    default:return String(v);
  }
}
function cls(v,t){
  if(v===null||v===undefined)return '';
  if(t==='r'){if(v>=0.15)return 'c-g1';if(v>0.03)return 'c-g2';if(v<=-0.15)return 'c-r1';if(v<-0.03)return 'c-r2';return ''}
  if(t==='t'){if(v>=2)return 'c-g1';if(v>=1)return 'c-g2';if(v<=-2)return 'c-r1';if(v<=-1)return 'c-r2';return ''}
  if(t==='pf'){if(v>=1.3&&v<99)return 'c-g1';if(v>1.05)return 'c-g2';if(v<0.8)return 'c-r1';if(v<0.95)return 'c-r2';return ''}
  return '';
}
function buildTabs(){
  const nav=$('#tabs');nav.innerHTML='';
  TABS.forEach(t=>{if(t.grp){const s=document.createElement('span');s.className='grp';s.textContent=t.grp;nav.appendChild(s);return}
    const b=document.createElement('button');b.type='button';b.textContent=t.name;b.id='tab-'+t.id;if(t.win)b.classList.add('win');b.onclick=()=>show(t.id);nav.appendChild(b)});
}
async function show(id){
  const T=TABS.filter(x=>x.id);const t=T.find(x=>x.id===id)||T[0];cur=t;store('mmm-tab2',t.id);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id==='tab-'+t.id));
  const on=document.getElementById('tab-'+t.id);if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
  const sc=$('#scroll');sc.onscroll=null;sc.scrollTop=0;sc.scrollLeft=0;
  $('#sub').textContent=t.kind==='guide'?'NQ 1m 2022–25 + fresh MNQ Dec 2025 – Oct 2026 · every number after costs (1 pt a trade)':'2022–25 foundation grid · NQ 1m · 1 pt cost';
  if(t.kind==='guide'){$('#bar').innerHTML='';G[t.id](sc);return}
  if(t.kind==='doc'){$('#bar').innerHTML='';sc.innerHTML=document.getElementById('doc-'+t.id).innerHTML;return}
  sc.innerHTML='<div class="loading">Loading '+t.name+'…</div>';
  let file=t.file,key=t.id,pre=null;
  if(t.tf){
    try{if(!gridFiles)gridFiles=await (await fetch('grid_files.json')).json()}catch(e){sc.innerHTML='<div class="loading">This tab could not load. Reload the page to try again.</div>';return}
    const fams=Object.keys(gridFiles[t.tf]);if(!famSel[t.id])famSel[t.id]=fams[0];
    file=gridFiles[t.tf][famSel[t.id]];key=t.id+'|'+famSel[t.id];
    pre=bar=>{const lab=document.createElement('label');lab.textContent='Family';const sel=document.createElement('select');sel.id='fam-'+t.id;
      sel.innerHTML=fams.map(f=>`<option${f===famSel[t.id]?' selected':''}>${f}</option>`).join('');
      sel.onchange=()=>{famSel[t.id]=sel.value;show(t.id)};lab.appendChild(sel);bar.appendChild(lab)};
  }
  if(!cache[file]){try{cache[file]=await (await fetch(file)).json()}catch(e){sc.innerHTML='<div class="loading">This tab could not load. Reload the page to try again.</div>';return}}
  if(cur!==t)return;
  grid(t,cache[file],key,pre);
}
function grid(t,D,key,pre){
  const st=state[key]||(state[key]={f:{},minN:D.minN??0,pass:false,q:'',sort:D.sort??null,dir:D.dir??-1});
  const cols=D.cols;
  const bar=$('#bar');bar.innerHTML='';
  if(pre)pre(bar);
  (D.filters||[]).forEach(k=>{
    const ci=cols.findIndex(c=>c.k===k);if(ci<0)return;
    const vals=[...new Set(D.rows.map(r=>r[ci]))];
    const lab=document.createElement('label');lab.textContent=cols[ci].f||cols[ci].l;
    const sel=document.createElement('select');sel.id='f-'+key.replace(/[^a-z0-9]/gi,'')+'-'+k;
    sel.innerHTML='<option value="">All</option>'+vals.map(v=>`<option${st.f[k]===String(v)?' selected':''}>${v}</option>`).join('');
    sel.onchange=()=>{st.f[k]=sel.value;render()};lab.appendChild(sel);bar.appendChild(lab);
  });
  const nci=cols.findIndex(c=>c.k==='n');
  if(nci>=0){const lab=document.createElement('label');lab.textContent='Min trades';const inp=document.createElement('input');inp.type='number';inp.id='minn-'+t.id;inp.min=0;inp.step=10;inp.value=st.minN;inp.oninput=()=>{st.minN=+inp.value||0;render()};lab.appendChild(inp);bar.appendChild(lab)}
  const pci=cols.findIndex(c=>c.k==='pass');
  if(pci>=0){const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.id='pass-'+t.id;cb.checked=st.pass;cb.onchange=()=>{st.pass=cb.checked;render()};lab.appendChild(cb);lab.appendChild(document.createTextNode('PASS only'));bar.appendChild(lab)}
  const cnt=document.createElement('span');cnt.className='count';bar.appendChild(cnt);
  const sc=$('#scroll');
  sc.innerHTML='';
  const tbl=document.createElement('table');tbl.className='g';
  const thead=document.createElement('thead');const hr=document.createElement('tr');
  const th0=document.createElement('th');th0.className='rn';th0.textContent='#';hr.appendChild(th0);
  cols.forEach((c,i)=>{const th=document.createElement('th');th.innerHTML=c.l+(c.h?`<small>${c.h}</small>`:'');if(c.code)th.classList.add('code');th.title='Sort by '+c.l.replace(/<[^>]+>/g,'');
    th.onclick=()=>{if(st.sort===i)st.dir*=-1;else{st.sort=i;st.dir=c.t==='s'?1:-1}render()};hr.appendChild(th)});
  thead.appendChild(hr);tbl.appendChild(thead);
  const tb=document.createElement('tbody');tb.setAttribute('translate','no');tbl.appendChild(tb);sc.appendChild(tbl);
  const RH=26;let view=[];
  function filtered(){
    let rows=D.rows;
    for(const k in st.f){if(!st.f[k])continue;const ci=cols.findIndex(c=>c.k===k);rows=rows.filter(r=>String(r[ci])===st.f[k])}
    if(nci>=0&&st.minN>0)rows=rows.filter(r=>(r[nci]||0)>=st.minN);
    if(pci>=0&&st.pass)rows=rows.filter(r=>r[pci]==='PASS');
    if(st.sort!==null){const i=st.sort,d=st.dir;rows=rows.slice().sort((a,b)=>{const x=a[i],y=b[i];if(x===y)return 0;if(x===null||x===undefined)return 1;if(y===null||y===undefined)return -1;return (x>y?1:-1)*d})}
    return rows;
  }
  function paint(){
    const top=sc.scrollTop,h=sc.clientHeight;
    const a=Math.max(0,Math.floor((top)/RH)-20),b=Math.min(view.length,Math.ceil((top+h)/RH)+20);
    let html=`<tr style="height:${a*RH}px"></tr>`;
    for(let r=a;r<b;r++){const row=view[r];html+='<tr><td class="rn">'+(r+1)+'</td>';
      cols.forEach((c,i)=>{const v=row[i];
        if(c.t==='s')html+=`<td class="s${c.code?' code':''}">${v??''}</td>`;
        else if(c.t==='b')html+=`<td class="s">${v==='PASS'?'<span class="pass">PASS</span>':'<span class="fail">'+(v||'')+'</span>'}</td>`;
        else html+=`<td class="${cls(v,c.t)}">${fmt(v,c.t)}</td>`});
      html+='</tr>'}
    html+=`<tr style="height:${(view.length-b)*RH}px"></tr>`;tb.innerHTML=html;
  }
  function render(){view=filtered();cnt.textContent=view.length.toLocaleString('en-US')+' rows of '+D.rows.length.toLocaleString('en-US');
    thead.querySelectorAll('th').forEach((th,j)=>th.classList.toggle('sorted',j-1===st.sort));sc.scrollTop=0;paint()}
  let raf=0;sc.onscroll=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint()})};
  render();
}

// ───────────────── view only: no copy, no save, no print ─────────────────
(function(){
  const okField=e=>{const t=e.target;return t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')};
  ['copy','cut','dragstart','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(!okField(e))e.preventDefault()},true));
  document.addEventListener('selectstart',e=>{if(!okField(e))e.preventDefault()},true);
  document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&['c','x','s','p','a','u'].includes(k)&&!okField(e)){e.preventDefault();e.stopPropagation()}
  },true);
  window.addEventListener('beforeprint',()=>{document.body.style.display='none'});
  window.addEventListener('afterprint',()=>{document.body.style.display=''});
})();

buildTabs();
let start=null;try{start=location.hash.slice(1)||store('mmm-tab2')}catch(e){}
show(TABS.some(t=>t.id===start)?start:'start');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t.id===h))show(h)});
