<section class="wide"><h2>What this sheet is</h2>
<ul>
<li>A general <b>foundation test</b> built from your two PDFs: <i>MMM Range Ladder — Long &amp; Short Entry Rules</i> and the <i>MMM Indicator Test Plan</i>.</li>
<li>Data: NQ 1-minute, <b>Dec 26 2022 → Dec 11 2025</b>. Charts: 1m, 5m, 15m, 1h. 5m/15m/1h replay every candle on the 1m chart (magnifier) to know what came first: fill, stop or target.</li>

<section><h2><span class="k">ENTRY</span>Close beats every limit</h2>
<ul><li><b>E1 Break Close / C Close</b> is the best or tied-best entry on almost every chart and engine.</li>

['filter','gen','Liquidity clusters: expect the wick, don’t trade it','A liquidity cluster = 3 or more candles (inside 10 candles) whose wicks made a fake rejection at one flat or gently sloped line, and nothing closed through it. ▲ = upper wicks (buy stops above) · ▼ = lower wicks (sell stops below). Now drawn in MMM Pro XCS One and MMM EDGE PRO.','Price goes back for them about 8 of 10 times when they are close, the same as one swing at that distance. After the take, back or further is 50 / 50.','Taken in 10 candles, clusters vs single swings: under ½ ATR 81% → 84% vs 81% → 84% · ½–1 ATR 67% → 69% vs 66% → 67%. After the take: 1 ATR back first 36%, 1 ATR further first 36%. 0 of 486 trade combos passed both periods'],

['filter','gen','Level Retest: skip it when a GMC gap sits between the PO4 T1 and the CDL','A GMC (3-candle gap with the move) formed in the leg from the PO4 T1 to the CDS / CDL break, with its level inside that range. About 1 in 4 trades.','With a gap the retest does not work (PF 1.00). Without one it is the best version found: a fast leg that leaves a gap usually retests deeper or fails.','1m long NY AM · PO4 retest · 15m trend · 40 pts · 1:5: no gap WR 37%, PF 1.66, t-score 3.21, net +$8,792 in 39 months, max drawdown −$1,125 · with a gap PF 1.00 (84 trades)'],
['no','gen','Level Retest: don’t enter the gap trades at the CDS / CDL close','When a GMC gap sits between the PO4 T1 and the CDL, the retest fills only 36% of the time (72% without a gap). Tested: enter those gap trades at the CDL close instead, and mix gap → CDL close with no gap → PO4 retest.','The gap trades stay weak even at the CDL close (PF 1.15). The mix makes less than the no-gap retest alone. Skip the gap trades.','Long NY AM · 15m trend · 40 pts · 1:5: gap at the CDL close PF 1.15, net +$1,898 · mix PF 1.34, +$7,552 · no-gap PO4 retest alone PF 1.67, +$8,874'],
['no','gen','Level Retest: don’t exit at the first close back past the PO4 T1','After the fill, get out at the close of the first 1m candle that closes back past the PO4 T1 (the fill candle included), instead of waiting for the stop. Also tested with a 5 / 10 / 20 pt buffer.','The losses get smaller (−$13 instead of −$79), but about 80% of the trades that later win also close back past the T1 first. The win rate falls from 36% to 7% and the losing runs grow to 42. A 20 pt buffer is about the same as no exit; keep the fixed stop.','PO4 retest · 15m trend · 40 pts · 1:5: net +$8,692 → +$1,876 with this exit · 20 pt buffer +$6,420 · Max’s 2-candle rule (out when a later close breaks the violation candle low), no gap: PF 1.73, avg loss −$35, net +$6,336, but 17 losses in a row'],
['trade','gen','C.M8 · 09:30 15m BuBC above the pre-open high: long at the 09:45 close','The first NY 15m candle (09:30–09:45) closes above the previous 15m high AND above the pre-open high (08:00–09:30). Buy at the 09:45 close, stop 50 pts, target 1:3. Get out early on a 15m close below the candle low, else out at 16:59. One trade a day.','Buyers broke the pre-open range on the opening drive; when that holds, the day keeps going up. A candle that closes inside the pre-open range has no edge. Also tested and worse: 1m / 5m CDL entries, a limit at 50% of the candle or at its open, a 35 pt or candle-low stop, the opposite-BC exit, shorts. The pre-open filter was picked from 14 filters, so expect a bit less live.','2022–25 → 2026: 219 → 57 trades · avg RR +0.42 → +0.31 · Blended: WR 41% · avg RR +0.40 · PF 1.69 · t-score +3.75 · every year positive (2023 +0.34 · 2024 +0.51 · 2025 +0.37 · 2026 +0.41) · max 7 losses in a row · net +$10,926 at 1 MNQ in 46 months · max drawdown −$906. At 1:2: WR 45%, avg RR +0.28. No filter, 1:3: avg RR +0.26, t-score 2.97'],
['no','gen','Don’t trade the London 02:00–05:00 or the 1H 09:00 opening candles','The 15m 02:00, 03:00, 04:00, 05:00 candles and the 1H 09:00 candle: their body close traded at the close (stops 50 pts / far end / middle, targets 1:1–1:5, early exits), and their high / low traded on 1m and 5m: touch → reverse, close past → continue, plain or with a CDL / CDS (limit at the PO4 T1 or at the close, 15m trend, 2-candle exit).','The first touch of a candle high / low is a coin flip: about 50% reverse, 50% close through, at every candle. London moves are short (median 14–31 pts before the far end is touched again). After a 1H 09:00 BC, only 1.5–2 more BCs follow before an opposite one.','Body close at the close: every London candle avg RR −0.12 to +0.04, all FAIL · 1H 09:00 BuBC 2026 −0.11, BeBC +0.11 (t-score 1.3) · touch / close entries: 0 of 2,550 combos profitable with t-score 2+ and a PASS · with CDL / CDS: 77 of 39,222 (luck level). One lead only: 1m 04:00 high touch → CDS short, 25 pts, 1:2, 15m trend: WR 50%, avg RR +0.24, t-score 2.44, but 10 trades in 2026'],
['no','gen','Touch + reaction vs close through at a level: no edge either way','The first touch of the day at 24 levels on 5m, and at the high / low of the 02:00–05:00, 09:30 and 09:45 15m candles and the 1H 09:00 candle on 1m and 5m. Reaction = it closes back → trade away. Close through → trade the break. Also tested with a 1m / 5m CDL / CDS at the level (limit at the PO4 T1 or at the close, 15m trend, Max’s 2-candle exit).','It is a coin flip: about 50% reverse and 50% close through, at every level and every candle. The follow-through before a close back across the level is short (median 10–45 pts).','Levels on 5m: 9 of 7,805 combos passed both periods · opening candles, plain entries: 0 of 2,550 profitable with t-score 2+ and a PASS · with CDL / CDS: 77 of 39,222 (luck level)'],
['no','gen','Level Retest outside NY AM, on shorts, or at the NY AM / PM / settlement levels','Max’s Level Retest (PO4 T1 retest after a CDL / CDS at a level) run in every session, both sides, with 13 new levels added.','Only NY AM longs work. The 15m trend filter helps in 2 of 3 places, the no-gap filter only half the time, and letting the trade run beats the 2-candle exit in 3 of 4 places.','Long, all sessions, 40 pts, 1:5: 09:30 open PF 1.60 · pre-open low 1.30 · NY AM high 0.92 · settlement 0.92 · London low 0.90 · shorts PF 0.87'],
['watch','gen','C.M6 · Level Retest A (Max Profit): 1m PO4 retest at an HTF level, NY AM, longs','Price reaches an HTF level (daily open, PDH / PDL, overnight or Asia high / low, 09:30 open, prior close, H1 / H4 GMC). The 1m structure flips up (CDL) with its PO4 T1 within 15 pts of the level, the 15m MMM trend is up, and no GMC gap sits between the PO4 T1 and the CDL. Buy limit at the PO4 T1, stop 40 pts, target 1:5, stop or target only, out at 16:59. 1 MNQ, one trade at a time.','The level is real: the same long with no level near loses in both periods. Corrected Oct 24 2026: a limit that fills on a candle closing back past the T1 now counts as filled (the first test skipped those fills, so it looked far better than it is). Getting out at the first close back past the T1 cuts 8 in 10 winners. A lead, not proven: paper-trade it first.','265 trades in 39 months · WR 37% · avg win $225 / avg loss −$79 · avg RR +0.42 · PF 1.67 · t-score 3.25 · net +$8,874 at 1 MNQ · max 9 losses in a row · max drawdown −$1,125 · 2026: 12 trades, +$456 · with no level near: PF 0.92'],
['watch','gen','C.M7 · Level Retest B (Small Loss): same setup, 35 pts, Max’s 2-candle exit','Same setup as C.M6. Stop 35 pts, target 1:5. Max’s 2-candle exit: after a 1m close below the PO4 T1 (candle V), get out when a later candle closes below V’s low. A close back above the T1 resets it.','A close below the T1 happens in 82% of winners and 99% of losers, so the first close tells you nothing. Waiting for the second candle keeps more winners and cuts the average loss to about −$34. You pay with a 19% WR and longer losing runs.','299 trades in 39 months · WR 19% · avg win $261 / avg loss −$34 · avg RR +0.30 · PF 1.78 · t-score 2.96 · net +$6,379 at 1 MNQ · max 17 losses in a row · max drawdown −$742 · 2026: 13 trades, +$251'],
['watch','edge','Old MMM Pro Edge (S1–S5): fewer losses on screen, not more money','The earlier MMM Pro Edge, Auto mode on NQ: S1 RevBreak with Daily bias + 1h / 4h alignment on 5m / 1h / 4h, S2 RevBreak Scalp 1R on 1h, S3 ContBreak BC+ 1R on 1h. Its own stops and targets, max 100 candles, 1 pt cost.','It trades 1–19 times a month, so users see far fewer losses. But S1 on 5m (its main setup) lost in both periods, 1h was about break-even and 4h made little. Only S2 on MNQ 1h held up, at about 2 trades a month. EDGE PRO with the daily stop and Asia + NY AM makes far more, while losing 6 of 10 trades.','S1 5m −0.19 → −0.10 avg RR · S2 1h +0.33 → +0.17 (WR 68% → 59%) · S3 1h −0.00 → −0.08 · at $100 risk: 5m chart −$272 → −$193 a month · EDGE PRO now +$950 → +$1,760 a month'],
['no','gen','Don’t buy the 2nd break after the pullback closed back inside the box','Bull block break, then a pullback that closes back inside the box but not below the box low, then a close above the break candle high (or back above the box top). 5m / 15m / 1H, stops 50 pts / box low / pullback low / break candle, targets 1:1–1:3, hold, or out at a close below the box low or the first opposite BC.','After a close back inside, 54–56% go on to the 2nd break and 41–43% close below the box low first: close to a coin flip. Trading it is flat, and weaker than when the pullback never closes inside. Keep the strict rule: a close back inside = out.','50 pts · 1:2, all sessions: 5m −0.02 · 15m −0.00 · 1H +0.00 avg RR · never closed inside: 15m +0.02 · 1H +0.05 · 12,564 combos, 9 with t-score 2+ in both periods (luck)'],

    const ml=BLK.ml,dec=k=>(ml[k]||[]).map(r=>`<td>${Math.round(100*r[2])}%</td>`).join('');
    h+=`<section class="wide"><h2>What did not work</h2>
    <h3>Blocks vs a random box, every timeframe · ${BL_PER.find(p=>p[0]===BS.per)[1]}</h3><p class="note">Any eBlock, iBlock or balanced block, long + short. A random box holds and reacts as often, or more often.</p>

    <h3>HTF block → enter on 5m / 15m, stop on the entry candle</h3><p class="note">First touch of the live HTF block, then the first 5m / 15m BC or AFs in its direction, entry at its close, stop past that candle. The highlighted rows have no block: same result.</p>
    <div class="tw"><table><tr><th class="l">Entry TF</th><th class="l">Block</th><th>Trades</th><th>Avg stop</th><th>Hit 1:2</th><th>Avg RR 1:2</th><th>t-score</th></tr>${ht}</table></div>
    <ul><li><b>Limit orders inside the box</b> (XD, D, MD, BAL, MP, P, XP) with no reaction: they lost in both periods on 5m, 15m, 1h and 4h.</li>
    <li><b>Waiting for a reaction candle</b> (BC+, BC−, AFs+, AFs−) and entering at its open, close or ladder level: about zero, with your violation exit too.</li>
    <li><b>Edge scan</b>: ${N0(ml.scan.False.tested)} block buckets tested (time × volume × delta × POC × depth…). Only ${ml.scan.False.both} passed in both periods, about what luck alone gives.</li></ul>
    <h3>Can a model pick the winning touches? (trained on 2022–25, tested on 2026)</h3>
    <div class="tw"><table><tr><th class="l"></th>${[...Array(10)].map((_,i)=>`<th>${i===0?'Worst 10%':i===9?'Best 10%':['','2nd','3rd','4th','5th','6th','7th','8th','9th'][i]}</th>`).join('')}</tr>
    <tr><td class="l">Gave 1:2 · 2022–25 (what the model saw)</td>${dec('BLOCKS_give12_in')}</tr><tr><td class="l">Gave 1:2 · 2026 (new data)</td>${dec('BLOCKS_give12')}</tr><tr><td class="l">Hold % · 2026</td>${dec('BLOCKS_hold')}</tr><tr><td class="l">Hold % · 2026 · random boxes</td>${dec('RANDOM_hold')}</tr></table></div>
    <p class="note">On new data the 1:2 rate is about the same in every tenth: no pick. Hold % can be ranked, but just as well for random boxes: hold is about the touch, not the block.</p></section></div>`;
    sc.innerHTML=h;sc.scrollTop=y;
    seg('blTf',BL_TF,BS.tf,v=>{BS.tf=v;paint()});seg('blPer',BL_PER,BS.per,v=>{BS.per=v;paint()});
    seg('blTt',BL_TF,BS.tt,v=>{BS.tt=v;paint()});seg('blTp',BL_PER,BS.tp,v=>{BS.tp=v;paint()});
    sc.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go)})}

};

function fmt(v,t){
  if(v===null||v===undefined||v==='')return '';
  switch(t){
    case 'p':return (v*100).toFixed(0)+'%';
    case 'i':return Math.round(v).toLocaleString('en-US');
    case 'r':case 'f':return (v>0&&t==='r'?'+':'')+v.toFixed(2);
    case 't':return v.toFixed(2);
    case 'pf':return v>=99?'∞':v.toFixed(2);
    case 'n1':return v.toFixed(1);
    case 'tg':return '1:'+v+' RR';
    default:return String(v);
  }
}
function cls(v,t){
  if(v===null||v===undefined)return '';
  if(t==='r'){if(v>=0.15)return 'c-g1';if(v>0.03)return 'c-g2';if(v<=-0.15)return 'c-r1';if(v<-0.03)return 'c-r2';return ''}
  if(t==='t'){if(v>=2)return 'c-g1';if(v>=1)return 'c-g2';if(v<=-2)return 'c-r1';if(v<=-1)return 'c-r2';return ''}
  if(t==='pf'){if(v>=1.3&&v<99)return 'c-g1';if(v>1.05)return 'c-g2';if(v<0.8)return 'c-r1';if(v<0.95)return 'c-r2';return ''}
  return '';
}

  let file=t.file,key=t.id,pre=null;
  if(t.tf){
    try{if(!gridFiles)gridFiles=await (await fetch('grid_files.json')).json()}catch(e){sc.innerHTML='<div class="loading">This tab could not load. Reload the page to try again.</div>';return}
    const fams=Object.keys(gridFiles[t.tf]);if(!famSel[t.id])famSel[t.id]=fams[0];
    file=gridFiles[t.tf][famSel[t.id]];key=t.id+'|'+famSel[t.id];
    pre=bar=>{const lab=document.createElement('label');lab.textContent='Family';const sel=document.createElement('select');sel.id='fam-'+t.id;
      sel.innerHTML=fams.map(f=>`<option${f===famSel[t.id]?' selected':''}>${f}</option>`).join('');
      sel.onchange=()=>{famSel[t.id]=sel.value;show(t.id)};lab.appendChild(sel);bar.appendChild(lab)};
  }
  if(!cache[file]){try{cache[file]=await (await fetch(file)).json()}catch(e){sc.innerHTML='<div class="loading">This tab could not load. Reload the page to try again.</div>';return}}
  if(cur!==t)return;
  grid(t,cache[file],key,pre);
}
function grid(t,D,key,pre){
  const st=state[key]||(state[key]={f:{},minN:D.minN??0,pass:false,q:'',sort:D.sort??null,dir:D.dir??-1});
  const cols=D.cols;
  // the target of a row: the Target column (1:N), else the 1:N inside the code / best exit
  const iN=cols.findIndex(c=>c.k==='N'),iS=cols.map((c,i)=>c.t==='s'?i:-1).filter(i=>i>=0);
  const tgOf=row=>{if(iN>=0&&row[iN]!=null)return '1:'+row[iN]+' RR';for(const i of iS){const m=String(row[i]??'').match(/1:(\d+)/);if(m)return '1:'+m[1]+' RR'}return ''};
  const wrT=c=>(c.k==='wr'||c.k==='bwr')&&!/1:\d/.test(c.l)&&t.id!=='marg';
  const bar=$('#bar');bar.innerHTML='';
  if(pre)pre(bar);
  (D.filters||[]).forEach(k=>{
    const ci=cols.findIndex(c=>c.k===k);if(ci<0)return;
    const vals=[...new Set(D.rows.map(r=>r[ci]))];
    const lab=document.createElement('label');lab.textContent=cols[ci].f||cols[ci].l;
    const sel=document.createElement('select');sel.id='f-'+key.replace(/[^a-z0-9]/gi,'')+'-'+k;
    sel.innerHTML='<option value="">All</option>'+vals.map(v=>`<option${st.f[k]===String(v)?' selected':''}>${v}</option>`).join('');
    sel.onchange=()=>{st.f[k]=sel.value;render()};lab.appendChild(sel);bar.appendChild(lab);
  });
  const nci=cols.findIndex(c=>c.k==='n');
  if(nci>=0){const lab=document.createElement('label');lab.textContent='Min trades';const inp=document.createElement('input');inp.type='number';inp.id='minn-'+t.id;inp.min=0;inp.step=10;inp.value=st.minN;inp.oninput=()=>{st.minN=+inp.value||0;render()};lab.appendChild(inp);bar.appendChild(lab)}
  const pci=cols.findIndex(c=>c.k==='pass');
  if(pci>=0){const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.id='pass-'+t.id;cb.checked=st.pass;cb.onchange=()=>{st.pass=cb.checked;render()};lab.appendChild(cb);lab.appendChild(document.createTextNode('PASS only'));bar.appendChild(lab)}
  const cnt=document.createElement('span');cnt.className='count';bar.appendChild(cnt);
  const sc=$('#scroll');
  sc.innerHTML='';
  const tbl=document.createElement('table');tbl.className='g';
  const thead=document.createElement('thead');const hr=document.createElement('tr');
  const th0=document.createElement('th');th0.className='rn';th0.textContent='#';hr.appendChild(th0);
  cols.forEach((c,i)=>{const th=document.createElement('th');th.innerHTML=c.l+(c.h?`<small>${c.h}</small>`:'');if(c.code)th.classList.add('code');th.title='Sort by '+c.l.replace(/<[^>]+>/g,'');
    th.onclick=()=>{if(st.sort===i)st.dir*=-1;else{st.sort=i;st.dir=c.t==='s'?1:-1}render()};hr.appendChild(th)});
  thead.appendChild(hr);tbl.appendChild(thead);
  const tb=document.createElement('tbody');tb.setAttribute('translate','no');tbl.appendChild(tb);sc.appendChild(tbl);
  const RH=26;let view=[];
  function filtered(){
    let rows=D.rows;
    for(const k in st.f){if(!st.f[k])continue;const ci=cols.findIndex(c=>c.k===k);rows=rows.filter(r=>String(r[ci])===st.f[k])}
    if(nci>=0&&st.minN>0)rows=rows.filter(r=>(r[nci]||0)>=st.minN);
    if(pci>=0&&st.pass)rows=rows.filter(r=>r[pci]==='PASS');
    if(st.sort!==null){const i=st.sort,d=st.dir;rows=rows.slice().sort((a,b)=>{const x=a[i],y=b[i];if(x===y)return 0;if(x===null||x===undefined)return 1;if(y===null||y===undefined)return -1;return (x>y?1:-1)*d})}
    return rows;
  }
  function paint(){
    const top=Math.max(0,sc.scrollTop-tbl.offsetTop),h=sc.clientHeight;
    const a=Math.max(0,Math.floor((top)/RH)-20),b=Math.min(view.length,Math.ceil((top+h)/RH)+20);
    let html=`<tr style="height:${a*RH}px"></tr>`;
    for(let r=a;r<b;r++){const row=view[r];html+='<tr><td class="rn">'+(r+1)+'</td>';
      cols.forEach((c,i)=>{const v=row[i];
        if(c.t==='s')html+=`<td class="s${c.code?' code':''}">${v??''}</td>`;
        else if(c.t==='b')html+=`<td class="s">${v==='PASS'?'<span class="pass">PASS</span>':'<span class="fail">'+(v||'')+'</span>'}</td>`;
        else if(wrT(c)){const tg=tgOf(row);html+=`<td class="${cls(v,c.t)}">${fmt(v,c.t)}${tg?` <span class="tg">${tg}</span>`:''}</td>`}
        else html+=`<td class="${cls(v,c.t)}">${fmt(v,c.t)}</td>`});
      html+='</tr>'}
    html+=`<tr style="height:${(view.length-b)*RH}px"></tr>`;tb.innerHTML=html;
  }
  function render(){view=filtered();cnt.textContent=view.length.toLocaleString('en-US')+' rows of '+D.rows.length.toLocaleString('en-US');
    thead.querySelectorAll('th').forEach((th,j)=>th.classList.toggle('sorted',j-1===st.sort));sc.scrollTop=0;paint()}
  let raf=0;sc.onscroll=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint()})};
  render();
}

// ───────────────── view only: no copy, no save, no print ─────────────────
(function(){
  const okField=e=>{const t=e.target;return t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')};
  ['copy','cut','dragstart','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{if(!okField(e))e.preventDefault()},true));
  document.addEventListener('selectstart',e=>{if(!okField(e))e.preventDefault()},true);
  document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&['c','x','s','p','a','u'].includes(k)&&!okField(e)){e.preventDefault();e.stopPropagation()}
  },true);
  window.addEventListener('beforeprint',()=>{document.body.style.display='none'});
  window.addEventListener('afterprint',()=>{document.body.style.display=''});
})();

buildTabs();
new MutationObserver(()=>{const sc=$('#scroll');if(!cur)return;const f=sc.firstElementChild;if(!f||f.classList.contains('loading'))return;
  if(f.classList.contains('ph')&&f.dataset.id===cur.id)return;sc.querySelectorAll(':scope>.ph').forEach(x=>x.remove());sc.insertAdjacentHTML('afterbegin',pageHead(cur.id))}).observe($('#scroll'),{childList:true});
let start=null;try{start=location.hash.slice(1)||store('mmm-tab2')}catch(e){}
show(TABS.some(t=>t.id===start)?start:'start');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t.id===h))show(h)});

</script>
