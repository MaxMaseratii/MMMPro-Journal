<body>
<div id="mmm-header"></div>
<script>/* ?embed=1: shown inside the admin tab, so no site header/footer */
if (/[?&]embed=1/.test(location.search)) { var h = document.getElementById('mmm-header'); if (h) h.remove(); }</script>
<main>
  <div id="gate"></div>
  <div id="app" hidden></div>
</main>
<div id="mmm-footer"></div>
<script>if (/[?&]embed=1/.test(location.search)) { var f = document.getElementById('mmm-footer'); if (f) f.remove(); }</script>
<script src="desk.js?v=20261126z"></script>
<script>
(function () {
  var gateEl = document.getElementById('gate');
  var app = document.getElementById('app');
  function gate(html) {
    gateEl.innerHTML = html ? '<div class="gate">' + html + '</div>' : '';
    app.hidden = !!html;
  }
  function open() {
    gate('');
    if (window.MMMSocialDesk) window.MMMSocialDesk.mount(app);
  }
  document.addEventListener('click', function (e) { if (e.target.id === 'b-login') window.MMM && window.MMM.openAuth('login'); });
  document.addEventListener('mmm:auth', function (e) {
    if (!(e.detail)) return gate('<h2>Log in</h2><p>This page is private. Log in with your admin email.</p><button class="btn" type="button" id="b-login">Log in</button>');
    open();
  });
  gate('<h2>Loading…</h2><p>Checking who is logged in.</p>');
})();
</script>
<script src="/assets/nav.js"></script>
<script src="/assets/site.js"></script>
</body>
